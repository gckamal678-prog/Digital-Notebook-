<!-- Read settings without connecting to Firebase -->
<script>
(function () {
  const KEY = "digital_notebook_settings";
  const DEFAULTS = {
    lang: "en",
    theme: "dark",
    font_size: "16",
    font_family: "Poppins",
    accentColor: "#10b981",
    layout: "comfortable"
  };

  let settings = {};
  try {
    settings = JSON.parse(localStorage.getItem(KEY) || "{}");
  } catch (_) {}

  if (!settings || typeof settings !== "object" || Array.isArray(settings)) {
    settings = {};
  }

  settings = { ...DEFAULTS, ...settings };

  if (!localStorage.getItem(KEY) && localStorage.getItem("theme")) {
    settings.theme = localStorage.getItem("theme");
  }

  document.documentElement.lang = settings.lang === "ne" ? "ne" : "en";
  document.documentElement.classList.toggle("dark", settings.theme !== "light");
  document.documentElement.style.setProperty(
    "--accent",
    /^#[0-9a-fA-F]{6}$/.test(settings.accentColor)
      ? settings.accentColor : DEFAULTS.accentColor
  );
  document.documentElement.style.setProperty(
    "--app-font-size",
    (Number(settings.font_size) >= 12 && Number(settings.font_size) <= 30
      ? Number(settings.font_size) : 16) + "px"
  );
  document.documentElement.dataset.layout =
    settings.layout === "compact" ? "compact" : "comfortable";
})();
</script>

<style>
:root {
  --bg: #f3f6fb;
  --panel: #ffffff;
  --field: #edf2f9;
  --text: #152033;
  --muted: #63718a;
  --line: #d7e0ed;
  --accent: #10b981;
  --app-font-size: 16px;
  --app-font-family: Poppins, Arial, sans-serif;
}
html.dark {
  --bg: #0b1220;
  --panel: #151f31;
  --field: #1c2940;
  --text: #edf3ff;
  --muted: #9cacc5;
  --line: #2b3a54;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--app-font-family);
  font-size: var(--app-font-size);
  line-height: 1.5;
}
button, input, select { font: inherit; }
button, select, input { accent-color: var(--accent); }
button {
  cursor: pointer;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
}
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button:disabled { opacity: .45; cursor: not-allowed; }
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 10px 15px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.back {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  padding: 0;
  text-decoration: none;
  font-size: 28px;
  line-height: 1;
  border-radius: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-weight: 750;
  letter-spacing: .1px;
}
.brand-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 10px;
  color: white;
  background: var(--accent);
  font-size: 19px;
}
main {
  width: min(980px, 100%);
  margin: 0 auto;
  padding: 16px;
  display: grid;
  gap: 15px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 17px;
  min-width: 0;
}
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 5px; font-size: 1.35em; }
h2 { margin-bottom: 12px; font-size: 1.12em; }
p { color: var(--muted); }
.subtext { color: var(--muted); font-size: .86em; margin-bottom: 12px; }
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.month-title {
  flex: 1;
  min-width: 145px;
  text-align: center;
  font-weight: 750;
  font-size: 1.1em;
}
.today-button, .primary {
  background: var(--accent);
  border-color: var(--accent);

  font-weight: 700;
}
.calendar-wrap { width: 100%; overflow-x: auto; }
.calendar {
  width: 100%;
  min-width: 280px;
  border-collapse: separate;
  border-spacing: 4px;

}
.calendar th {

  vertical-align: middle;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--field);

}
.calendar td.empty {
  background: transparent;
  border-color: transparent;
}
.day-number { display: block; font-weight: 700; font-size: 1.03em; }
.calendar td.today {
  border: 2px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--field));
}
.calendar td.saturday .day-number { color: var(--accent); }
.converter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.converter-box {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--field);
}
.converter-box h3 { font-size: .98em; margin-bottom: 12px; }
.field { display: grid; gap: 5px; margin-bottom: 12px; }
label { font-weight: 650; font-size: .88em; }
input, select {
  width: 100%;
  min-width: 0;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px;
}
.result {
  min-height: 44px;
  margin-top: 10px;
  padding: 10px;
  border: 1px dashed var(--line);
  border-radius: 9px;
  overflow-wrap: anywhere;
  font-weight: 600;
}
.result.success { color: var(--accent); }
.message {
  min-height: 0;
  margin: 8px 0 0;
  font-size: .82em;
  color: var(--muted);
}
.message.error { color: #fb7185; }
.message.success { color: var(--accent); }
html[data-layout="compact"] main { gap: 8px; padding: 8px; }
html[data-layout="compact"] .card { padding: 11px; border-radius: 12px; }
html[data-layout="compact"] .calendar td { height: 54px; }
@media (max-width: 600px) {
  main { padding: 10px; gap: 10px; }
  header { padding: 8px 10px; }
  .card { padding: 12px; }
  .converter-grid { grid-template-columns: 1fr; }
  .calendar { border-spacing: 2px; }
  .calendar td { height: 58px; padding: 3px 1px; }
  .controls { gap: 5px; }
  .controls button { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; }
}

<header>

<main>

<script>
"use strict";

const SETTINGS_KEY = "digital_notebook_settings";

const TEXT = {
  en: {
    calendarTitle: "AD Calendar",
    calendarDesc: "View the full Gregorian month, Sunday through Saturday.",
    today: "Today",
    converterTitle: "BS ↔ AD Date Converter",
    bsToAd: "BS → AD",
    adToBs: "AD → BS",
    bsYear: "BS Year",
    bsMonth: "BS Month",
    bsDay: "BS Day",
    adDate: "AD Date",
    convert: "Convert",
    months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
    bsMonths: ["Baisakh","Jestha","Ashadh","Shrawan","Bhadra","Ashwin","Kartik","Mangsir","Poush","Magh","Falgun","Chaitra"],
    weekdays: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
    invalidBs: "Enter a valid BS year, month and day.",
    invalidAd: "Choose a valid AD date.",
    invalidDate: "That date is invalid or unsupported.",
    libraryMissing: "Date converter unavailable. Check your internet connection and reload this page.",
    converted: "Conversion complete.",
    unsupported: "Date is outside the supported conversion range.",
    back: "Back"
  },
  ne: {
    calendarTitle: "ई.सं. क्यालेन्डर",
    calendarDesc: "आइतबारदेखि शनिबारसम्मको अंग्रेजी महिनाको क्यालेन्डर।",
    today: "आज",
    converterTitle: "वि.सं. ↔ ई.सं. मिति रूपान्तरण",
    bsToAd: "वि.सं. → ई.सं.",
    adToBs: "ई.सं. → वि.सं.",
    bsYear: "वि.सं. वर्ष",
    bsMonth: "वि.सं. महिना",
    bsDay: "वि.सं. गते",
    adDate: "अंग्रेजी मिति",
    convert: "रूपान्तरण",
    months: ["जनवरी","फेब्रुअरी","मार्च","अप्रिल","मे","जुन","जुलाई","अगस्ट","सेप्टेम्बर","अक्टोबर","नोभेम्बर","डिसेम्बर"],
    bsMonths: ["वैशाख","जेठ","असार","श्रावण","भदौ","आश्विन","कार्तिक","मंसिर","पुष","माघ","फागुन","चैत"],
    weekdays: ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"],
    invalidBs: "मान्य वि.सं. वर्ष, महिना र गते लेख्नुहोस्।",
    invalidAd: "मान्य अंग्रेजी मिति छान्नुहोस्।",
    invalidDate: "यो मिति अमान्य छ वा उपलब्ध छैन।",
    libraryMissing: "मिति रूपान्तरण library लोड भएन। इन्टरनेट जाँच गरी पेज फेरि खोल्नुहोस्।",
    converted: "मिति रूपान्तरण भयो।",
    unsupported: "यो मिति रूपान्तरणको उपलब्ध सीमाभन्दा बाहिर छ।",
    back: "पछाडि"
  }
};

const DEFAULT_SETTINGS = {
  lang: "en",
  theme: "dark",
  font_size: "16",
  font_family: "Poppins",
  accentColor: "#10b981",
  layout: "comfortable"
};

let viewYear;
let viewMonth;
let prefs = readSettings();

function readSettings() {
  try {
    const value = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    if (!value || typeof value !== "object" || Array.isArray(value)) {
      return { ...DEFAULT_SETTINGS };
    }
    return { ...DEFAULT_SETTINGS, ...value };
  } catch (_) {
    return { ...DEFAULT_SETTINGS };
  }
}

function lang() {
  return prefs.lang === "ne" ? "ne" : "en";
}

function t(key) {
  return TEXT[lang()][key] || TEXT.en[key] || key;
}

function applySettings() {
  prefs = readSettings();

  document.documentElement.lang = lang();
  document.documentElement.classList.toggle("dark", prefs.theme !== "light");

  const color = /^#[0-9a-fA-F]{6}$/.test(String(prefs.accentColor || ""))
    ? prefs.accentColor : DEFAULT_SETTINGS.accentColor;
  document.documentElement.style.setProperty("--accent", color);

  const size = Number(prefs.font_size);
  document.documentElement.style.setProperty(
    "--app-font-size",
    (size >= 12 && size <= 30 ? size : 16) + "px"
  );

  const fonts = ["Poppins", "Arial", "Roboto", "Georgia", "system-ui"];
  const font = fonts.includes(prefs.font_family) ? prefs.font_family : "Poppins";
  document.documentElement.style.setProperty("--app-font-family", '"' + font + '", Arial, sans-serif');
  document.documentElement.dataset.layout =
    prefs.layout === "compact" ? "compact" : "comfortable";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });

  document.getElementById("backButton").title = t("back");
  document.getElementById("backButton").setAttribute("aria-label", t("back"));

  renderWeekdays();
  renderCalendar();
  populateBsMonths();
  updateLibraryStatus();
}

function converterAvailable() {
  return typeof window.DateConverter === "function";
}

function updateLibraryStatus() {
  const el = document.getElementById("libraryStatus");
  el.textContent = converterAvailable() ? "" : t("libraryMissing");
  el.className = "message" + (converterAvailable() ? "" : " error");
}

function renderWeekdays() {
  const head = document.getElementById("weekdayHead");
  head.replaceChildren();

  t("weekdays").forEach(day => {
    const th = document.createElement("th");
    th.scope = "col";
    th.textContent = day;
    head.appendChild(th);
  });
}

function dateKey(year, month, day) {
  return year + "-" + String(month + 1).padStart(2, "0") + "-" +
    String(day).padStart(2, "0");
}

function todayKey() {
  const now = new Date();
  return dateKey(now.getFullYear(), now.getMonth(), now.getDate());
}

function renderCalendar() {
  const title = document.getElementById("monthTitle");
  const body = document.getElementById("calendarBody");
  body.replaceChildren();

  title.textContent = t("months")[viewMonth] + " " + viewYear;

  const firstDay = new Date(viewYear, viewMonth, 1, 12).getDay();
  const totalDays = new Date(viewYear, viewMonth + 1, 0, 12).getDate();
  const rows = Math.ceil((firstDay + totalDays) / 7);
  let day = 1;

  for (let r = 0; r < rows; r++) {
    const tr = document.createElement("tr");

    for (let c = 0; c < 7; c++) {
      const td = document.createElement("td");
      const pos = r * 7 + c;

      if (pos < firstDay || day > totalDays) {
        td.className = "empty";
        td.setAttribute("aria-hidden", "true");
      } else {
        const currentDay = day++;
        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = String(currentDay);
        td.appendChild(number);

        if (dateKey(viewYear, viewMonth, currentDay) === todayKey()) {
          td.classList.add("today");
          td.setAttribute("aria-current", "date");
        }

        if (c === 6) td.classList.add("saturday");

        td.setAttribute(
          "aria-label",
          t("weekdays")[c] + ", " + t("months")[viewMonth] +
          " " + currentDay + ", " + viewYear
        );
      }

      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

function populateBsMonths() {
  const select = document.getElementById("bsMonth");
  const oldValue = select.value;
  select.replaceChildren();

  t("bsMonths").forEach((month, index) => {
    const option = document.createElement("option");
    option.value = String(index + 1);
    option.textContent = (index + 1) + ". " + month;
    select.appendChild(option);
  });

  if (oldValue) select.value = oldValue;
}

function setMessage(id, message, type = "") {
  const el = document.getElementById(id);
  el.textContent = message;
  el.className = "message" + (type ? " " + type : "");
}

function pad(number) {
  return String(number).padStart(2, "0");
}

function formatDate(year, month, day) {
  return Number(year) + "-" + pad(Number(month)) + "-" + pad(Number(day));
}

function validDateParts(year, month, day) {
  return Number.isInteger(year) &&
    Number.isInteger(month) &&
    Number.isInteger(day) &&
    month >= 1 && month <= 12 &&
    day >= 1 && day <= 31;
}

function convertBsToAd() {
  const result = document.getElementById("bsToAdResult");
  result.textContent = "—";
  result.className = "result";
  setMessage("bsToAdMessage", "");

  if (!converterAvailable()) {
    setMessage("bsToAdMessage", t("libraryMissing"), "error");
    updateLibraryStatus();
    return;
  }

  const year = Number(document.getElementById("bsYear").value);
  const month = Number(document.getElementById("bsMonth").value);
  const day = Number(document.getElementById("bsDay").value);

  if (!Number.isInteger(year) || year < 1975 || year > 2099 ||
      !validDateParts(year, month, day)) {
    setMessage("bsToAdMessage", t("invalidBs"), "error");
    return;
  }

  try {
    const converter = new window.DateConverter(formatDate(year, month, day));
    const ad = converter.toAd();

    if (!ad || !validDateParts(Number(ad.year), Number(ad.month), Number(ad.date))) {
      throw new Error("Invalid conversion result");
    }

    const adText = formatDate(ad.year, ad.month, ad.date);

    // Check reverse conversion to reject invalid BS dates or silent rollover.
    const reverse = new window.DateConverter(adText).toBs();
    if (!reverse ||
        Number(reverse.year) !== year ||
        Number(reverse.month) !== month ||
        Number(reverse.date) !== day) {
      throw new Error("Date did not round-trip");
    }

    result.textContent = adText;
    result.className = "result success";
    setMessage("bsToAdMessage", t("converted"), "success");
  } catch (_) {
    setMessage("bsToAdMessage", t("invalidDate"), "error");
  }
}

function convertAdToBs() {
  const result = document.getElementById("adToBsResult");
  result.textContent = "—";
  result.className = "result";
  setMessage("adToBsMessage", "");

  if (!converterAvailable()) {
    setMessage("adToBsMessage", t("libraryMissing"), "error");
    updateLibraryStatus();
    return;
  }

  const value = document.getElementById("adDate").value;
  if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) {
    setMessage("adToBsMessage", t("invalidAd"), "error");
    return;
  }

  const [year, month, day] = value.split("-").map(Number);
  const date = new Date(year, month - 1, day, 12, 0, 0);

  if (date.getFullYear() !== year ||
      date.getMonth() !== month - 1 ||
      date.getDate() !== day) {
    setMessage("adToBsMessage", t("invalidAd"), "error");
    return;
  }

  try {
    const bs = new window.DateConverter(value).toBs();

    if (!bs || !validDateParts(Number(bs.year), Number(bs.month), Number(bs.date))) {
      throw new Error("Invalid conversion result");
    }

    const bsText = formatDate(bs.year, bs.month, bs.date);

    // Check reverse conversion so invalid/out-of-range results are not shown.
    const reverse = new window.DateConverter(bsText).toAd();
    if (!reverse ||
        Number(reverse.year) !== year ||
        Number(reverse.month) !== month ||
        Number(reverse.date) !== day) {
      throw new Error("Date did not round-trip");
    }

    result.textContent = bsText;
    result.className = "result success";
    setMessage("adToBsMessage", t("converted"), "success");
  } catch (_) {
    setMessage("adToBsMessage", t("unsupported"), "error");
  }
}

function shiftMonth(amount) {
  const next = new Date(viewYear, viewMonth + amount, 1, 12);
  viewYear = next.getFullYear();
  viewMonth = next.getMonth();
  renderCalendar();
}

document.getElementById("previousMonth").addEventListener("click", () => shiftMonth(-1));
document.getElementById("nextMonth").addEventListener("click", () => shiftMonth(1));

document.getElementById("todayButton").addEventListener("click", () => {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  renderCalendar();
});

document.getElementById("convertBsToAd").addEventListener("click", convertBsToAd);
document.getElementById("convertAdToBs").addEventListener("click", convertAdToBs);

document.getElementById("bsYear").addEventListener("keydown", event => {
  if (event.key === "Enter") convertBsToAd();
});
document.getElementById("bsDay").addEventListener("keydown", event => {
  if (event.key === "Enter") convertBsToAd();
});

document.getElementById("backButton").addEventListener("click", event => {
  if (window.history.length > 1) {
    event.preventDefault();
    window.history.back();
  }
});

window.addEventListener("storage", event => {
  if (event.key === SETTINGS_KEY || event.key === "theme") {
    applySettings();
  }
});

const now = new Date();
viewYear = now.getFullYear();
viewMonth = now.getMonth();

document.getElementById("adDate").value =
  viewYear + "-" + pad(viewMonth + 1) + "-" + pad(now.getDate());

/* Use today's BS date as the default when the converter is available.
   Otherwise leave fields editable and let the user enter a date. */
function setDefaultBsDate() {
  if (!converterAvailable()) {
    document.getElementById("bsYear").value = "";
    document.getElementById("bsMonth").value = "1";
    document.getElementById("bsDay").value = "";
    updateLibraryStatus();
    return;
  }

  try {
    const adText = document.getElementById("adDate").value;
    const bs = new window.DateConverter(adText).toBs();

    document.getElementById("bsYear").value = bs.year;
    document.getElementById("bsMonth").value = String(bs.month);
    document.getElementById("bsDay").value = bs.date;
  } catch (_) {
    document.getElementById("bsYear").value = "";
    document.getElementById("bsMonth").value = "1";
    document.getElementById("bsDay").value = "";
  }

  updateLibraryStatus();
}

applySettings();
setDefaultBsDate();
</script>
</body>
</html>
