<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Digital NoteBook - Calendar</title>

<!-- Read settings without connecting to Firebase -->
<script>
(function () {
  const KEY = "digital_notebook_settings";
  const DEFAULTS = {
    lang: "en",
    theme: "dark",
    font_size: "16",
    font_family: "Poppins",
    accentColor: "#10b981",
    layout: "comfortable"
  };

  let settings = {};
  try {
    settings = JSON.parse(localStorage.getItem(KEY) || "{}");
  } catch (_) {}

  if (!settings || typeof settings !== "object" || Array.isArray(settings)) {
    settings = {};
  }

  settings = { ...DEFAULTS, ...settings };

  if (!localStorage.getItem(KEY) && localStorage.getItem("theme")) {
    settings.theme = localStorage.getItem("theme");
  }

  document.documentElement.lang = settings.lang === "ne" ? "ne" : "en";
  document.documentElement.classList.toggle("dark", settings.theme !== "light");
  document.documentElement.style.setProperty(
    "--accent",
    /^#[0-9a-fA-F]{6}$/.test(settings.accentColor)
      ? settings.accentColor : DEFAULTS.accentColor
  );
  document.documentElement.style.setProperty(
    "--app-font-size",
    (Number(settings.font_size) >= 12 && Number(settings.font_size) <= 30
      ? Number(settings.font_size) : 16) + "px"
  );
  document.documentElement.dataset.layout =
    settings.layout === "compact" ? "compact" : "comfortable";
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f3f6fb;
  --panel: #ffffff;
  --field: #edf2f9;
  --text: #152033;
  --muted: #63718a;
  --line: #d7e0ed;
  --accent: #10b981;
  --app-font-size: 16px;
  --app-font-family: Poppins, Arial, sans-serif;
}
html.dark {
  --bg: #0b1220;
  --panel: #151f31;
  --field: #1c2940;
  --text: #edf3ff;
  --muted: #9cacc5;
  --line: #2b3a54;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--app-font-family);
  font-size: var(--app-font-size);
  line-height: 1.5;
}
button { font: inherit; accent-color: var(--accent); }
button {
  cursor: pointer;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
}
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button:disabled { opacity: .45; cursor: not-allowed; }
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 10px 15px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.back {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  padding: 0;
  text-decoration: none;
  font-size: 28px;
  line-height: 1;
  border-radius: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-weight: 750;
  letter-spacing: .1px;
}
.brand-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 10px;
  color: white;
  background: var(--accent);
  font-size: 19px;
}
main {
  width: min(980px, 100%);
  margin: 0 auto;
  padding: 16px;
  display: grid;
  gap: 15px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 17px;
  min-width: 0;
}
h1, p { margin-top: 0; }
h1 { margin-bottom: 5px; font-size: 1.35em; }
p { color: var(--muted); }
.subtext { color: var(--muted); font-size: .86em; margin-bottom: 12px; }
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.month-title {
  flex: 1;
  min-width: 145px;
  text-align: center;
  font-weight: 750;
  font-size: 1.1em;
}
.today-button {
  background: var(--accent);
  border-color: var(--accent);
  color: #062319;
  font-weight: 700;
}
.calendar-wrap { width: 100%; overflow-x: auto; }
.calendar {
  width: 100%;
  min-width: 280px;
  border-collapse: separate;
  border-spacing: 4px;
  table-layout: fixed;
}
.calendar th {
  padding: 8px 1px;
  color: var(--muted);
  font-size: .78em;
  font-weight: 700;
}
.calendar td {
  height: 68px;
  padding: 5px 3px;
  text-align: center;
  vertical-align: middle;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--field);
  overflow-wrap: anywhere;
}
.calendar td.empty {
  background: transparent;
  border-color: transparent;
}
.day-number { display: block; font-weight: 700; font-size: 1.03em; }
.calendar td.today {
  border: 2px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--field));
}
.calendar td.saturday .day-number { color: var(--accent); }
html[data-layout="compact"] main { gap: 8px; padding: 8px; }
html[data-layout="compact"] .card { padding: 11px; border-radius: 12px; }
html[data-layout="compact"] .calendar td { height: 54px; }
@media (max-width: 600px) {
  main { padding: 10px; gap: 10px; }
  header { padding: 8px 10px; }
  .card { padding: 12px; }
  .calendar { border-spacing: 2px; }
  .calendar td { height: 58px; padding: 3px 1px; }
  .controls { gap: 5px; }
  .controls button { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; }
}
</style>
</head>

<body>
<header>
  <a class="back" id="backButton" href="index.html" aria-label="Back" title="Back">←</a>
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">📘</span>
    <span>Digital NoteBook</span>
  </div>
</header>

<main>
  <!-- Calendar section -->
  <section class="card">
    <h1 data-i18n="calendarTitle">AD Calendar</h1>
    <p class="subtext" data-i18n="calendarDesc">View the full Gregorian month, Sunday through Saturday.</p>

    <div class="controls">
      <button id="previousMonth" type="button" aria-label="Previous month">←</button>
      <div id="monthTitle" class="month-title" aria-live="polite"></div>
      <button id="nextMonth" type="button" aria-label="Next month">→</button>
      <button id="todayButton" class="today-button" type="button" data-i18n="today">Today</button>
    </div>

    <div class="calendar-wrap">
      <table class="calendar" aria-label="Monthly calendar">
        <thead><tr id="weekdayHead"></tr></thead>
        <tbody id="calendarBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
"use strict";

const SETTINGS_KEY = "digital_notebook_settings";

const TEXT = {
  en: {
    calendarTitle: "AD Calendar",
    calendarDesc: "View the full Gregorian month, Sunday through Saturday.",
    today: "Today",
    months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
    weekdays: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    back: "Back"
  },
  ne: {
    calendarTitle: "ई.सं. क्यालेन्डर",
    calendarDesc: "आइतबारदेखि शनिबारसम्मको अंग्रेजी महिनाको क्यालेन्डर।",
    today: "आज",
    months: ["जनवरी","फेब्रुअरी","मार्च","अप्रिल","मे","जुन","जुलाई","अगस्ट","सेप्टेम्बर","अक्टोबर","नोभेम्बर","डिसेम्बर"],
    weekdays: ["आइत","सोम","मंगल","बुध","बिही","शुक्र","शनि"],
    back: "पछाडि"
  }
};

const DEFAULT_SETTINGS = {
  lang: "en",
  theme: "dark",
  font_size: "16",
  font_family: "Poppins",
  accentColor: "#10b981",
  layout: "comfortable"
};

let viewYear;
let viewMonth;
let prefs = readSettings();

function readSettings() {
  try {
    const value = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    if (!value || typeof value !== "object" || Array.isArray(value)) {
      return { ...DEFAULT_SETTINGS };
    }
    return { ...DEFAULT_SETTINGS, ...value };
  } catch (_) {
    return { ...DEFAULT_SETTINGS };
  }
}

function lang() {
  return prefs.lang === "ne" ? "ne" : "en";
}

function t(key) {
  return TEXT[lang()][key] || TEXT.en[key] || key;
}

function applySettings() {
  prefs = readSettings();

  document.documentElement.lang = lang();
  document.documentElement.classList.toggle("dark", prefs.theme !== "light");

  const color = /^#[0-9a-fA-F]{6}$/.test(String(prefs.accentColor || ""))
    ? prefs.accentColor : DEFAULT_SETTINGS.accentColor;
  document.documentElement.style.setProperty("--accent", color);

  const size = Number(prefs.font_size);
  document.documentElement.style.setProperty(
    "--app-font-size",
    (size >= 12 && size <= 30 ? size : 16) + "px"
  );

  const fonts = ["Poppins", "Arial", "Roboto", "Georgia", "system-ui"];
  const font = fonts.includes(prefs.font_family) ? prefs.font_family : "Poppins";
  document.documentElement.style.setProperty("--app-font-family", '"' + font + '", Arial, sans-serif');
  document.documentElement.dataset.layout =
    prefs.layout === "compact" ? "compact" : "comfortable";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });

  document.getElementById("backButton").title = t("back");
  document.getElementById("backButton").setAttribute("aria-label", t("back"));

  renderWeekdays();
  renderCalendar();
}

function renderWeekdays() {
  const head = document.getElementById("weekdayHead");
  head.replaceChildren();

  t("weekdays").forEach(day => {
    const th = document.createElement("th");
    th.scope = "col";
    th.textContent = day;
    head.appendChild(th);
  });
}

function dateKey(year, month, day) {
  return year + "-" + String(month + 1).padStart(2, "0") + "-" +
    String(day).padStart(2, "0");
}

function todayKey() {
  const now = new Date();
  return dateKey(now.getFullYear(), now.getMonth(), now.getDate());
}

function renderCalendar() {
  const title = document.getElementById("monthTitle");
  const body = document.getElementById("calendarBody");
  body.replaceChildren();

  title.textContent = t("months")[viewMonth] + " " + viewYear;

  const firstDay = new Date(viewYear, viewMonth, 1, 12).getDay();
  const totalDays = new Date(viewYear, viewMonth + 1, 0, 12).getDate();
  const rows = Math.ceil((firstDay + totalDays) / 7);
  let day = 1;

  for (let r = 0; r < rows; r++) {
    const tr = document.createElement("tr");

    for (let c = 0; c < 7; c++) {
      const td = document.createElement("td");
      const pos = r * 7 + c;

      if (pos < firstDay || day > totalDays) {
        td.className = "empty";
        td.setAttribute("aria-hidden", "true");
      } else {
        const currentDay = day++;
        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = String(currentDay);
        td.appendChild(number);

        if (dateKey(viewYear, viewMonth, currentDay) === todayKey()) {
          td.classList.add("today");
          td.setAttribute("aria-current", "date");
        }

        if (c === 6) td.classList.add("saturday");

        td.setAttribute(
          "aria-label",
          t("weekdays")[c] + ", " + t("months")[viewMonth] +
          " " + currentDay + ", " + viewYear
        );
      }

      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

function shiftMonth(amount) {
  const next = new Date(viewYear, viewMonth + amount, 1, 12);
  viewYear = next.getFullYear();
  viewMonth = next.getMonth();
  renderCalendar();
}

document.getElementById("previousMonth").addEventListener("click", () => shiftMonth(-1));
document.getElementById("nextMonth").addEventListener("click", () => shiftMonth(1));

document.getElementById("todayButton").addEventListener("click", () => {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  renderCalendar();
});

document.getElementById("backButton").addEventListener("click", event => {
  if (window.history.length > 1) {
    event.preventDefault();
    window.history.back();
  }
});

window.addEventListener("storage", event => {
  if (event.key === SETTINGS_KEY || event.key === "theme") {
    applySettings();
  }
});

const now = new Date();
viewYear = now.getFullYear();
viewMonth = now.getMonth();

applySettings();
</script>
</body>
</html>
