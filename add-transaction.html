<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Digital NoteBook</title><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><style>
:root{--bg:#0b1220;--panel:#151f31;--field:#1c2940;--text:#edf3ff;--muted:#9cacc5;--line:#2b3a54;--accent:#34d399;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Sans Devanagari",sans-serif}html.light{--bg:#f3f6fb;--panel:#fff;--field:#edf2f9;--text:#152033;--muted:#586780;--line:#d7e0ed;--accent:#047857;--danger:#be123c}header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:3}header a{color:var(--text);text-decoration:none;font-size:24px}header b{flex:1}main{max-width:980px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label{display:block;color:var(--muted);font-size:13px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);color:var(--text);width:100%;margin-top:4px}button{cursor:pointer;font-weight:650}.primary{background:var(--accent);color:#062319}.danger{color:var(--danger)}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{width:auto}.record{border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{width:auto}.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#166534;color:white;padding:12px 16px;border-radius:12px;z-index:20;max-width:92vw}.hidden{display:none!important}table{border-collapse:collapse;width:100%;margin-top:10px}td,th{border:1px solid var(--line);padding:7px;text-align:left}.status{font-size:12px;color:var(--muted)}@media(max-width:560px){main{padding:10px}.card{padding:12px}}
</style><script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script></head><body data-path="transactions"><header><a href="index.html" aria-label="पछाडि">←</a><b>📘 Digital NoteBook · Transaction</b><span class="status" id="status">जडान हुँदैछ…</span></header><main><section class="card"><h2>Transaction / Party Ledger</h2><p class="muted">Receivable, Payable, Expense · 1 INR = 1.6 NPR · Simple interest</p><form id="form"><input id="recordId" type="hidden"><div class="grid"><label>मिति<input id="date" type="date" required></label><label>Party / समूह<input id="party" maxlength="120" required></label><label>प्रकार<select id="type"><option>Receivable</option><option>Payable</option><option>Expense</option></select></label><label>ब्याज दर (%/महिना)<input id="rate" type="number" min="0" step="any" value="0"></label><label>महिना<input id="period" type="number" min="0" step="any" value="0"></label><label>रकम NPR<input id="npr" type="number" min="0" step="any" value="0"></label><label>रकम INR<input id="inr" type="number" min="0" step="any" value="0"></label><label>कुल NPR<input id="total" readonly></label><label>कैफियत<input id="note" maxlength="1000"></label></div><div class="row"><button class="primary" type="submit">सेभ गर्नुहोस्</button><button type="button" id="cancel">रद्द</button><button type="button" id="migrate">पुरानो डाटा सुरक्षित Import</button><button type="button" id="pdf">सबै Ledger PDF</button></div></form></section><section class="card"><h2>रेकर्डहरू</h2><input id="search" placeholder="Party वा कैफियत खोज्नुहोस्"><div id="list"></div></section><section class="card"><h2>Trash</h2><div id="trash"></div></section></main>
<script>
const CFG={apiKey:'AIzaSyDD_yv7RHnkCTI6uyV4DNDjqoaIBGweg8c',authDomain:'digital-a2552.firebaseapp.com',databaseURL:'https://digital-a2552-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'digital-a2552',storageBucket:'digital-a2552.firebasestorage.app',messagingSenderId:'218135618179',appId:'1:218135618179:web:821b76920d3e5669ac31b6'};
if(!firebase.apps.length)firebase.initializeApp(CFG);const auth=firebase.auth(),db=firebase.database(),$=id=>document.getElementById(id),RATE=1.6,DAY=86400000;let uid=null,items={},trash={},listener=null;
function toast(s,bad=false){const e=document.createElement('div');e.className='toast';e.style.background=bad?'#9f1239':'#166534';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3200)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function n(v){return Number(v)||0}function money(v){return 'NPR '+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}function ref(path){return db.ref('users/'+uid+'/'+path)}function recordValues(){return Object.entries(items).map(([id,v])=>({...(v||{}),id:v?.id||id})).filter(x=>x&&typeof x==='object')}
async function saveOne(path,id,data){const r=ref(path+'/'+id);const result=await r.transaction(old=>{if($('recordId').value&&old===null)return;return {...(old||{}),...data,id,createdAt:old?.createdAt||data.createdAt||Date.now(),updatedAt:Date.now()}},undefined,false);if(!result.committed)throw Error('रेकर्ड परिवर्तन भएको वा हटाइएको छ। Refresh गरेर पुनः प्रयास गर्नुहोस्।')}
async function moveTrash(path,id){const item=items[id];if(!item)return;const now=Date.now(),cat=path.split('/')[0],entry={id,category:cat,recordType:cat,originalPath:'users/'+uid+'/'+path+'/'+id,data:{...item,id},deletedAt:now,expiresAt:now+30*DAY,schemaVersion:1};try{const updates={};updates[path+'/'+id]=null;updates['trash/'+cat+'/'+id]=entry;await ref('').update(updates);toast('रेकर्ड Trash मा सारियो। ३० दिनभित्र Account बाट Restore गर्न सकिन्छ।')}catch(e){toast('मेटाउन सकिएन: '+e.message,true)}}
function renderTrash(){const root=$('trash');if(!root)return;const arr=[];Object.entries(trash||{}).forEach(([cat,g])=>{if(!g||typeof g!=='object')return;Object.entries(g).forEach(([id,v])=>{if(v&&typeof v==='object'&&(v.data||v.originalPath))arr.push({...v,id,category:v.category||cat})})});root.innerHTML=arr.sort((a,b)=>n(b.deletedAt)-n(a.deletedAt)).map(v=>`<div class="record"><b>${esc(v.data?.title||v.data?.sourceName||v.data?.party||v.recordType||'रेकर्ड')}</b><p class="muted">म्याद: ${v.expiresAt?new Date(v.expiresAt).toLocaleString():'अज्ञात'}</p><button data-restore="${esc(v.category+'/'+v.id)}" ${n(v.expiresAt)<=Date.now()?'disabled':''}>Restore</button></div>`).join('')||'<p class="muted">Trash खाली छ।</p>'}
$('trash')?.addEventListener('click',async e=>{const b=e.target.closest('[data-restore]');if(!b)return;const [cat,id]=b.dataset.restore.split('/'),v=trash?.[cat]?.[id];if(!v||!v.data||n(v.expiresAt)<=Date.now())return toast('यो रेकर्ड Restore गर्न मिल्दैन।',true);try{const r=db.ref(v.originalPath);const result=await r.transaction(old=>old===null?v.data:undefined,undefined,false);if(!result.committed)return toast('त्यही ID को रेकर्ड पहिल्यै छ; केही overwrite गरिएको छैन।',true);await ref('trash/'+cat+'/'+id).remove();toast('रेकर्ड Restore भयो।')}catch(err){toast('Restore असफल: '+err.message,true)}});
function attach(path){if(listener)ref(path).off('value',listener);listener=s=>{const raw=s.val()||{};if(Array.isArray(raw)){const mapped={};raw.forEach((v,i)=>{if(!v||typeof v!=='object')return;let id=typeof v.id==='string'&&v.id&&!/[.#$\[\]\/]/.test(v.id)&&!mapped[v.id]?v.id:db.ref('users/'+uid+'/'+document.body.dataset.path).push().key;mapped[id]={...v,id}});items=mapped;$('status').textContent='पुरानो array ढाँचा सुरक्षित ID मा रूपान्तरण हुँदैछ…';ref(document.body.dataset.path).transaction(current=>Array.isArray(current)?mapped:undefined,(err,result)=>{if(err){console.error(err);toast('पुरानो रेकर्ड ID सुधार्न सकिएन: '+err.message,true)}},false).catch(e=>console.error(e));}else items=raw;render();$('status').textContent='Cloud Sync · '+new Date().toLocaleTimeString()};ref(path).on('value',listener,e=>{console.error(e);$('status').textContent='Sync त्रुटि: '+e.message;toast('Firebase Database Rules/इन्टरनेट जाँच गर्नुहोस्: '+e.message,true)});ref('trash').on('value',s=>{trash=s.val()||{};renderTrash()})}
function exportPdf(title,html){if(!window.html2pdf)return toast('PDF library लोड भएन। इन्टरनेट जाँच गर्नुहोस्।',true);const el=document.createElement('div');el.style.cssText='padding:20px;background:white;color:#111;font:12px Arial';el.innerHTML='<h1>'+esc(title)+'</h1>'+html;html2pdf().set({margin:8,filename:title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.pdf',html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}}).from(el).save().catch(e=>toast('PDF त्रुटि: '+e.message,true))}
async function migrateLocalSafely(){if(!uid)return toast('पहिले लगइन गर्नुहोस्।',true);const path=document.body.dataset.path,key=path==='transactions'?'digital_notebook_transactions':path==='incomes'?'digital_notebook_incomes':'digital_notebook_savings',marker=ref('migration/local-'+path+'-v1');try{if((await marker.once('value')).exists())return toast('यस पेजको migration पहिले नै चलाइएको छ।',true);const cloud=await ref(path).once('value');if(cloud.exists()&&Object.keys(cloud.val()||{}).length)return toast('Cloud मा रेकर्ड छन्; overwrite नहोस् भनेर migration रोकियो।',true);let old=[];try{const parsed=JSON.parse(localStorage.getItem(key)||'[]');old=Array.isArray(parsed)?parsed:Object.values(parsed||{})}catch(e){return toast('स्थानीय पुरानो डाटा पढ्न सकिएन।',true)}if(!old.length)return toast('Import गर्न पुरानो स्थानीय डाटा भेटिएन।',true);const again=await ref(path).once('value');if(again.exists()&&Object.keys(again.val()||{}).length)return toast('यसबीच Cloud डाटा थपिएकोले migration रोकियो।',true);let count=0;for(const raw of old){if(!raw||typeof raw!=='object')continue;const id=typeof raw.id==='string'&&raw.id&&!/[.#$\[\]\/]/.test(raw.id)?raw.id:ref(path).push().key;const result=await ref(path+'/'+id).transaction(current=>current===null?{...raw,id,createdAt:raw.createdAt||Date.now(),updatedAt:Date.now(),migratedFromLocal:true}:undefined,undefined,false);if(result.committed)count++}await marker.set({completedAt:Date.now(),imported:count,source:key});toast('Import सकियो: '+count+' रेकर्ड। पुरानो local data सुरक्षित राखिएको छ।')}catch(e){console.error(e);toast('Migration असफल: '+e.message,true)}}$('migrate').onclick=migrateLocalSafely;
auth.onAuthStateChanged(async u=>{if(!u){location.replace('index.html');return}uid=u.uid;$('status').textContent='लगइन भयो · Cloud जोडिँदैछ…';attach(document.body.dataset.path);});window.addEventListener('offline',()=>{$('status').textContent='अफलाइन — cloud save हुन सक्दैन';toast('इन्टरनेट छैन।',true)});window.addEventListener('online',()=>$('status').textContent='इन्टरनेट फर्कियो · Sync जाँच हुँदैछ');

const PATH='transactions';function calc(){let a=n($('npr').value)+n($('inr').value)*RATE;if($('type').value!=='Expense')a+=a*n($('rate').value)*n($('period').value)/100;$('total').value=a.toFixed(2);return a}['npr','inr','rate','period','type'].forEach(x=>$(x).addEventListener('input',calc));$('date').value=new Date().toISOString().slice(0,10);function reset(){ $('form').reset();$('recordId').value='';$('date').value=new Date().toISOString().slice(0,10);$('rate').value='0';$('period').value='0';$('npr').value='0';$('inr').value='0';calc()}function render(){let a=recordValues().filter(x=>(String(x.party||'')+' '+String(x.note||'')).toLowerCase().includes($('search').value.toLowerCase()));a.sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));$('list').innerHTML=a.map(r=>`<div class="record"><b>${esc(r.party)}</b> · ${esc(r.date)}<p>${esc(r.type)} · ${money(r.total)} · ${esc(r.note||'')}</p><div class="actions"><button data-edit="${esc(r.id)}">Edit</button><button class="danger" data-del="${esc(r.id)}">Trash</button></div></div>`).join('')||'<p class="muted">रेकर्ड छैन।</p>'} $('form').onsubmit=async e=>{e.preventDefault();if(!uid)return;const id=$('recordId').value||ref(PATH).push().key;const data={date:$('date').value,party:$('party').value.trim(),type:$('type').value,rate:n($('rate').value),period:n($('period').value),npr:n($('npr').value),inr:n($('inr').value),total:calc(),note:$('note').value.trim()};try{await saveOne(PATH,id,data);reset();toast('Transaction cloud मा सेभ भयो।')}catch(err){toast('सेभ असफल: '+err.message,true)}};$('list').onclick=async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(ed){const r=items[ed.dataset.edit];if(!r)return; $('recordId').value=ed.dataset.edit;['date','party','type','rate','period','npr','inr','note'].forEach(k=>$(k).value=r[k]??'');calc();window.scrollTo({top:0,behavior:'smooth'})}if(del)await moveTrash(PATH,del.dataset.del)};$('search').oninput=render;$('cancel').onclick=reset;$('pdf').onclick=()=>{const a=recordValues();exportPdf('Transaction Ledger','<table><tr><th>Date</th><th>Party</th><th>Type</th><th>Total NPR</th><th>Note</th></tr>'+a.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.party)}</td><td>${esc(r.type)}</td><td>${n(r.total).toFixed(2)}</td><td>${esc(r.note)}</td></tr>`).join('')+'</table>')};
</script>
</body></html>
