<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
      authDomain: "digital-a2552.firebaseapp.com",
      projectId: "digital-a2552",
      storageBucket: "digital-a2552.firebasestorage.app",
      messagingSenderId: "218135618179",
      appId: "1:218135618179:web:821b76920d3e5669ac31b6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function backupToCloud(userId = "default_user") {
        try {
            const localData = {
                transactions: JSON.parse(localStorage.getItem('digital_notebook_transactions') || '[]'),
                theme: localStorage.getItem('theme') || 'dark',
                language: localStorage.getItem('lang') || 'EN',
                updatedAt: new Date().toISOString()
            };
            await set(ref(db, 'users/' + userId), localData);
            showToast(currentLang === 'NEP' ? 'डाटा सफलतापूर्वक सेभ भयो!' : 'Data successfully saved!', 'success');
        } catch (error) {
            console.error("Cloud Backup Error:", error);
            showToast(error.message, 'error');
        }
    }

    async function restoreFromCloud(userId = "default_user") {
        try {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users/${userId}`));
            if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.transactions) localStorage.setItem('digital_notebook_transactions', JSON.stringify(data.transactions));
                if (data.theme) localStorage.setItem('theme', data.theme);
                if (data.language) localStorage.setItem('lang', data.language);
                
                showToast(currentLang === 'NEP' ? 'डाटा सफलतापूर्वक सिंक भयो!' : 'Data successfully synced!', 'success');
                setTimeout(() => location.reload(), 1000);
            } else {
                showToast(currentLang === 'NEP' ? 'कुनै ब्याकअप फेला परेन!' : 'No backup found!', 'error');
            }
        } catch (error) {
            console.error("Cloud Restore Error:", error);
            showToast(error.message, 'error');
        }
    }

    window.handleCloudBackup = () => backupToCloud("default_user");
    window.handleCloudRestore = () => restoreFromCloud("default_user");
</script>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';
    let isPrivate = localStorage.getItem('isPrivate') === 'true';

    function updatePrivacyUI() {
        const icon = document.getElementById('privacy-icon');
        if (icon) {
            if (isPrivate) {
                icon.className = 'fa-solid fa-eye-slash text-xs text-rose-400';
            } else {
                icon.className = 'fa-solid fa-eye text-xs';
            }
        }
    }

    function togglePrivacy() {
        isPrivate = !isPrivate;
        localStorage.setItem('isPrivate', isPrivate);
        updatePrivacyUI();
        calculateTotalAmount();
        renderPartyAccounts();
    }

    function formatAmount(amount) {
        if (isPrivate) {
            return '••••••';
        }
        return `Rs ${parseFloat(amount).toFixed(2)}`;
    }

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        updateDynamicHeader();
        renderPartyAccounts();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeUI();
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const timeString = now.toLocaleTimeString('en-US', timeOptions);

        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = `${dateString} | ${timeString}`;
    }

    setInterval(updateDynamicHeader, 1000);

    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        if(content) content.classList.toggle('hidden');
        if(icon) icon.classList.toggle('rotate-180');
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if(!container) return;
        const toast = document.createElement('div');
        toast.className = `${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2`;
        toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    const INR_RATE = 1.6;

    function handleTypeChange() {
        const type = document.getElementById('txn-type').value;
        const interestWrapper = document.getElementById('interest-fields-wrapper');
        if (type === 'Expense') {
            interestWrapper.classList.add('hidden');
            document.getElementById('txn-interest-rate').value = 0;
            document.getElementById('txn-period').value = 0;
        } else {
            interestWrapper.classList.remove('hidden');
        }
        calculateTotalAmount();
    }

    function calculateTotalAmount() {
        const npr = parseFloat(document.getElementById('txn-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('txn-amount-inr').value) || 0;
        let principal = npr + (inr * INR_RATE);

        const type = document.getElementById('txn-type').value;
        if (type !== 'Expense') {
            const rate = parseFloat(document.getElementById('txn-interest-rate').value) || 0;
            const period = parseFloat(document.getElementById('txn-period').value) || 0;
            const interest = (principal * rate * period) / 100;
            principal += interest;
        }

        const totalCalcEl = document.getElementById('txn-total-calc');
        if (isPrivate) {
            totalCalcEl.value = '••••••';
        } else {
            totalCalcEl.value = principal.toFixed(2);
        }
    }

    function saveTransaction(event) {
        event.preventDefault();
        const index = document.getElementById('edit-txn-index').value;
        const date = document.getElementById('txn-date').value;
        const party = document.getElementById('txn-party').value.trim();
        const type = document.getElementById('txn-type').value;
        const rate = parseFloat(document.getElementById('txn-interest-rate').value) || 0;
        const period = parseFloat(document.getElementById('txn-period').value) || 0;
        const npr = parseFloat(document.getElementById('txn-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('txn-amount-inr').value) || 0;
        
        let principal = npr + (inr * INR_RATE);
        if (type !== 'Expense') {
            const interest = (principal * rate * period) / 100;
            principal += interest;
        }
        const total = principal;

        const note = document.getElementById('txn-note').value.trim();

        let transactions = JSON.parse(localStorage.getItem('digital_notebook_transactions') || '[]');
        const item = { date, party, type, rate, period, npr, inr, total, note };

        if (index === "") {
            transactions.unshift(item);
            showToast('कारोबार सफलतापूर्वक सेभ भयो!', 'success');
        } else {
            transactions[index] = item;
            showToast('कारोबार रेकर्ड अपडेट भयो!', 'success');
        }

        localStorage.setItem('digital_notebook_transactions', JSON.stringify(transactions));
        resetTxnForm();
        renderPartyAccounts();
    }

    function resetTxnForm() {
        document.getElementById('transaction-form').reset();
        document.getElementById('edit-txn-index').value = "";
        document.getElementById('txn-submit-btn').innerText = currentLang === 'NEP' ? 'कारोबार सेभ गर्नुहोस्' : 'Save Transaction';
        document.getElementById('txn-cancel-btn').classList.add('hidden');
        document.getElementById('txn-date').valueAsDate = new Date();
        handleTypeChange();
    }

    function renderPartyAccounts() {
        const container = document.getElementById('party-list-container');
        const searchQuery = (document.getElementById('search-party')?.value || '').toLowerCase();
        const sortOption = document.getElementById('sort-party')?.value || 'name';
        if(!container) return;

        let transactions = JSON.parse(localStorage.getItem('digital_notebook_transactions') || '[]');
        container.innerHTML = '';

        if (transactions.length === 0) {
            container.innerHTML = `<p class="text-slate-400 text-center py-3">${currentLang === 'NEP' ? 'कुनै कारोबार रेकर्ड फेला परेन।' : 'No transaction records found.'}</p>`;
            return;
        }

        const parties = {};
        transactions.forEach((tx, idx) => {
            const rawName = tx.party || 'Unknown';
            const matchedKey = Object.keys(parties).find(k => k.toLowerCase() === rawName.toLowerCase()) || rawName;

            if (!parties[matchedKey]) {
                parties[matchedKey] = {
                    name: matchedKey,
                    balance: 0,
                    items: []
                };
            }
            parties[matchedKey].items.push({ ...tx, originalIndex: idx });

            if (tx.type === 'Receivable') {
                parties[matchedKey].balance += tx.total;
            } else if (tx.type === 'Payable') {
                parties[matchedKey].balance -= tx.total;
            } else if (tx.type === 'Expense') {
                parties[matchedKey].balance -= tx.total;
            }
        });

        let partyArray = Object.values(parties);

        if (searchQuery) {
            partyArray = partyArray.filter(p => p.name.toLowerCase().includes(searchQuery));
        }

        if (sortOption === 'name') {
            partyArray.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortOption === 'balance_desc') {
            partyArray.sort((a, b) => b.balance - a.balance);
        } else if (sortOption === 'date_desc') {
            partyArray.sort((a, b) => {
                let maxDateA = Math.max(...a.items.map(i => new Date(i.date)));
                let maxDateB = Math.max(...b.items.map(i => new Date(i.date)));
                return maxDateB - maxDateA;
            });
        }

        if (partyArray.length === 0) {
            container.innerHTML = `<p class="text-slate-400 text-center py-3">No matching party found.</p>`;
            return;
        }

        partyArray.forEach((partyData, pIdx) => {
            const partyDiv = document.createElement('div');
            partyDiv.className = "bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/60 rounded-xl overflow-hidden mb-2";

            let headerHtml = `
                <div class="flex justify-between items-center p-3 cursor-pointer select-none hover:bg-slate-100 dark:hover:bg-slate-800/80 transition" onclick="togglePartyLedgerItem('${pIdx}')">
                    <div class="flex items-center gap-2">
                        <i id="icon-party-item-${pIdx}" class="fa-solid fa-chevron-right text-[10px] text-slate-400 transition-transform"></i>
                        <div>
                            <h4 class="font-bold text-slate-900 dark:text-white text-xs"><i class="fa-solid fa-user text-emerald-400 mr-1.5"></i>${partyData.name}</h4>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400">${partyData.items.length} records</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-xs ${partyData.balance >= 0 ? 'text-emerald-500' : 'text-rose-500'}">Net: ${formatAmount(partyData.balance)}</span>
                    </div>
                </div>
            `;

            let detailsHtml = `<div id="ledger-party-item-${pIdx}" class="hidden border-t border-slate-200 dark:border-slate-700/60 bg-white dark:bg-slate-900/50 p-2 space-y-2">`;
            
            detailsHtml += `
                <div class="flex justify-end gap-2 mb-1">
                    <button onclick="event.stopPropagation(); generateAndSharePartyPDF('${partyData.name}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg text-[10px] font-semibold flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-file-pdf"></i> Generate & View PDF
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 dark:border-slate-700 text-[10px] text-slate-400">
                                <th class="py-1 px-2">Date</th>
                                <th class="py-1 px-2">Type</th>
                                <th class="py-1 px-2">NPR/INR</th>
                                <th class="py-1 px-2">Total</th>
                                <th class="py-1 px-2 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            partyData.items.sort((a, b) => new Date(b.date) - new Date(a.date));

            partyData.items.forEach(tx => {
                const displayNprInr = isPrivate ? 'NPR: •••• | INR: ••••' : `NPR: ${tx.npr} | INR: ${tx.inr}`;
                detailsHtml += `
                    <tr class="border-b border-slate-100 dark:border-slate-800 text-[11px]">
                        <td class="py-1.5 px-2 font-semibold text-slate-800 dark:text-slate-200">${tx.date}</td>
                        <td class="py-1.5 px-2">
                            <span class="px-1.5 py-0.5 rounded text-[9px] font-bold ${tx.type === 'Receivable' ? 'bg-emerald-500/10 text-emerald-500' : tx.type === 'Payable' ? 'bg-amber-500/10 text-amber-500' : 'bg-rose-500/10 text-rose-500'}">${tx.type}</span>
                        </td>
                        <td class="py-1.5 px-2 text-slate-500">${displayNprInr}</td>
                        <td class="py-1.5 px-2 font-bold text-emerald-500">${formatAmount(tx.total)}</td>
                        <td class="py-1.5 px-2 text-right space-x-2">
                            <button onclick="event.stopPropagation(); editTransaction(${tx.originalIndex})" class="text-blue-500 hover:text-blue-600"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="event.stopPropagation(); deleteTransaction(${tx.originalIndex})" class="text-rose-500 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            detailsHtml += `</tbody></table></div></div>`;
            partyDiv.innerHTML = headerHtml + detailsHtml;
            container.appendChild(partyDiv);
        });
    }

    function togglePartyLedgerItem(pIdx) {
        const ledger = document.getElementById(`ledger-party-item-${pIdx}`);
        const icon = document.getElementById(`icon-party-item-${pIdx}`);
        if(ledger && icon) {
            if(ledger.classList.contains('hidden')) {
                ledger.classList.remove('hidden');
                icon.classList.add('rotate-90');
            } else {
                ledger.classList.add('hidden');
                icon.classList.remove('rotate-90');
            }
        }
    }

    function generateAndSharePartyPDF(partyName) {
        let transactions = JSON.parse(localStorage.getItem('digital_notebook_transactions') || '[]');
        let partyItems = transactions.filter(t => (t.party || '').toLowerCase() === partyName.toLowerCase());
        
        if(partyItems.length === 0) {
            showToast('PDF बनाउन कुनै डाटा छैन!', 'error');
            return;
        }

        const profileName = localStorage.getItem('profile_name') || 'Digital NoteBook';
        const profileAddress = localStorage.getItem('profile_address') || '';
        const profileMobile = localStorage.getItem('profile_mobile') || '';
        const profileEmail = localStorage.getItem('profile_email') || '';
        const profileAvatar = localStorage.getItem('profile_avatar') || 'N1024.png';

        let previewContainer = document.getElementById('pdf-preview-container');
        
        let html = `
        <div id="pdf-printable-content" style="background-color: #ffffff; color: #333333; font-family: 'Poppins', sans-serif; width: 100%; max-width: 650px; padding: 25px; border-radius: 12px; box-sizing: border-box;">
            <table style="width: 100%; border-bottom: 2px solid #16a34a; padding-bottom: 15px; margin-bottom: 20px; border-collapse: collapse;">
                <tr>
                    <td style="vertical-align: middle; width: 20%; text-align: center;">
                        <div style="display: inline-block; text-align: center;">
                            <div style="width: 55px; height: 55px; border-radius: 50%; overflow: hidden; border: 2px solid #16a34a; margin: 0 auto 4px auto;">
                                <img src="${profileAvatar}" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                            <div style="font-size: 11px; font-weight: 700; color: #1f2937;">${profileName}</div>
                        </div>
                    </td>
                    <td style="vertical-align: middle; text-align: center; width: 55%; padding: 0 10px;">
                        <img src="bannerlogo.png" style="width: 100%; max-width: 100%; height: auto; object-fit: contain; display: inline-block;">
                    </td>
                    <td style="vertical-align: middle; text-align: left; font-size: 10px; color: #555; line-height: 1.4; width: 25%; padding-left: 10px;">
                        <div>📍 Address: ${profileAddress}</div>
                        <div>📞 Contact: ${profileMobile}</div>
                        <div>✉️ Email: ${profileEmail}</div>
                    </td>
                </tr>
            </table>

            <h2 style="text-align: center; color: #1f2937; margin-bottom: 5px; text-transform: uppercase; font-size: 15px; font-weight: 800; letter-spacing: 1px;">Party Ledger Report</h2>
            <div style="text-align: center; font-size: 13px; font-weight: 600; color: #16a34a; margin-bottom: 20px;">Party: ${partyName}</div>

            <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                <thead>
                    <tr style="background-color: #f3f4f6; color: #374151;">
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Date</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Type</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">NPR / INR</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Total (NPR)</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Note</th>
                    </tr>
                </thead>
                <tbody>`;

        let netBalance = 0;
        partyItems.sort((a, b) => new Date(b.date) - new Date(a.date));
        partyItems.forEach(item => {
            if(item.type === 'Receivable') {
                netBalance += item.total;
            } else {
                netBalance -= item.total;
            }

            const pdfNprInr = isPrivate ? 'NPR: •••• | INR: ••••' : `NPR: ${item.npr} | INR: ${item.inr}`;

            html += `
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 9px;">${item.date}</td>
                    <td style="padding: 9px; font-weight: bold; color: ${item.type === 'Receivable' ? '#16a34a' : '#e11d48'};">${item.type}</td>
                    <td style="padding: 9px;">${pdfNprInr}</td>
                    <td style="padding: 9px; font-weight: bold; color: #16a34a;">${formatAmount(item.total)}</td>
                    <td style="padding: 9px; color: #6b7280;">${item.note || '-'}</td>
                </tr>`;
        });

        html += `
                </tbody>
            </table>

            <div style="margin-top: 20px; text-align: right; font-size: 14px; font-weight: bold; color: ${netBalance >= 0 ? '#16a34a' : '#e11d48'}; border-top: 2px solid #16a34a; padding-top: 15px;">
                Net Balance: ${formatAmount(netBalance)}
            </div>
            
            <div style="text-align: center; font-size: 10px; color: #9ca3af; margin-top: 30px; border-top: 1px solid #e5e7eb; padding-top: 10px;">
                Generated by Digital NoteBook | ${new Date().toLocaleDateString('en-NP')}
            </div>
        </div>`;

        previewContainer.innerHTML = html;
        document.getElementById('pdf-modal').classList.remove('hidden');
    }

    function closePdfModal() {
        document.getElementById('pdf-modal').classList.add('hidden');
    }

    function printFromModal() {
        const element = document.getElementById('pdf-printable-content');
        let printWindow = window.open('', '_blank');
        printWindow.document.write('<html><head><title>Party Ledger Report</title></head><body>');
        printWindow.document.write(element.innerHTML);
        printWindow.document.write('</body></html>');
        printWindow.document.close();
        setTimeout(() => {
            printWindow.print();
        }, 500);
    }

    function editTransaction(idx) {
        let transactions = JSON.parse(localStorage.getItem('digital_notebook_transactions') || '[]');
        const tx = transactions[idx];
        if(!tx) return;

        document.getElementById('edit-txn-index').value = idx;
        document.getElementById('txn-date').value = tx.date;
        document.getElementById('txn-party').value = tx.party;
        document.getElementById('txn-type').value = tx.type;
        document.getElementById('txn-interest-rate').value = tx.rate;
        document.getElementById('txn-period').value = tx.period;
        document.getElementById('txn-amount-npr').value = tx.npr;
        document.getElementById('txn-amount-inr').value = tx.inr;
        document.getElementById('txn-note').value = tx.note;

        handleTypeChange();
        document.getElementById('txn-submit-btn').innerText = currentLang === 'NEP' ? 'अपडेट गर्नुहोस्' : 'Update Transaction';
        document.getElementById('txn-cancel-btn').classList.remove('hidden');

        const content = document.getElementById('content-section-transaction');
        if (content && content.classList.contains('hidden')) {
            toggleAccordion('section-transaction');
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteTransaction(idx) {
        if(confirm(currentLang === 'NEP' ? 'के तपाईं यो कारोबार हटाउन निश्चित हुनुहुन्छ?' : 'Are you sure you want to delete this transaction?')) {
            let transactions = JSON.parse(localStorage.getItem('digital_notebook_transactions') || '[]');
            transactions.splice(idx, 1);
            localStorage.setItem('digital_notebook_transactions', JSON.stringify(transactions));
            renderPartyAccounts();
            showToast('कारोबार रेकर्ड हटाइयो!', 'success');
        }
    }

    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile').value;
        const email = document.getElementById('input-email').value;

        if(name) localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);
        localStorage.setItem('profile_email', email);

        loadUserData();
        showToast(currentLang === 'NEP' ? 'विवरण सफलतापूर्वक सेभ भयो!' : 'Details saved successfully!', 'success');
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || '';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';
        const savedEmail = localStorage.getItem('profile_email') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address').value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;
        if(document.getElementById('input-email')) document.getElementById('input-email').value = savedEmail;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName;
    }

    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
                showToast(currentLang === 'NEP' ? 'प्रोफाइल फोटो अपडेट भयो!' : 'Profile photo updated!', 'success');
            };
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar') || 'N1024.png';
        ['sidebar-avatar-img', 'header-avatar-img'].forEach(id => {
            const img = document.getElementById(id);
            if(img) img.src = savedImage;
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        updatePrivacyUI();
        updateLanguageUI();
        updateThemeUI();
        updateDynamicHeader();
        loadUserData();
        loadAvatar();
        renderPartyAccounts();

        const dateInput = document.getElementById('txn-date');
        if(dateInput && !dateInput.value) {
            dateInput.valueAsDate = new Date();
        }
    });
</script>

<script>
    window.addEventListener('online', async () => {
        console.log('Internet connected! Syncing offline data to Firebase...');
        if (typeof window.handleCloudBackup === 'function') {
            await window.handleCloudBackup();
        }
    });
</script>
