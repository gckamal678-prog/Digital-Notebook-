<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - NotePad Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    [contenteditable=true]:empty:before {
        content: attr(placeholder);
        color: #94a3b8;
        pointer-events: none;
        display: block;
    }
    /* Custom Toast Notification */
    #toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .custom-toast {
        background: #0f172a;
        color: #f8fafc;
        border: 1px: solid #334155;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 11px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 8px;
        animation: fadeInOut 2.5s ease forwards;
    }
    @keyframes fadeInOut {
        0% { opacity: 0; transform: translateY(20px); }
        15% { opacity: 1; transform: translateY(0); }
        85% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
    }
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs flex flex-col h-screen overflow-hidden select-none">

<div id="toast-container"></div>

<div class="flex min-h-screen w-full">
    
    <!-- SIDEBAR SECTION -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
        
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-md">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                        Digital NoteBook
                    </h1>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">
                ✕
            </button>
        </div>

        <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
                <div class="relative cursor-pointer group" onclick="document.getElementById('avatar-upload-input').click()">
                    <div class="w-11 h-11 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="sidebar-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                    </div>
                </div>
                <input type="file" id="avatar-upload-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                <div>
                    <h3 id="sidebar-profile-name" class="text-white font-bold text-sm"></h3>
                    <p class="text-[10px] text-slate-400"><span class="lang-text" data-en="Click icon to set photo" data-np="फोटो राख्न क्लिक गर्नुहोस्">Click icon to set photo</span></p>
                </div>
            </div>

            <!-- SIDEBAR NAVIGATION -->
            <nav class="space-y-1 font-medium">
                <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>📊</span> <span class="lang-text" data-en="Overview" data-np="अवलोकन">Overview</span></a>
                <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-emerald-600 text-white shadow-md transition"><span>📝</span> <span class="lang-text" data-en="NotePad Studio" data-np="नोटप्याड स्टुडियो">NotePad Studio</span></a>
                <a href="#" onclick="openSecureVaultModal()" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-lock text-emerald-400"></i> <span class="lang-text" data-en="Secure Vault" data-np="गोप्य सुरक्षा (Vault)">Secure Vault</span></a>
            </nav>

            <div class="space-y-2.5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/60">
                <h3 class="text-[11px] font-bold text-white flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-address-card text-emerald-400"></i> <span class="lang-text" data-en="Personal Info" data-np="व्यक्तिगत विवरण">Personal Info</span>
                </h3>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Full Name" data-np="पूरा नाम">Full Name</span></label>
                    <input type="text" id="input-full-name" placeholder="Enter Full Name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Address" data-np="ठेगाना">Address</span></label>
                    <input type="text" id="input-address" placeholder="Enter Address" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Mobile Number" data-np="मोबाइल नम्बर">Mobile Number</span></label>
                    <input type="tel" id="input-mobile" placeholder="Enter Mobile Number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="saveProfileDetails()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-md">
                    <span class="lang-text" data-en="Save Info" data-np="सेभ गर्नुहोस्">Save Info</span>
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full h-screen overflow-hidden">
        
        <!-- HEADER SECTION (Navbar) -->
        <header class="sticky top-0 z-40 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-emerald-500/20 shadow-md">
            <div class="flex items-center space-x-2.5">
                <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none hover:text-emerald-400 transition">☰</button>
                <div class="flex items-center space-x-2 cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-7 h-7 rounded-lg bg-emerald-600 border border-emerald-500/50 flex items-center justify-center overflow-hidden shadow-sm">
                        <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <span class="text-xs md:text-sm font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                        Digital NoteBook
                    </span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="openSecureVaultModal()" class="px-2.5 py-1 rounded-md bg-emerald-600/20 border border-emerald-500/40 text-[10px] font-bold text-emerald-400 hover:bg-emerald-600/30 transition flex items-center gap-1"><i class="fa-solid fa-lock"></i> Vault</button>
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200 hover:bg-slate-700 transition">ENG</button>
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm hover:bg-slate-700 transition">🌛</button>
                <div class="relative cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="header-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="p-4 md:p-6 space-y-4 flex-1 w-full overflow-y-auto">
            <div class="flex justify-between items-center px-1 py-1 text-white">
                <div>
                    <p id="dynamic-date" class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-1"></p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
                <div class="relative flex-1 max-w-md">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="search-input" oninput="renderNotes()" placeholder="Search notes..." class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-xs outline-none">
                </div>
                <button onclick="openNoteModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-plus"></i> <span class="lang-text" data-en="New Note" data-np="नयाँ नोट">New Note</span>
                </button>
            </div>

            <!-- Notes Grid Container -->
            <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </main>
    </div>
</div>

<!-- Note Modal -->
<div id="note-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-2xl w-full max-w-lg space-y-4 border border-slate-200 dark:border-slate-800">
        <div class="flex justify-between items-center">
            <h3 id="modal-title" class="text-base font-bold text-slate-900 dark:text-slate-100">Create New Note</h3>
            <button onclick="closeNoteModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <input type="hidden" id="edit-note-id">
        <input type="text" id="note-title-input" placeholder="Note Title..." class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-sm font-bold outline-none">
        
        <div id="note-content-input" contenteditable="true" placeholder="Write your note here..." class="w-full h-40 border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-xs outline-none overflow-y-auto"></div>

        <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeNoteModal()" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-white px-4 py-2 rounded-xl text-xs font-medium">Cancel</button>
            <button onclick="saveNote()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-xs font-medium shadow-md">Save Note</button>
        </div>
    </div>
</div>

<!-- SECURE VAULT MODAL (PIN, Biometric, Real Camera Capture, Confirm Delete & Settings) -->
<div id="secure-vault-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 p-5 rounded-3xl shadow-2xl w-full max-w-md space-y-4 border border-slate-800 text-white">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h3 class="text-sm font-bold text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> Secure Vault</h3>
            <button onclick="closeSecureVaultModal()" class="text-slate-400 hover:text-white text-base"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- PIN LOCK SCREEN -->
        <div id="vault-lock-box" class="space-y-4 py-6 text-center">
            <p class="text-xs text-slate-300">Enter PIN (Default: 1234) or use Biometric:</p>
            <div class="flex justify-center">
                <input type="password" maxlength="4" id="vault-pin-input" class="w-36 bg-slate-800 border border-slate-700 rounded-xl text-center text-xl tracking-widest py-2 text-white focus:outline-none focus:border-emerald-500" placeholder="••••">
            </div>
            <div class="flex justify-center gap-2">
                <button onclick="unlockVaultPin()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition shadow-md">Unlock PIN</button>
                <button onclick="unlockBiometric()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 text-xs font-bold rounded-xl transition shadow-md flex items-center gap-1.5"><i class="fa-solid fa-fingerprint"></i> Fingerprint</button>
            </div>
        </div>

        <!-- VAULT MAIN CONTENT (Shown after PIN/Biometric unlock) -->
        <div id="vault-main-content" class="space-y-3 hidden">
            <div class="flex gap-1.5 border-b border-slate-800 pb-2">
                <button onclick="switchVaultTab('notes')" id="btn-vtab-notes" class="flex-1 py-1.5 bg-emerald-600 text-white text-[11px] rounded-lg font-bold transition">Secure Notes</button>
                <button onclick="switchVaultTab('docs')" id="btn-vtab-docs" class="flex-1 py-1.5 bg-slate-800 text-slate-300 text-[11px] rounded-lg font-medium transition">Document Vault</button>
                <button onclick="switchVaultTab('settings')" id="btn-vtab-settings" class="py-1.5 px-3 bg-slate-800 text-slate-300 text-[11px] rounded-lg font-medium transition"><i class="fa-solid fa-gear"></i></button>
            </div>

            <!-- Tab Body -->
            <div id="vault-body-content" class="space-y-3 max-h-72 overflow-y-auto pr-1">
                <!-- Dynamically loaded via JS -->
            </div>
        </div>
    </div>
</div>

<!-- REAL CAMERA CAPTURE MODAL -->
<div id="camera-modal" class="fixed inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center p-4 hidden">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3 text-white">
        <div class="flex justify-between items-center">
            <h4 class="text-xs font-bold text-emerald-400">Capture Document (Real Camera)</h4>
            <button onclick="closeCameraModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
        </div>
        <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
            <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="camera-canvas" class="hidden"></canvas>
        </div>
        <input type="text" id="captured-doc-title" placeholder="Document Name..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white text-xs outline-none">
        <div class="flex gap-2">
            <button onclick="capturePhoto()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition shadow-md">Capture</button>
            <button onclick="closeCameraModal()" class="py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl transition">Cancel</button>
        </div>
    </div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('digital_notebook_notes')) || [];
    let secureNotes = JSON.parse(localStorage.getItem('digital_notebook_secure_notes')) || [];
    let secureDocs = JSON.parse(localStorage.getItem('digital_notebook_secure_docs')) || [];
    let currentLang = localStorage.getItem('lang') || 'EN';
    let mediaStream = null;
    let capturedImageData = null;

    function showToast(message) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        updateDynamicHeader();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeUI();
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const timeString = now.toLocaleTimeString('en-US', timeOptions);

        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = `${dateString} | ${timeString}`;
    }

    setInterval(updateDynamicHeader, 1000);

    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile').value;

        if(name) localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);

        loadUserData();
        showToast(currentLang === 'NEP' ? 'विवरण सेभ भयो!' : 'Details saved successfully!');
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || '';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address').value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName;
    }

    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
            };
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar') || 'N1024.png';
        ['sidebar-avatar-img', 'header-avatar-img'].forEach(id => {
            const img = document.getElementById(id);
            if(img) img.src = savedImage;
        });
    }

    // Secure Vault Logic
    function openSecureVaultModal() {
        document.getElementById('secure-vault-modal').classList.remove('hidden');
        document.getElementById('vault-lock-box').classList.remove('hidden');
        document.getElementById('vault-main-content').classList.add('hidden');
        document.getElementById('vault-pin-input').value = '';
    }

    function closeSecureVaultModal() {
        document.getElementById('secure-vault-modal').classList.add('hidden');
    }

    function unlockVaultPin() {
        const pin = document.getElementById('vault-pin-input').value;
        const correctPin = localStorage.getItem('vault_pin') || '1234';
        if(pin === correctPin) {
            document.getElementById('vault-lock-box').classList.add('hidden');
            document.getElementById('vault-main-content').classList.remove('hidden');
            switchVaultTab('notes');
        } else {
            showToast('Invalid PIN! Try again.');
        }
    }

    async function unlockBiometric() {
        if (!window.PublicKeyCredential) {
            showToast('Biometric authentication not supported.');
            return;
        }
        try {
            const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
            if (available) {
                document.getElementById('vault-lock-box').classList.add('hidden');
                document.getElementById('vault-main-content').classList.remove('hidden');
                switchVaultTab('notes');
                showToast('Biometric unlocked successfully.');
            } else {
                showToast('No biometric authenticator found.');
            }
        } catch (err) {
            showToast('Biometric authentication failed.');
        }
    }

    function switchVaultTab(tab) {
        const notesBtn = document.getElementById('btn-vtab-notes');
        const docsBtn = document.getElementById('btn-vtab-docs');
        const settingsBtn = document.getElementById('btn-vtab-settings');
        const body = document.getElementById('vault-body-content');

        notesBtn.className = "flex-1 py-1.5 bg-slate-800 text-slate-300 text-[11px] rounded-lg font-medium transition";
        docsBtn.className = "flex-1 py-1.5 bg-slate-800 text-slate-300 text-[11px] rounded-lg font-medium transition";
        settingsBtn.className = "py-1.5 px-3 bg-slate-800 text-slate-300 text-[11px] rounded-lg font-medium transition";

        if(tab === 'notes') {
            notesBtn.className = "flex-1 py-1.5 bg-emerald-600 text-white text-[11px] rounded-lg font-bold transition";
            body.innerHTML = `
                <div class="space-y-2 bg-slate-800/40 p-3 rounded-xl border border-slate-700">
                    <input type="text" id="secure-note-title" placeholder="Note Title..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white text-xs outline-none">
                    <textarea id="secure-note-desc" placeholder="Write your secure note..." class="w-full h-20 bg-slate-800 border border-slate-700 rounded-lg p-2 text-white text-xs outline-none"></textarea>
                    <button onclick="saveSecureNote()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs transition">Save Secure Note</button>
                </div>
                <div class="space-y-2 mt-3" id="secure-notes-list">
                    ${secureNotes.map(n => `
                        <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex justify-between items-start">
                            <div>
                                <h5 class="font-bold text-emerald-400 text-xs">${n.title}</h5>
                                <p class="text-slate-300 text-[11px] mt-0.5">${n.content}</p>
                            </div>
                            <button onclick="confirmDeleteSecureNote(${n.id})" class="text-rose-400 hover:text-rose-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `).join('')}
                </div>
            `;
        } else if(tab === 'docs') {
            docsBtn.className = "flex-1 py-1.5 bg-emerald-600 text-white text-[11px] rounded-lg font-bold transition";
            body.innerHTML = `
                <div class="space-y-2 bg-slate-800/40 p-3 rounded-xl border border-slate-700">
                    <button onclick="openCameraModal()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs transition flex items-center justify-center gap-2"><i class="fa-solid fa-camera"></i> Capture Document via Camera</button>
                </div>
                <div class="space-y-2 mt-3 grid grid-cols-2 gap-2" id="secure-docs-list">
                    ${secureDocs.map(d => `
                        <div class="bg-slate-800 p-2 rounded-xl border border-slate-700 flex flex-col justify-between space-y-2">
                            <div>
                                <img src="${d.image}" alt="Doc" class="w-full h-24 object-cover rounded-lg border border-slate-700 mb-1">
                                <h5 class="font-bold text-xs truncate text-white">${d.title}</h5>
                            </div>
                            <button onclick="confirmDeleteSecureDoc(${d.id})" class="w-full py-1 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white rounded text-[10px] font-bold transition">Delete</button>
                        </div>
                    `).join('')}
                </div>
            `;
        } else if(tab === 'settings') {
            settingsBtn.className = "py-1.5 px-3 bg-emerald-600 text-white text-[11px] rounded-lg font-bold transition";
            body.innerHTML = `
                <div class="space-y-3 bg-slate-800/40 p-3 rounded-xl border border-slate-700">
                    <h5 class="font-bold text-emerald-400 text-xs"><i class="fa-solid fa-key"></i> Change PIN</h5>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Old PIN</label>
                        <input type="password" maxlength="4" id="old-pin" placeholder="••••" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">New 4-Digit PIN</label>
                        <input type="password" maxlength="4" id="new-pin" placeholder="••••" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white text-xs outline-none">
                    </div>
                    <button onclick="changeVaultPin()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs transition shadow-md">Update PIN</button>
                </div>
            `;
        }
    }

    // Real Camera Handlers
    async function openCameraModal() {
        document.getElementById('camera-modal').classList.remove('hidden');
        document.getElementById('captured-doc-title').value = '';
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            document.getElementById('camera-stream').srcObject = mediaStream;
        } catch (err) {
            showToast('Camera access denied or unavailable.');
            closeCameraModal();
        }
    }

    function closeCameraModal() {
        if(mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        document.getElementById('camera-modal').classList.add('hidden');
    }

    function capturePhoto() {
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('camera-canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        capturedImageData = canvas.toDataURL('image/png');

        const title = document.getElementById('captured-doc-title').value.trim();
        secureDocs.unshift({id: Date.now(), title: title || 'Document', image: capturedImageData});
        localStorage.setItem('digital_notebook_secure_docs', JSON.stringify(secureDocs));
        closeCameraModal();
        switchVaultTab('docs');
        showToast('Document saved successfully.');
    }

    function changeVaultPin() {
        const oldPin = document.getElementById('old-pin').value;
        const newPin = document.getElementById('new-pin').value;
        const currentSavedPin = localStorage.getItem('vault_pin') || '1234';

        if(oldPin !== currentSavedPin) {
            showToast('Incorrect old PIN!');
            return;
        }
        if(newPin.length !== 4) {
            showToast('New PIN must be exactly 4 digits!');
            return;
        }

        localStorage.setItem('vault_pin', newPin);
        showToast('PIN changed successfully.');
        switchVaultTab('notes');
    }

    function saveSecureNote() {
        const title = document.getElementById('secure-note-title').value.trim();
        const content = document.getElementById('secure-note-desc').value.trim();
        if(!title && !content) return;

        secureNotes.unshift({id: Date.now(), title: title || 'Untitled', content});
        localStorage.setItem('digital_notebook_secure_notes', JSON.stringify(secureNotes));
        switchVaultTab('notes');
        showToast('Secure note saved.');
    }

    function confirmDeleteSecureNote(id) {
        if(confirm('Are you sure you want to delete this secure note?')) {
            secureNotes = secureNotes.filter(n => n.id !== id);
            localStorage.setItem('digital_notebook_secure_notes', JSON.stringify(secureNotes));
            switchVaultTab('notes');
            showToast('Secure note deleted.');
        }
    }

    function confirmDeleteSecureDoc(id) {
        if(confirm('Are you sure you want to delete this document?')) {
            secureDocs = secureDocs.filter(d => d.id !== id);
            localStorage.setItem('digital_notebook_secure_docs', JSON.stringify(secureDocs));
            switchVaultTab('docs');
            showToast('Document deleted.');
        }
    }

    function openNoteModal(id = null) {
        document.getElementById('note-modal').classList.remove('hidden');
        if(id) {
            const note = notes.find(n => n.id === id);
            if(note) {
                document.getElementById('edit-note-id').value = note.id;
                document.getElementById('note-title-input').value = note.title;
                document.getElementById('note-content-input').innerHTML = note.content;
            }
        } else {
            document.getElementById('edit-note-id').value = '';
            document.getElementById('note-title-input').value = '';
            document.getElementById('note-content-input').innerHTML = '';
        }
    }

    function closeNoteModal() {
        document.getElementById('note-modal').classList.add('hidden');
    }

    function saveNote() {
        const id = document.getElementById('edit-note-id').value;
        const title = document.getElementById('note-title-input').value.trim();
        const content = document.getElementById('note-content-input').innerHTML.trim();

        if(!title && !content) return;

        if(id) {
            notes = notes.map(n => n.id == id ? {...n, title, content} : n);
        } else {
            notes.unshift({id: Date.now(), title: title || 'Untitled', content, date: new Date().toLocaleDateString()});
        }

        localStorage.setItem('digital_notebook_notes', JSON.stringify(notes));
        closeNoteModal();
        renderNotes();
        showToast('Note saved.');
    }

    function deleteNote(id) {
        if(confirm('Delete this note?')) {
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('digital_notebook_notes', JSON.stringify(notes));
            renderNotes();
            showToast('Note deleted.');
        }
    }

    function renderNotes() {
        const grid = document.getElementById('notes-grid');
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = notes.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));

        if(filtered.length === 0) {
            grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">No notes found.</div>`;
            return;
        }

        grid.innerHTML = filtered.map(n => `
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-3">
                <div>
                    <h4 class="font-bold text-slate-900 dark:text-white text-sm mb-1">${n.title}</h4>
                    <div class="text-slate-600 dark:text-slate-300 text-xs line-clamp-3">${n.content}</div>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-400">
                    <span>${n.date}</span>
                    <div class="flex gap-2">
                        <button onclick="openNoteModal(${n.id})" class="text-emerald-500 hover:text-emerald-600"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteNote(${n.id})" class="text-rose-500 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateThemeUI();
        updateDynamicHeader();
        loadUserData();
        loadAvatar();
        renderNotes();
    });
</script>
</body>
</html>
