(()=>{'use strict';const cfg={apiKey:'AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c',authDomain:'digital-a2552.firebaseapp.com',databaseURL:'https://digital-a2552-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'digital-a2552',storageBucket:'digital-a2552.firebasestorage.app',messagingSenderId:'218135618179',appId:'1:218135618179:web:821b76920d3e5669ac31b6'};const $=id=>document.getElementById(id),DAY=86400000,TTL=30*DAY;let db,user,notes={},trash={},sn={},docs={},settings={},unlocked=false,tab='notes';const msg=(s,bad=false)=>{let t=$('toast');t.textContent=s;t.style.background=bad?'#b91c1c':'#047857';t.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>t.style.display='none',3000)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>db.ref().push().key,p=p=>`users/${user.uid}/${p}`,norm=v=>v&&typeof v==='object'?Object.entries(v).reduce((o,[k,x])=>{if(x&&typeof x==='object')o[x.id||k]={...x,id:String(x.id||k)};return o},{}):{};function confirmBox(s){return new Promise(resolve=>{let w=document.createElement('div');w.className='fixed inset-0 z-[90] bg-black/70 flex items-center justify-center p-4';w.innerHTML=`<div class="max-w-sm w-full rounded-2xl bg-white dark:bg-slate-900 p-5 space-y-4"><p>${esc(s)}</p><div class="flex gap-2"><button data-no class="bg-slate-600 text-white p-3 rounded-xl flex-1">रद्द</button><button data-yes class="bg-rose-600 text-white p-3 rounded-xl flex-1">ठीक छ</button></div></div>`;document.body.append(w);w.querySelector('[data-no]').onclick=()=>{w.remove();resolve(false)};w.querySelector('[data-yes]').onclick=()=>{w.remove();resolve(true)}})}function modal(on){$('modal').classList.toggle('hidden',!on);$('modal').classList.toggle('flex',on)}function editor(n){$('nid').value=n?.id||'';$('title').value=n?.title||'';$('content').value=n?.content||'';$('mtitle').textContent=n?'नोट सम्पादन':'नयाँ नोट';modal(true)}function renderNotes(){let q=$('search').value.toLowerCase(),root=$('notes');root.replaceChildren();let a=Object.values(notes).filter(n=>(n.title||'').toLowerCase().includes(q)||(n.content||'').toLowerCase().includes(q)).sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));if(!a.length){root.innerHTML='<p class="text-slate-400 py-8 text-center col-span-full">कुनै नोट भेटिएन।</p>';return}a.forEach(n=>{let e=document.createElement('article');e.className='rounded-2xl border border-slate-700 bg-white dark:bg-slate-900 p-4 space-y-3';e.innerHTML=`<h3 class="font-bold text-base break-words">${esc(n.title||'शीर्षक छैन')}</h3><p class="whitespace-pre-wrap break-words text-slate-600 dark:text-slate-300">${esc(n.content||'')}</p><p class="text-xs text-slate-400">${esc(n.updatedAt?new Date(n.updatedAt).toLocaleString():'')}</p><div class="flex gap-2"><button data-edit="${esc(n.id)}" class="bg-blue-600 text-white p-2 rounded-lg flex-1">सम्पादन</button><button data-del="${esc(n.id)}" class="bg-rose-600 text-white p-2 rounded-lg flex-1">Trash</button></div>`;root.append(e)})}function renderTrash(){let root=$('trash');root.replaceChildren();let a=Object.values(trash).filter(n=>n&&n.deletedAt&&Date.now()-n.deletedAt<TTL);if(!a.length){root.innerHTML='<p class="text-slate-400">Trash खाली छ।</p>';return}a.forEach(n=>{let e=document.createElement('div');e.className='p-3 rounded-xl bg-slate-100 dark:bg-slate-800 flex gap-2 items-center';e.innerHTML=`<div class="flex-1"><b>${esc(n.title||'नोट')}</b><p class="text-xs text-slate-400">मेटाइएको: ${esc(new Date(n.deletedAt).toLocaleDateString())}</p></div><button data-restore="${esc(n.id)}" class="bg-emerald-700 text-white px-3 py-2 rounded-lg">Restore</button>`;root.append(e)})}async function saveNote(){let title=$('title').value.trim(),content=$('content').value.trim(),oldId=$('nid').value;if(!title&&!content)return msg('शीर्षक वा नोट लेख्नुहोस्।',true);let key=oldId||id(),old=notes[key]||{};try{await db.ref(p('notes/'+key)).transaction(cur=>({...old,...cur,id:key,title:title||'शीर्षक छैन',content,createdAt:old.createdAt||Date.now(),updatedAt:Date.now()}));modal(false);msg('नोट Cloud मा सेभ भयो।')}catch(e){console.error(e);msg('सेभ भएन। Firebase Rules/इन्टरनेट जाँच गर्नुहोस्।',true)}}async function deleteNote(key){let n=notes[key];if(!n||!await confirmBox('यो नोट Trash मा पठाउने?'))return;try{let patch={};patch[p('trash/notes/'+key)]={...n,id:key,category:'notes',originalPath:`users/${user.uid}/notes/${key}`,deletedAt:Date.now(),expiresAt:Date.now()+TTL};patch[p('notes/'+key)]=null;await db.ref().update(patch);msg('नोट Trash मा सारियो।')}catch(e){msg('Trash मा सार्न सकिएन।',true)}}async function restore(key){let n=trash[key];if(!n||Date.now()-Number(n.deletedAt||0)>TTL)return msg('३० दिनको Restore अवधि सकियो।',true);try{let item={...n,id:n.id||key,restoredAt:Date.now()};delete item.deletedAt;delete item.expiresAt;delete item.originalPath;delete item.category;let patch={};patch[p('notes/'+item.id)]=item;patch[p('trash/notes/'+key)]=null;await db.ref().update(patch);msg('नोट पुनःस्थापना भयो।')}catch(e){msg('Restore गर्न सकिएन।',true)}}function renderVault(){let root=$('vaultList');root.replaceChildren();let a=Object.values(tab==='notes'?sn:docs);if(!a.length){root.innerHTML='<p class="text-slate-400 text-xs">रेकर्ड छैन।</p>';return}a.forEach(x=>{let e=document.createElement('div');e.className='rounded-xl border border-slate-700 p-3 flex gap-3';e.innerHTML=tab==='notes'?`<div class="flex-1 min-w-0"><b>${esc(x.title)}</b><p class="whitespace-pre-wrap break-words mt-1">${esc(x.content)}</p></div><button data-sdel="${esc(x.id)}" class="bg-rose-700 text-white px-3 rounded-lg">मेटाउने</button>`:`<div class="flex-1 min-w-0"><b>${esc(x.title)}</b><p class="text-xs text-slate-400">${esc(x.mime||'File')} · ${Math.ceil((x.size||0)/1024)} KB</p>${x.mime?.startsWith('image/')?`<img alt="" src="${x.data}" class="max-h-40 mt-2 rounded-lg">`:''}${x.mime==='application/pdf'?`<a class="text-emerald-400 underline" href="${x.data}" target="_blank" rel="noopener">PDF खोल्नुहोस्</a>`:''}</div><button data-ddel="${esc(x.id)}" class="bg-rose-700 text-white px-3 rounded-lg">मेटाउने</button>`;root.append(e)})}async function pinHash(pin){const bytes=new TextEncoder().encode(pin);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}async function unlock(){let pin=$('pin').value;if(!/^\d{4}$/.test(pin))return msg('४ अङ्कको PIN राख्नुहोस्।',true);if(!settings.pinHash)return msg('पहिले PIN सेट गर्नुहोस्।',true);if(await pinHash(pin)!==String(settings.pinHash))return msg('PIN मिलेन।',true);unlocked=true;$('lock').classList.add('hidden');$('vaultBody').classList.remove('hidden');renderVault();msg('Vault खुल्यो।')}async function setPin(){let pin=$('pin').value;if(!/^\d{4}$/.test(pin))return msg('PIN ठ्याक्कै ४ अङ्कको हुनुपर्छ।',true);try{await db.ref(p('vault_settings')).update({pinHash:await pinHash(pin),updatedAt:Date.now()});msg('PIN को hash Cloud मा सेभ भयो। अब Unlock गर्नुहोस्।')}catch(e){msg('PIN सेभ भएन।',true)}}async function saveSecure(){if(!unlocked)return;let title=$('stitle').value.trim(),content=$('scontent').value.trim();if(!title&&!content)return msg('गोप्य नोट लेख्नुहोस्।',true);let key=id();try{await db.ref(p('secure_notes/'+key)).set({id:key,title:title||'शीर्षक छैन',content,createdAt:Date.now()});$('stitle').value='';$('scontent').value='';msg('गोप्य नोट सेभ भयो।')}catch(e){msg('सेभ भएन।',true)}}async function saveDoc(){if(!unlocked)return;let f=$('file').files[0];if(!f)return msg('कागजात छान्नुहोस्।',true);if(f.size>1024*1024)return msg('फाइल 1 MB भन्दा सानो हुनुपर्छ।',true);let r=new FileReader();r.onload=async()=>{let key=id();try{await db.ref(p('secure_docs/'+key)).set({id:key,title:$('dtitle').value.trim()||f.name,mime:f.type||'application/octet-stream',size:f.size,data:r.result,createdAt:Date.now()});$('dtitle').value='';$('file').value='';msg('कागजात सेभ भयो।')}catch(e){msg('कागजात सेभ भएन।',true)}};r.readAsDataURL(f)}async function delVault(c,key){if(!await confirmBox('यो Vault रेकर्ड मेटाउने?'))return;try{await db.ref(p(c+'/'+key)).remove();msg('रेकर्ड मेटाइयो।')}catch(e){msg('मेटाउन सकिएन।',true)}}function listen(c,fn){db.ref(p(c)).on('value',s=>fn(s.val()),e=>{console.error(e);$('sync').textContent='Sync त्रुटि';msg('Cloud डाटा पढ्न सकिएन।',true)})}function migrate(){[['digital_notebook_notes','notes'],['digital_notebook_secure_notes','secure_notes'],['digital_notebook_secure_docs','secure_docs']].forEach(([k,c])=>{let mark='dn_migrated_'+k+'_'+user.uid;if(localStorage.getItem(mark))return;let a=[];try{a=JSON.parse(localStorage.getItem(k)||'[]')}catch{}if(!Array.isArray(a)||!a.length){localStorage.setItem(mark,'1');return}db.ref(p(c)).once('value').then(s=>{if(s.exists())return;let updates={};a.forEach(x=>{if(x&&typeof x==='object'){let key=id();updates[p(c+'/'+key)]={...x,id:key,createdAt:x.createdAt||Date.now()}}});if(Object.keys(updates).length)return db.ref().update(updates)}).then(()=>localStorage.setItem(mark,'1')).catch(console.warn)})}
$('new').onclick=()=>editor();$('close').onclick=$('cancel').onclick=()=>modal(false);$('save').onclick=saveNote;$('search').oninput=renderNotes;$('notes').onclick=e=>{let a=e.target.closest('[data-edit]'),b=e.target.closest('[data-del]');if(a)editor(notes[a.dataset.edit]);if(b)deleteNote(b.dataset.del)};$('trash').onclick=e=>{let b=e.target.closest('[data-restore]');if(b)restore(b.dataset.restore)};$('vaultToggle').onclick=()=>{$('vault').classList.toggle('hidden');if($('vault').classList.contains('hidden')){unlocked=false;$('lock').classList.remove('hidden');$('vaultBody').classList.add('hidden')}};$('unlock').onclick=unlock;$('setPin').onclick=setPin;$('saveS').onclick=saveSecure;$('saveD').onclick=saveDoc;$('tabN').onclick=()=>{tab='notes';$('noteEditor').classList.remove('hidden');$('docEditor').classList.add('hidden');renderVault()};$('tabD').onclick=()=>{tab='docs';$('noteEditor').classList.add('hidden');$('docEditor').classList.remove('hidden');renderVault()};$('vaultList').onclick=e=>{let a=e.target.closest('[data-sdel]'),b=e.target.closest('[data-ddel]');if(a)delVault('secure_notes',a.dataset.sdel);if(b)delVault('secure_docs',b.dataset.ddel)};
