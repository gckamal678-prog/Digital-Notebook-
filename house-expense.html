<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>घर खर्च | Digital Notebook</title>

<!-- FontAwesome & Chart.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#0b1220;
  --card:#151f30;
  --input:#0e1726;
  --border:#29374c;
  --text:#e5edf8;
  --muted:#98a8bd;
  --green:#16a34a;
  --red:#f87171;
  --blue:#0369a1;
}
*{box-sizing:border-box}
body{
  margin:0;padding:14px;font-family:Arial,sans-serif;
  background:var(--bg);color:var(--text)
}
.container{max-width:700px;margin:auto}

/* Header style with target icon & slogan */
.header{
  background:linear-gradient(135deg,#14532d,#166534);
  padding:18px 20px;border-radius:16px;margin-bottom:15px;
  display:flex;justify-content:space-between;align-items:center;
}
.header-left h2{margin:0 0 4px; font-size: 20px;}
.header-left p{margin:0;color:#dcfce7; font-size: 13px;}
.header-right {cursor:pointer; background: rgba(255,255,255,0.15); padding: 10px 12px; border-radius: 12px; text-align: center;}
.header-right i {font-size: 22px; color: #facc15;}

.card{
  background:var(--card);border:1px solid var(--border);
  padding:16px;border-radius:14px;margin-bottom:15px;
  box-shadow:0 5px 20px #0002
}
h3{margin:0 0 12px; font-size: 16px;}
label{display:block;font-size:14px;font-weight:bold;margin:12px 0 6px}
input,select,textarea,button{
  width:100%;padding:12px;border-radius:9px;font-size:15px
}
input,select,textarea{
  border:1px solid var(--border);background:var(--input);
  color:var(--text);min-width:0
}
input:focus,select:focus,textarea:focus{
  outline:2px solid #22c55e88;border-color:#22c55e
}
button{
  border:0;background:var(--green);color:white;
  font-weight:bold;cursor:pointer;margin-top:12px
}
button:disabled{opacity:.5;cursor:not-allowed}

.summary{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;margin-bottom:15px
}
.summary .card{margin:0}
.amount{
  font-size:19px;font-weight:bold;margin-top:6px;
  overflow-wrap:anywhere
}
.green{color:#4ade80}
.red{color:var(--red)}
.muted{color:var(--muted)}

.form-actions{display:flex;gap:10px;margin-top:12px}
.form-actions button{margin-top:0}
#cancel-btn{background:#475569}
#exportBtn{background:var(--blue)}
#pdfBtn{background:#16a34a}

.expense{
  border:1px solid var(--border);padding:13px;
  border-radius:10px;margin-top:10px;background:#101a2a
}
.expense-top{
  display:flex;justify-content:space-between;
  gap:10px;align-items:flex-start
}
.expense-name{font-weight:bold;overflow-wrap:anywhere}
.expense-meta{
  color:var(--muted);font-size:13px;margin-top:5px;
  overflow-wrap:anywhere;white-space:pre-wrap
}
.actions{display:flex;gap:5px;flex-shrink:0}
.small-btn{width:40px;margin:0;padding:9px 5px}
.edit-btn{background:#2563eb}
.delete-btn{background:#dc2626}
.empty{
  text-align:center;color:var(--muted);
  padding:18px 0;line-height:1.6
}

/* Progress Bar Style */
.progress-container {
  width: 100%; background-color: var(--input);
  border-radius: 8px; height: 12px; overflow: hidden; margin-top: 8px;
  border: 1px solid var(--border);
}
.progress-bar {
  height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s;
}

/* Modal Style */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
  display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 15px;
}
.modal-content {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; max-width: 650px; width: 100%; max-height: 90vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-body { overflow-y: auto; padding: 15px; flex: 1; background: #fff; color: #333; }
.modal-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

.filter-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.filter-grid .full{grid-column:1/-1}

@media(max-width:380px){
  body{padding:9px}
  .summary{grid-template-columns:1fr}
  .card{padding:13px}
  .header{padding:16px}
  .filter-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<!-- Header Section -->
<header class="header">
  <div class="header-left">
    <h2>🏠 घर खर्च व्यवस्थापन</h2>
    <p>✨ थोरै बचाऔं, भविष्य सजाऔं</p>
  </div>
  <div class="header-right" onclick="scrollToBudget()">
    <i class="fa-solid fa-bullseye"></i>
    <div style="font-size:10px; margin-top:2px; color:#dcfce7;">टार्गेट</div>
  </div>
</header>

<!-- Summary Section -->
<section class="summary">
  <div class="card">
    <div class="muted" style="font-size:13px;">छानिएको अवधिको खर्च</div>
    <div class="amount red" id="periodTotal">रु. ०</div>
  </div>
  <div class="card">
    <div class="muted" style="font-size:13px;">कुल जम्मा खर्च</div>
    <div class="amount green" id="allTotal">रु. ०</div>
  </div>
</section>

<!-- बजेट सीमा तथा अलर्ट सेक्सन -->
<section class="card" id="budgetCard">
  <h3>🎯 महिनाको बजेट सीमा</h3>
  <div style="display:flex; gap:10px; align-items:center;">
    <input type="number" id="monthlyBudgetInput" placeholder="महिनाको बजेट तोक्नुहोस् (रु.)">
    <button type="button" id="setBudgetBtn" style="width: auto; margin-top:0;">सेभ</button>
  </div>
  
  <div id="budgetStatusArea" style="margin-top:12px;">
    <div style="display:flex; justify-content:space-between; font-size:13px;">
      <span id="budgetText">बजेट तोकिएको छैन</span>
      <span id="budgetPercentText">0%</span>
    </div>
    <div class="progress-container">
      <div id="budgetProgressBar" class="progress-bar"></div>
    </div>
  </div>
</section>

<!-- खर्चको ग्राफ (Chart.js) -->
<section class="card">
  <h3>📊 शीर्षक अनुसार खर्च विवरण</h3>
  <div style="max-height: 240px; display:flex; justify-content:center; align-items:center;">
    <canvas id="expenseChart"></canvas>
  </div>
</section>

<!-- नयाँ खर्च थप्ने फारम -->
<section class="card">
  <h3 id="form-heading">➕ नयाँ खर्च लेख्नुहोस्</h3>

  <form id="expenseForm">
    <input type="hidden" id="edit-id">

    <label for="title">सामान वा खर्चको नाम</label>
    <input id="title" maxlength="200" placeholder="जस्तै: चामल, दूध, तरकारी" required>

    <label for="amount">रकम (रु.)</label>
    <input id="amount" type="number" min="0.01" step="0.01" placeholder="250" required>

    <label for="category">खर्चको प्रकार</label>
    <select id="category">
      <option value="किराना पसल">किराना पसल</option>
      <option value="तरकारी">तरकारी</option>
      <option value="बिल तथा रिचार्ज">बिल तथा रिचार्ज (बिजुली, पानी, नेट, फोन)</option>
      <option value="यातायात">यातायात</option>
      <option value="स्वास्थ्य">स्वास्थ्य</option>
      <option value="शिक्षा">शिक्षा</option>
      <option value="कृषि">कृषि</option>
      <option value="अन्य">अन्य</option>
    </select>

    <label for="paymentMethod">भुक्तानीको माध्यम</label>
    <select id="paymentMethod">
      <option value="नगद (Cash)">नगद (Cash)</option>
      <option value="अनलाइन (QR / Fonepay)">अनलाइन (QR / Fonepay)</option>
      <option value="बैंक ट्रान्सफर">बैंक ट्रान्सफर</option>
      <option value="उधारो">उधारो</option>
    </select>

    <label for="date">मिति</label>
    <input id="date" type="date" required>

    <label for="note">कैफियत (ऐच्छिक)</label>
    <textarea id="note" rows="2" maxlength="2000" placeholder="थप जानकारी..."></textarea>

    <div class="form-actions">
      <button type="button" id="cancel-btn" hidden>रद्द गर्नुहोस्</button>
      <button type="submit" id="saveBtn">💾 खर्च सेभ गर्नुहोस्</button>
    </div>
  </form>
</section>

<!-- खर्चको विवरण तथा लिस्ट सेक्सन -->
<section class="card">
  <h3>📋 खर्चको विवरण</h3>

  <label for="search">खर्च खोज्नुहोस्</label>
  <input id="search" type="search" placeholder="नाम, प्रकार वा कैफियत">

  <div class="filter-grid" style="margin-top:10px;">
    <div class="full">
      <select id="filterType" aria-label="मिति फिल्टर">
        <option value="month">महिना अनुसार (स्वतः)</option>
        <option value="day">दिन अनुसार</option>
        <option value="year">वर्ष अनुसार</option>
      </select>
    </div>

    <div id="dayBox" class="full" hidden>
      <label for="dayFilter">दिन छान्नुहोस्</label>
      <input id="dayFilter" type="date">
    </div>

    <div id="monthBox" class="full">
      <label for="monthFilter">महिना छान्नुहोस्</label>
      <input id="monthFilter" type="month">
    </div>

    <div id="yearBox" class="full" hidden>
      <label for="yearFilter">वर्ष छान्नुहोस्</label>
      <select id="yearFilter"><option value="">वर्ष छान्नुहोस्</option></select>
    </div>
  </div>

  <div id="filterSummary" class="section-caption" style="margin-top:10px; font-size:13px; color:var(--muted);"></div>
  
  <div id="expenseList"><div class="empty">डाटा लोड हुँदैछ...</div></div>
  <div id="seeMoreContainer" style="text-align:center; margin-top:12px;" hidden>
    <button type="button" id="seeMoreBtn" style="background:#334155; width:auto; padding:8px 20px; font-size:13px;">See More...</button>
  </div>

  <div style="display:flex; gap:10px; margin-top:16px;">
    <button id="pdfBtn" type="button"><i class="fa-solid fa-file-pdf"></i> PDF रिपोर्ट</button>
    <button id="exportBtn" type="button"><i class="fa-solid fa-download"></i> JSON डाउनलोड</button>
  </div>
</section>

</div>

<!-- PDF PREVIEW MODAL -->
<div id="pdfModal" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <div style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">📄 घर खर्च रिपोर्ट (PDF Preview)</h3>
      <button onclick="closePdfModal()" style="width:auto; margin:0; padding:5px 10px; background:#475569;">✕</button>
    </div>
    <div class="modal-body" id="pdfPreviewContainer"></div>
    <div class="modal-footer">
      <button onclick="printPdfReport()" style="width:auto; margin:0; background:#16a34a;"><i class="fa-solid fa-print"></i> Print / Download PDF</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
  authDomain: "digital-a2552.firebaseapp.com",
  projectId: "digital-a2552",
  databaseURL: "https://digital-a2552-default-rtdb.asia-southeast1.firebasedatabase.app",
  storageBucket: "digital-a2552.firebasestorage.app",
  messagingSenderId: "218135618179",
  appId: "1:218135618179:web:821b76920d3e5669ac31b6"
};

const $ = id => document.getElementById(id);
const LOCAL_KEY = "local_house_expenses_v2";
const BUDGET_KEY = "local_house_budget_val";

let db, auth, currentUser = null;
let expenses = [];
let chartInstance = null;
let showAllRecords = false; // See more को लागि कन्ट्रोलर

// श्रेणी अनुसार तोकिएका रङहरू
const CATEGORY_COLORS = {
  "तरकारी": "#22c55e",          // हरियो
  "किराना पसल": "#f97316",    // सुन्तला
  "बिल तथा रिचार्ज": "#06b6d4", // नीलो
  "यातायात": "#eab308",         // पहेँलो
  "स्वास्थ्य": "#ec4899",        // गुलाबी
  "शिक्षा": "#a855f7",          // बैजनी
  "कृषि": "#84cc16",            // लाइम हरियो
  "अन्य": "#64748b"             // स्लेट
};

function scrollToBudget() {
  $("budgetCard").scrollIntoView({ behavior: 'smooth' });
}

function localDate() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function currentMonthStr() {
  return localDate().slice(0, 7);
}

function money(value) {
  return "रु. " + Number(value || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    expenses = raw ? JSON.parse(raw) : [];
  } catch (error) {
    expenses = [];
  }
}

function saveLocal() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(expenses));
}

async function syncToFirebase() {
  if (!db || !currentUser || !navigator.onLine) return;
  try {
    const userRef = ref(db, `users/${currentUser.uid}/house_expenses`);
    await set(userRef, expenses);
  } catch (e) {
    console.error("Sync error", e);
  }
}

async function syncFromFirebase() {
  if (!db || !currentUser || !navigator.onLine) return;
  try {
    const snapshot = await get(child(ref(db), `users/${currentUser.uid}/house_expenses`));
    if (snapshot.exists()) {
      expenses = snapshot.val() || [];
      saveLocal();
      refreshView();
    } else {
      await syncToFirebase();
    }
  } catch (e) {
    console.error("Fetch error", e);
  }
}

function updateBudgetUI() {
  const savedBudget = Number(localStorage.getItem(BUDGET_KEY) || 0);
  if(savedBudget > 0) $("monthlyBudgetInput").value = savedBudget;

  const currentMonth = currentMonthStr();
  const monthTotal = expenses
    .filter(x => x.date && x.date.startsWith(currentMonth))
    .reduce((sum, x) => sum + Number(x.amount || 0), 0);

  if (savedBudget > 0) {
    const percent = Math.min(Math.round((monthTotal / savedBudget) * 100), 100);
    $("budgetText").textContent = `यो महिनाको खर्च: ${money(monthTotal)} / ${money(savedBudget)}`;
    $("budgetPercentText").textContent = `${percent}%`;

    const bar = $("budgetProgressBar");
    bar.style.width = `${percent}%`;

    if (percent < 50) {
      bar.style.backgroundColor = "#22c55e";
    } else if (percent < 85) {
      bar.style.backgroundColor = "#eab308";
    } else {
      bar.style.backgroundColor = "#ef4444";
    }
  } else {
    $("budgetText").textContent = "बजेट तोकिएको छैन";
    $("budgetPercentText").textContent = "0%";
    $("budgetProgressBar").style.width = "0%";
  }
}

$("setBudgetBtn").addEventListener("click", () => {
  const val = Number($("monthlyBudgetInput").value);
  if (val >= 0) {
    localStorage.setItem(BUDGET_KEY, val);
    updateBudgetUI();
  }
});

function renderChart(filtered) {
  const catMap = {};
  filtered.forEach(x => {
    catMap[x.category] = (catMap[x.category] || 0) + Number(x.amount || 0);
  });

  const labels = Object.keys(catMap);
  const data = Object.values(catMap);
  const bgColors = labels.map(cat => CATEGORY_COLORS[cat] || "#64748b");

  const ctx = document.getElementById('expenseChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  if(labels.length === 0) return;

  chartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{ data: data, backgroundColor: bgColors }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#e5edf8', font: { size: 11 } } }
      }
    }
  });
}

function getFilteredExpenses() {
  const query = $("search").value.trim().toLocaleLowerCase();
  const type = $("filterType").value;
  const day = $("dayFilter").value;
  const month = $("monthFilter").value;
  const year = $("yearFilter").value;

  return expenses.filter(item => {
    const text = `${item.title} ${item.category} ${item.note} ${item.paymentMethod || ''}`.toLocaleLowerCase();
    if (!text.includes(query)) return false;
    if (type === "day") return !!day && item.date === day;
    if (type === "month") return !!month && item.date.startsWith(month);
    if (type === "year") return !!year && item.date.startsWith(year + "-");
    return true;
  });
}

function updateYearOptions() {
  const select = $("yearFilter");
  const previous = select.value;
  const years = new Set(expenses.map(x => x.date?.slice(0, 4)).filter(Boolean));
  years.add(String(new Date().getFullYear()));

  select.replaceChildren();
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "वर्ष छान्नुहोस्";
  select.appendChild(placeholder);

  [...years].sort((a, b) => b.localeCompare(a)).forEach(year => {
    const option = document.createElement("option");
    option.value = year;
    option.textContent = year;
    select.appendChild(option);
  });

  if (years.has(previous)) select.value = previous;
}

function renderExpenses() {
  const filtered = getFilteredExpenses();

  $("periodTotal").textContent = money(filtered.reduce((sum, x) => sum + Number(x.amount || 0), 0));
  $("allTotal").textContent = money(expenses.reduce((sum, x) => sum + Number(x.amount || 0), 0));

  renderChart(filtered);
  updateBudgetUI();

  const type = $("filterType").value;
  const labels = {
    day: `दिन: ${$("dayFilter").value || "छानिएको छैन"}`,
    month: `महिना: ${$("monthFilter").value || "छानिएको छैन"}`,
    year: `वर्ष: ${$("yearFilter").value || "छानिएको छैन"}`
  };

  $("filterSummary").textContent = `${labels[type]} · ${filtered.length} रेकर्ड`;

  const list = $("expenseList");
  list.replaceChildren();

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">कुनै खर्च रेकर्ड भेटिएन।</div>';
    $("seeMoreContainer").hidden = true;
    return;
  }

  // See More logic: यदि ४ भन्दा बढी छन् र showAllRecords falso छ भने सुरुमा ३/४ वटा मात्र देखाउने
  const displayLimit = showAllRecords ? filtered.length : 4;
  const visibleItems = filtered.slice(0, displayLimit);

  for (const item of visibleItems) {
    const card = document.createElement("div");
    card.className = "expense";
    card.innerHTML = `
      <div class="expense-top">
        <div>
          <div class="expense-name">${item.title}</div>
          <div class="amount red">${money(item.amount)}</div>
          <div class="expense-meta">${item.date} · ${item.category} ${item.paymentMethod ? `(${item.paymentMethod})` : ''}</div>
          ${item.note ? `<div class="expense-meta">${item.note}</div>` : ''}
        </div>
        <div class="actions">
          <button type="button" class="small-btn edit-btn" onclick="editExpense('${item.id}')"><i class="fa-solid fa-pen"></i></button>
          <button type="button" class="small-btn delete-btn" onclick="deleteExpense('${item.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    `;
    list.appendChild(card);
  }

  if (filtered.length > 4) {
    $("seeMoreContainer").hidden = false;
    $("seeMoreBtn").textContent = showAllRecords ? "কম കാണിക്കുക (Less)" : `See More... (${filtered.length - 4} थप)`;
  } else {
    $("seeMoreContainer").hidden = true;
  }
}

$("seeMoreBtn").addEventListener("click", () => {
  showAllRecords = !showAllRecords;
  renderExpenses();
});

function refreshView() {
  updateYearOptions();
  renderExpenses();
}

function resetForm() {
  $("expenseForm").reset();
  $("edit-id").value = "";
  $("date").value = localDate();
  $("form-heading").textContent = "➕ नयाँ खर्च लेख्नुहोस्";
  $("saveBtn").textContent = "💾 खर्च सेभ गर्नुहोस्";
  $("cancel-btn").hidden = true;
}

window.editExpense = function(id) {
  const item = expenses.find(x => x.id === id);
  if (!item) return;
  $("edit-id").value = id;
  $("title").value = item.title;
  $("amount").value = item.amount;
  $("category").value = item.category;
  if(item.paymentMethod) $("paymentMethod").value = item.paymentMethod;
  $("date").value = item.date || localDate();
  $("note").value = item.note || "";
  $("form-heading").textContent = "✏️ खर्च सम्पादन गर्नुहोस्";
  $("saveBtn").textContent = "अपडेट गर्नुहोस्";
  $("cancel-btn").hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.deleteExpense = async function(id) {
  const item = expenses.find(x => x.id === id);
  if (!item || !confirm(`"${item.title}" खर्च मेटाउने हो?`)) return;
  expenses = expenses.filter(x => x.id !== id);
  saveLocal();
  refreshView();
  await syncToFirebase();
};

$("cancel-btn").addEventListener("click", resetForm);

$("expenseForm").addEventListener("submit", async event => {
  event.preventDefault();
  const title = $("title").value.trim();
  const amount = Number($("amount").value);
  const category = $("category").value;
  const paymentMethod = $("paymentMethod").value;
  const date = $("date").value;
  const note = $("note").value.trim();
  const editId = $("edit-id").value;

  if (!title || !Number.isFinite(amount) || amount <= 0 || !date) return;

  if (editId) {
    const idx = expenses.findIndex(x => x.id === editId);
    if (idx !== -1) expenses[idx] = { id: editId, title, amount, category, paymentMethod, date, note };
  } else {
    const id = "exp_" + Date.now();
    expenses.unshift({ id, title, amount, category, paymentMethod, date, note });
  }

  saveLocal();
  refreshView();
  resetForm();
  await syncToFirebase();
});

// PDF रिपोर्ट बनाउने
function generateHouseExpensePDF() {
  const filtered = getFilteredExpenses();
  if (filtered.length === 0) {
    alert("कुनै खर्च रेकर्ड फेला परेन।");
    return;
  }

  let totalExpense = 0;
  let html = `
  <div id="pdf-printable-content" style="background-color: #ffffff; color: #333333; font-family: sans-serif; width: 100%; max-width: 650px; padding: 20px; margin:auto;">
      <h3 style="text-align:center; color:#16a34a; margin-bottom:15px;">🏠 घर खर्च रिपोर्ट (House Expense Report)</h3>
      <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
          <thead>
              <tr style="background-color: #f3f4f6; color: #374151;">
                  <th style="padding: 8px; text-align: left; border-bottom: 1px solid #d1d5db;">मिति</th>
                  <th style="padding: 8px; text-align: left; border-bottom: 1px solid #d1d5db;">खर्चको नाम</th>
                  <th style="padding: 8px; text-align: left; border-bottom: 1px solid #d1d5db;">प्रकार / माध्यम</th>
                  <th style="padding: 8px; text-align: right; border-bottom: 1px solid #d1d5db;">रकम (रु.)</th>
              </tr>
          </thead>
          <tbody>`;

  filtered.forEach(item => {
    totalExpense += Number(item.amount || 0);
    html += `
        <tr style="border-bottom: 1px solid #e5e7eb;">
            <td style="padding: 8px;">${item.date}</td>
            <td style="padding: 8px; font-weight: bold;">${item.title}</td>
            <td style="padding: 8px; color: #6b7280;">${item.category} ${item.paymentMethod ? `(${item.paymentMethod})` : ''}</td>
            <td style="padding: 8px; text-align: right; font-weight: bold; color: #dc2626;">${money(item.amount)}</td>
        </tr>`;
  });

  html += `
          </tbody>
      </table>
      <div style="margin-top: 20px; text-align: right; font-size: 14px; font-weight: bold; color: #dc2626; border-top: 2px solid #16a34a; padding-top: 10px;">
          जम्मा खर्च: ${money(totalExpense)}
      </div>
  </div>`;

  $("pdfPreviewContainer").innerHTML = html;
  $("pdfModal").style.display = "flex";
}

window.closePdfModal = function() {
  $("pdfModal").style.display = "none";
}

window.printPdfReport = function() {
  const content = document.getElementById('pdf-printable-content');
  const printWindow = window.open('', '_blank');
  printWindow.document.write('<html><head><title>घर खर्च रिपोर्ट</title></head><body>');
  printWindow.document.write(content.innerHTML);
  printWindow.document.write('</body></html>');
  printWindow.document.close();
  setTimeout(() => { printWindow.print(); }, 500);
}

$("pdfBtn").addEventListener("click", generateHouseExpensePDF);

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), expenses }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "house-expenses-report.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

$("search").addEventListener("input", () => { showAllRecords = false; renderExpenses(); });
$("filterType").addEventListener("change", () => {
  const type = $("filterType").value;
  $("dayBox").hidden = type !== "day";
  $("monthBox").hidden = type !== "month";
  $("yearBox").hidden = type !== "year";
  showAllRecords = false;
  renderExpenses();
});

$("dayFilter").addEventListener("change", () => { showAllRecords = false; renderExpenses(); });
$("monthFilter").addEventListener("change", () => { showAllRecords = false; renderExpenses(); });
$("yearFilter").addEventListener("change", () => { showAllRecords = false; renderExpenses(); });

$("date").value = localDate();
$("dayFilter").value = localDate();
$("monthFilter").value = currentMonthStr();

loadLocal();
refreshView();
