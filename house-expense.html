<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">
  <title>घर खर्च | Digital Notebook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      color: #172b1b;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    .header {
      background: #166534;
      color: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .header h2 {
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #0000000b;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
    }

    input, select, textarea {
      border: 1px solid #d1d5db;
      background: white;
      color: #172b1b;
    }

    textarea {
      resize: vertical;
    }

    button {
      border: none;
      background: #166534;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary .card {
      margin: 0;
    }

    .amount {
      font-size: 21px;
      font-weight: bold;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    .green {
      color: #15803d;
    }

    .red {
      color: #dc2626;
    }

    .expense {
      border: 1px solid #e5e7eb;
      padding: 13px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .expense-name {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .expense-meta {
      color: #6b7280;
      font-size: 13px;
      margin-top: 5px;
    }

    .delete-btn {
      width: auto;
      min-width: 65px;
      margin: 0;
      padding: 8px 10px;
      background: #dc2626;
    }

    #status {
      font-size: 13px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 18px 0;
    }

    .back-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #374151;
      color: white;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 16px;
    }

    @media (max-width: 380px) {
      body {
        padding: 10px;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <a class="back-btn" href="index.html">← Dashboard मा फर्कनुहोस्</a>

    <div class="header">
      <h2>🏠 घर खर्च</h2>
      <p>आफ्नो दैनिक खर्च लेख्नुहोस् — Firebase मा Real-time Backup</p>
      <div id="status">Firebase सँग जडान हुँदैछ...</div>
    </div>

    <div class="summary">
      <div class="card">
        <div>आजको खर्च</div>
        <div class="amount red" id="todayTotal">रु. ०</div>
      </div>

      <div class="card">
        <div>जम्मा खर्च</div>
        <div class="amount green" id="allTotal">रु. ०</div>
      </div>
    </div>

    <div class="card">
      <h3 id="form-heading">➕ नयाँ खर्च लेख्नुहोस्</h3>

      <form id="expenseForm" onsubmit="saveExpenseData(event)">
        <input type="hidden" id="edit-expense-id" value="">
        
        <label for="title">खर्चको नाम</label>
        <input id="title" type="text" placeholder="जस्तै: तरकारी, चामल, दूध" required>

        <label for="amount">रकम (रु.)</label>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="जस्तै: 250" required>

        <label for="category">खर्चको प्रकार</label>
        <select id="category">
          <option value="खाना तथा किराना">खाना तथा किराना</option>
          <option value="तरकारी">तरकारी</option>
          <option value="बिजुली तथा पानी">बिजुली तथा पानी</option>
          <option value="यातायात">यातायात</option>
          <option value="स्वास्थ्य">स्वास्थ्य</option>
          <option value="शिक्षा">शिक्षा</option>
          <option value="घरायसी सामान">घरायसी सामान</option>
          <option value="अन्य">अन्य</option>
        </select>

        <label for="date">मिति</label>
        <input id="date" type="date" required>

        <label for="note">कैफियत (ऐच्छिक)</label>
        <textarea id="note" rows="2" placeholder="थप जानकारी..."></textarea>

        <div style="display: flex; gap: 10px; margin-top: 12px;">
          <button type="button" id="cancel-btn" onclick="resetExpenseForm()" style="background: #6b7280; display: none;">रद्द गर्नुहोस्</button>
          <button id="saveBtn" type="submit">💾 खर्च सेभ गर्नुहोस्</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3>📋 खर्चको विवरण</h3>

      <label for="search">खर्च खोज्नुहोस्</label>
      <input id="search" type="search" placeholder="नाम वा प्रकारबाट खोज्नुहोस्">

      <label for="monthFilter">महिना छान्नुहोस्</label>
      <input id="monthFilter" type="month">

      <div id="expenseList">
        <div class="empty">खर्च लोड हुँदैछ...</div>
      </div>

      <button id="exportBtn" type="button" style="background: #0284c7;">⬇️ खर्च JSON डाउनलोड</button>
    </div>

  </div>

  <!-- Firebase SDK Modules Import -->
  <script type="module">
    import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
      authDomain: "digital-a2552.firebaseapp.com",
      databaseURL: "https://digital-a2552-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "digital-a2552",
      storageBucket: "digital-a2552.firebasestorage.app",
      messagingSenderId: "218135618179",
      appId: "1:218135618179:web:821b76920d3e5669ac31b6"
    };

    const $ = id => document.getElementById(id);

    let app, auth, db;
    let currentUser = null;
    let expensesData = {};

    function setStatus(message, color = "#166534") {
      $("status").textContent = message;
      $("status").style.color = color;
    }

    function money(value) {
      return "रु. " + Number(value || 0).toLocaleString("en-IN", {
        maximumFractionDigits: 2
      });
    }

    function localDate() {
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    $("date").value = localDate();

    try {
      try {
        app = getApp();
      } catch {
        app = initializeApp(firebaseConfig);
      }

      auth = getAuth(app);
      db = getDatabase(app);

      onAuthStateChanged(auth, user => {
        currentUser = user;

        if (!user) {
          setStatus("लगइन गरिएको छैन। कृपया Dashboard बाट लगइन गर्नुहोस्।", "#dc2626");
          expensesData = {};
          renderExpenses();
          $("saveBtn").disabled = true;
          return;
        }

        $("saveBtn").disabled = false;
        setStatus("☁️ Firebase Real-time Sync सक्रिय छ।");

        const userExpenseRef = ref(db, `users/${user.uid}/expenses`);
        
        // Real-time listener: डेटा परिवर्तन हुनेबित्तिकै अटोमेटिक अपटेड हुन्छ र कहिल्यै हराउँदैन
        onValue(userExpenseRef, snapshot => {
          expensesData = snapshot.val() || {};
          // LocalStorage मा पनि ब्याकअप राख्ने
          localStorage.setItem('digital_notebook_expenses', JSON.stringify(expensesData));
          renderExpenses();
        }, error => {
          setStatus("डेटा लोड गर्न समस्या भयो: " + error.message, "#dc2626");
        });
      });

    } catch (error) {
      setStatus("Firebase जडान त्रुटि: " + error.message, "#dc2626");
    }

    // ग्लोबल फंक्सनहरू विन्डोजमा बाइण्ड गरिएको
    window.saveExpenseData = async function(event) {
      event.preventDefault();
      if (!currentUser) {
        alert("लगइन गर्नुहोस्!");
        return;
      }

      const editId = $("edit-expense-id").value;
      const title = $("title").value.trim();
      const amount = Number($("amount").value);
      const category = $("category").value;
      const date = $("date").value;
      const note = $("note").value.trim();

      if (!title || !amount || !date) {
        alert("कृपया सबै आवश्यक विवरण भर्नुहोस्।");
        return;
      }

      $("saveBtn").disabled = true;
      setStatus("Firebase मा सेभ हुँदैछ...");

      try {
        const userExpenseRef = ref(db, `users/${currentUser.uid}/expenses`);

        if (editId) {
          // अपडेट गर्ने
          const singleRef = ref(db, `users/${currentUser.uid}/expenses/${editId}`);
          await update(singleRef, { title, amount, category, date, note, updatedAt: Date.now() });
          setStatus("✅ खर्च सफलताપूर्वक अपडेट भयो!");
        } else {
          // नयाँ थप्ने
          const newRef = push(userExpenseRef);
          await set(newRef, { title, amount, category, date, note, createdAt: Date.now() });
          setStatus("✅ खर्च सफलताપूर्वक सेभ भयो!");
        }

        resetExpenseForm();
      } catch (err) {
        setStatus("❌ सेभ गर्न असफल: " + err.message, "#dc2626");
      } finally {
        $("saveBtn").disabled = false;
      }
    }

    window.editExpense = function(id) {
      const item = expensesData[id];
      if (!item) return;

      $("edit-expense-id").value = id;
      $("title").value = item.title;
      $("amount").value = item.amount;
      $("category").value = item.category;
      $("date").value = item.date;
      $("note").value = item.note || "";

      $("form-heading").textContent = "✏️ खर्च सम्पादन गर्नुहोस्";
      $("saveBtn").textContent = "अपडेट गर्नुहोस्";
      $("cancel-btn").style.display = "block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.resetExpenseForm = function() {
      $("expenseForm").reset();
      $("edit-expense-id").value = "";
      $("date").value = localDate();
      $("form-heading").textContent = "➕ नयाँ खर्च लेख्नुहोस्";
      $("saveBtn").textContent = "💾 खर्च सेभ गर्नुहोस्";
      $("cancel-btn").style.display = "none";
    }

    window.deleteExpense = async function(id) {
      if (!confirm("के तपाईँ यो खर्च मेटाउन चाहनुहुन्छ?")) return;
      try {
        await remove(ref(db, `users/${currentUser.uid}/expenses/${id}`));
        setStatus("🗑️ खर्च मेटाइयो।");
      } catch (err) {
        setStatus("मेटाउन सकिएन: " + err.message, "#dc2626");
      }
    }

    function renderExpenses() {
      const items = Object.entries(expensesData).map(([id, item]) => ({ id, ...item }));
      const today = localDate();

      const todayTotal = items
        .filter(item => item.date === today)
        .reduce((sum, item) => sum + Number(item.amount || 0), 0);

      const allTotal = items
        .reduce((sum, item) => sum + Number(item.amount || 0), 0);

      $("todayTotal").textContent = money(todayTotal);
      $("allTotal").textContent = money(allTotal);

      const query = $("search").value.trim().toLowerCase();
      const month = $("monthFilter").value;

      const filtered = items
        .filter(item => {
          const text = `${item.title || ""} ${item.category || ""} ${item.note || ""}`.toLowerCase();
          return text.includes(query) && (!month || (item.date || "").startsWith(month));
        })
        .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));

      const list = $("expenseList");
      list.replaceChildren();

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "कुनै खर्च भेटिएन।";
        list.appendChild(empty);
        return;
      }

      for (const item of filtered) {
        const card = document.createElement("div");
        card.className = "expense";

        const top = document.createElement("div");
        top.className = "expense-top";

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "expense-name";
        name.textContent = item.title || "नाम छैन";

        const amount = document.createElement("div");
        amount.className = "amount red";
        amount.textContent = money(item.amount);

        const meta = document.createElement("div");
        meta.className = "expense-meta";
        meta.textContent = `${item.date || ""} • ${item.category || "अन्य"}`;

        info.append(name, amount, meta);

        if (item.note) {
          const note = document.createElement("div");
          note.className = "expense-meta";
          note.textContent = item.note;
          info.appendChild(note);
        }

        const btnContainer = document.createElement("div");
        btnContainer.style.display = "flex";
        btnContainer.style.gap = "5px";

        const editBtn = document.createElement("button");
        editBtn.className = "delete-btn";
        editBtn.style.background = "#2563eb";
        editBtn.type = "button";
        editBtn.innerHTML = '<i class="fa-solid fa-pen"></i>';
        editBtn.title = "सम्पादन गर्नुहोस्";
        editBtn.addEventListener("click", () => editExpense(item.id));

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.type = "button";
        delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
        delBtn.title = "मेटाउनुहोस्";
        delBtn.addEventListener("click", () => deleteExpense(item.id));

        btnContainer.append(editBtn, delBtn);
        top.append(info, btnContainer);
        card.appendChild(top);
        list.appendChild(card);
      }
    }

    $("search").addEventListener("input", renderExpenses);
    $("monthFilter").addEventListener("input", renderExpenses);

    $("exportBtn").addEventListener("click", () => {
      const data = JSON.stringify(expensesData, null, 2);
      const blob = new Blob([cloudToJsonFormat(data)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "house-expenses.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    function cloudToJsonFormat(jsonStr) {
      return jsonStr;
    }
  </script>
</body>
</html>
