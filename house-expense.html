<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>house-expense - Firebase</title>
<style>
:root {
  --green: #176b52;
  --bg: #f3f7f5;
  --text: #20352b;
  --muted: #708078;
  --border: #e1eae4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}
.app { max-width: 1000px; margin: auto; padding: 16px; }
header {
  background: linear-gradient(135deg,#125b46,#278666);
  color: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 16px;
}
header h1 { margin: 0; }
header p { margin-bottom: 0; color: #e0f3e9; }
.auth-box {
  background: white;
  padding: 20px;
  border-radius: 16px;
  max-width: 400px;
  margin: 40px auto;
  border: 1px solid var(--border);
}
.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-top: 20px;
}
.stat {
  background: #ffffff1c;
  padding: 12px;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
.stat span { font-size: 12px; }
.stat strong { display: block; font-size: 20px; margin-top: 5px; }
.layout {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 16px;
}
.card {
  background: white;
  padding: 18px;
  border-radius: 16px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
h2 { font-size: 18px; margin: 0 0 15px; }
.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.full { grid-column: 1/-1; }
label { font-size: 13px; font-weight: 650; }
input {
  width: 100%;
  min-width: 0;
  padding: 11px;
  border: 1px solid #d8e3dc;
  border-radius: 10px;
  background: white;
  font: inherit;
}
button {
  padding: 10px 13px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  font: inherit;
  font-weight: 650;
}
.primary { background: var(--green); color: white; }
.secondary { background: #e7f3ec; color: var(--green); }
.danger { background: #fff0f0; color: #b52e35; }
.fullbtn { width: 100%; margin-top: 14px; }
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.chips { display: flex; gap: 7px; margin-bottom: 15px; }
.chip { background: #f0f4f1; color: #526158; }
.chip.active { background: #dcefe4; color: var(--green); }
.muted { font-size: 12px; color: var(--muted); }
.quick, .records { display: grid; gap: 10px; }
.quickitem, .record {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
}
.quickitem {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 9px;
  align-items: center;
}
.rank {
  background: #e7f3ec;
  color: var(--green);
  padding: 7px;
  text-align: center;
  border-radius: 9px;
}
.bar {
  height: 5px;
  background: #edf2ee;
  margin-top: 6px;
  border-radius: 10px;
  overflow: hidden;
}
.bar span {
  display: block;
  height: 100%;
  background: #278666;
}
.record {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  overflow-wrap: anywhere;
}
.recordright { text-align: right; flex-shrink: 0; }
.recordright button { margin-top: 6px; font-size: 12px; padding: 6px; }
.recordtitle { font-weight: 750; }
.empty { padding: 20px; text-align: center; color: var(--muted); }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.6; }
@media(max-width:700px) {
  .layout { grid-template-columns: 1fr; }
  .app { padding: 10px; }
  .card { padding: 14px; }
}
</style>
</head>
<body>

<!-- लगइन नभएका बेला देखाउने खण्ड -->
<div id="authScreen" class="app" style="display:none;">
  <div class="auth-box">
    <h2>🔐 मेरो घरखर्च - लगइन</h2>
    <div class="field" style="margin-bottom:12px;">
      <label>इमेल (Email)</label>
      <input type="email" id="authEmail" placeholder="example@gmail.com">
    </div>
    <div class="field" style="margin-bottom:16px;">
      <label>पासवर्ड (Password)</label>
      <input type="password" id="authPass" placeholder="******">
    </div>
    <button class="primary fullbtn" id="loginBtn">लगइन गर्नुहोस्</button>
    <button class="secondary fullbtn" id="signupBtn" style="margin-top:8px;">नयाँ खाता खोल्नुहोस्</button>
  </div>
</div>

<!-- लगइन भएपछि देखिने मुख्य एप -->
<div id="mainApp" class="app" style="display:none;">
<header>
  <div class="row">
    <div>
      <h1>🏡 मेरो घरखर्च</h1>
      <p>दैनिक किनमेल र खर्चको सजिलो हिसाब</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="index.html" class="secondary" style="padding: 10px 13px; border-radius: 10px; text-decoration: none; font-weight: 650; display: inline-block;">ड्यासबोर्ड</a>
      <button class="secondary" id="logoutBtn">लगआउट</button>
    </div>
  </div>
  <p id="today" style="margin-top:10px;"></p>
  <div class="stats">
    <div class="stat"><span>आजको खर्च</span><strong id="todayTotal">रु. ०</strong></div>
    <div class="stat"><span>यो महिनाको खर्च</span><strong id="monthTotal">रु. ०</strong></div>
    <div class="stat"><span>जम्मा खर्च</span><strong id="allTotal">रु. ०</strong></div>
  </div>
</header>

<div class="layout">
<div>
<section class="card">
  <h2 id="formTitle">➕ नयाँ खर्च लेख्नुहोस्</h2>
  <form id="expenseForm">
    <div class="formgrid">
      <div class="field">
        <label for="date">किनेको मिति</label>
        <input id="date" type="date" required>
      </div>
      <div class="field">
        <label for="item">सामानको नाम</label>
        <input id="item" list="suggestions" placeholder="चामल, तेल..." required>
        <datalist id="suggestions"></datalist>
      </div>
      <div class="field">
        <label for="qty">परिमाण</label>
        <input id="qty" placeholder="२ केजी, १ प्याकेट">
      </div>
      <div class="field">
        <label for="amount">जम्मा मूल्य (रु.)</label>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="250" required>
      </div>
      <div class="field full">
        <label for="note">थप विवरण (ऐच्छिक)</label>
        <input id="note" placeholder="थप जानकारी">
      </div>
    </div>
    <button class="primary fullbtn" id="saveBtn">खर्च सेभ गर्नुहोस्</button>
    <button class="secondary fullbtn" id="cancelBtn" type="button" hidden>रद्द गर्नुहोस्</button>
  </form>
  <p class="note">तपाईंको हिसाब Firebase Database मा सुरक्षित रूपमा सेभ भइरहेको छ।</p>
</section>

<section class="card">
  <h2>⚡ Quick Summary</h2>
  <div class="chips">
    <button class="chip active" data-period="month">यो महिना</button>
    <button class="chip" data-period="today">आज</button>
    <button class="chip" data-period="all">सबै समय</button>
  </div>
  <p class="muted" id="quickCaption">धेरै पटक किनिएका सामान</p>
  <div class="quick" id="quickList"></div>
</section>
</div>

<div>
<section class="card">
  <div class="row">
    <h2>🧾 खर्चको रेकर्ड</h2>
    <button class="secondary" id="exportBtn">⬇ ब्याकअप</button>
  </div>
  <div class="filters">
    <div class="field">
      <label for="filterDate">मिति छान्नुहोस्</label>
      <input id="filterDate" type="date">
    </div>
    <div class="field">
      <label for="search">सामान खोज्नुहोस्</label>
      <input id="search" placeholder="चामल, तेल...">
    </div>
  </div>
  <div class="row">
    <p class="muted" id="recordCount"></p>
    <button class="secondary" id="clearBtn">फिल्टर हटाउनुहोस्</button>
  </div>
  <div class="records" id="records"></div>
</section>
</div>
</div>
</div>

<!-- Firebase Scripts -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, set, get, child, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
    authDomain: "digital-a2552.firebaseapp.com",
    projectId: "digital-a2552",
    databaseURL: "https://digital-a2552-default-rtdb.asia-southeast1.firebasedatabase.app",
    storageBucket: "digital-a2552.firebasestorage.app",
    messagingSenderId: "218135618179",
    appId: "1:218135618179:web:821b76920d3e5669ac31b6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const $ = id => document.getElementById(id);
  let currentUser = null;
  let expenses = [];
  let editingId = null;
  let quickPeriod = 'month';

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }
  function money(n) {
    return 'रु. ' + Number(n || 0).toLocaleString('ne-NP',{ maximumFractionDigits:2 });
  }
  function formatDate(s) {
    if (!s) return '';
    const [y,m,d] = s.split('-');
    return d + '/' + m + '/' + y;
  }
  function escapeHTML(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  // Authentication States
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      $('authScreen').style.display = 'none';$('mainApp').style.display = 'block';
      fetchData();
    } else {
      currentUser = null;
      $('mainApp').style.display = 'none';$('authScreen').style.display = 'block';
    }
  });

  $('loginBtn').addEventListener('click', () => {
    const email = $('authEmail').value;
    const pass = $('authPass').value;
    signInWithEmailAndPassword(auth, email, pass).catch(err => alert('लगइन असफल: ' + err.message));
  });

  $('signupBtn').addEventListener('click', () => {
    const email = $('authEmail').value;
    const pass = $('authPass').value;
    createUserWithEmailAndPassword(auth, email, pass).catch(err => alert('साइनअप असफल: ' + err.message));
  });

  $('logoutBtn').addEventListener('click', () => signOut(auth));

  // Database Fetch & Save
  function fetchData() {
    if (!currentUser) return;
    const dbRef = ref(db, 'users/' + currentUser.uid + '/expenses');
    get(dbRef).then(snapshot => {
      expenses = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        Object.keys(data).forEach(key => {
          expenses.push({ id: key, ...data[key] });
        });
      }
      render();
    });
  }

  function total(rows) {
    return rows.reduce((s,x) => s + Number(x.amount), 0);
  }

  function render() {
    const today = todayISO();
    const month = today.slice(0,7);

    $('today').textContent = 'आज: ' + formatDate(today);
    $('todayTotal').textContent = money(total(expenses.filter(x => x.date === today)));
    $('monthTotal').textContent = money(total(expenses.filter(x => x.date.startsWith(month))));$('allTotal').textContent = money(total(expenses));

    const names = [...new Set(expenses.map(x => x.item.trim()))];
    $('suggestions').innerHTML = names.map(x => '<option value="' + escapeHTML(x) + '"></option>').join('');

    renderQuick();
    renderRecords();
  }

  function renderQuick() {
    const today = todayISO();
    const month = today.slice(0,7);
    const rows = expenses.filter(x => {
      if (quickPeriod === 'today') return x.date === today;
      if (quickPeriod === 'month') return x.date.startsWith(month);
      return true;
    });

    const groups = {};
    rows.forEach(x => {
      const key = x.item.trim().toLocaleLowerCase();
      if (!groups[key]) groups[key] = { name:x.item.trim(), count:0, amount:0 };
      groups[key].count++;
      groups[key].amount += Number(x.amount);
    });

    const list = Object.values(groups).sort((a,b) => b.count-a.count || b.amount-a.amount).slice(0,10);
    $('quickCaption').textContent = {
      today:'आज धेरै पटक किनिएका सामान',
      month:'यो महिना धेरै पटक किनिएका सामान',
      all:'सबै समय धेरै पटक किनिएका सामान'
    }[quickPeriod];

    $('quickList').innerHTML = list.length ? list.map((x,i) =>
      '<div class="quickitem">' +
        '<div class="rank">' + (i+1) + '</div>' +
        '<div><b>' + escapeHTML(x.name) + '</b>' +
        '<div class="muted">' + x.count + ' पटक · ' + money(x.amount) + '</div>' +
        '<div class="bar"><span style="width:' + Math.max(4,x.count/list[0].count*100) + '%"></span></div></div>' +
        '<b>' + x.count + ' पटक</b>' +
      '</div>'
    ).join('') : '<div class="empty">अहिलेसम्म खर्च लेखिएको छैन।</div>';
  }

  function renderRecords() {
    const date = $('filterDate').value;
    const q = $('search').value.trim().toLocaleLowerCase();

    const rows = [...expenses].filter(x =>
      (!date || x.date === date) &&
      (!q || [x.item,x.qty,x.note].some(v => String(v || '').toLocaleLowerCase().includes(q)))
    ).sort((a,b) => b.date.localeCompare(a.date));

    $('recordCount').textContent = rows.length + ' रेकर्ड · ' + money(total(rows));

    $('records').innerHTML = rows.length ? rows.map(x =>
      '<div class="record"><div>' +
        '<div class="recordtitle">' + escapeHTML(x.item) + '</div>' +
        '<div class="muted">' + formatDate(x.date) + (x.qty ? ' · ' + escapeHTML(x.qty) : '') + (x.note ? ' · ' + escapeHTML(x.note) : '') + '</div>' +
      '</div><div class="recordright"><b>' + money(x.amount) + '</b><br>' +
      '<button class="secondary" data-edit="' + escapeHTML(x.id) + '">सच्याउनुहोस्</button> ' +
      '<button class="danger" data-delete="' + escapeHTML(x.id) + '">हटाउनुहोस्</button></div></div>'
    ).join('') : '<div class="empty">रेकर्ड भेटिएन।</div>';
  }

  function resetForm() {
    $('expenseForm').reset();$('date').value = todayISO();
    editingId = null;
    $('formTitle').textContent = '➕ नयाँ खर्च लेख्नुहोस्';
    $('saveBtn').textContent = 'खर्च सेभ गर्नुहोस्';
    $('cancelBtn').hidden = true;
  }

  $('date').value = todayISO();

  $('expenseForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!currentUser) return;

    const item = $('item').value.trim();
    const date = $('date').value;
    const amount = Number($('amount').value);
    const qty = $('qty').value.trim();
    const note = $('note').value.trim();

    if (!item || !date || !Number.isFinite(amount) || amount <= 0) {
      alert('सामान, मिति र सही रकम भर्नुहोस्।');
      return;
    }

    const expenseData = { date, item, qty, amount, note };

    if (editingId) {
      await update(ref(db, `users/${currentUser.uid}/expenses/${editingId}`), expenseData);
      expenses = expenses.map(x => x.id === editingId ? { id: editingId, ...expenseData } : x);
    } else {
      const newId = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      await set(ref(db, `users/${currentUser.uid}/expenses/${newId}`), expenseData);
      expenses.push({ id: newId, ...expenseData });
    }

    resetForm();
    render();
  });

  $('cancelBtn').addEventListener('click', resetForm);

  $('records').addEventListener('click', async e => {
    const edit = e.target.closest('[data-edit]');
    const del = e.target.closest('[data-delete]');

    if (edit) {
      const x = expenses.find(a => a.id === edit.dataset.edit);
      if (!x) return;
      editingId = x.id;
      $('date').value = x.date;
      $('item').value = x.item;
      $('qty').value = x.qty \vert{}\vert{} '';$('amount').value = x.amount;
      $('note').value = x.note \vert{}\vert{} '';$('formTitle').textContent = '✏️ खर्च सच्याउनुहोस्';
      $('saveBtn').textContent = 'परिवर्तन सेभ गर्नुहोस्';
      $('cancelBtn').hidden = false;
      window.scrollTo({top:0,behavior:'smooth'});
    }

    if (del) {
      const id = del.dataset.delete;
      const x = expenses.find(a => a.id === id);
      if (x && confirm(x.item + ' को रेकर्ड हटाउने?')) {
        await remove(ref(db, `users/${currentUser.uid}/expenses/${id}`));
        expenses = expenses.filter(a => a.id !== id);
        render();
        if (editingId === id) resetForm();
      }
    }
  });

  document.querySelectorAll('[data-period]').forEach(btn => {
    btn.addEventListener('click', () => {
      quickPeriod = btn.dataset.period;
      document.querySelectorAll('[data-period]').forEach(b => b.classList.toggle('active', b === btn));
      renderQuick();
    });
  });

  $('filterDate').addEventListener('change', renderRecords);
  $('search').addEventListener('input', renderRecords);$('clearBtn').addEventListener('click', () => {
    $('filterDate').value = '';$('search').value = '';
    renderRecords();
  });

  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({version:1,expenses},null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ghar-kharcha-backup-' + todayISO() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
</script>
</body>
</html>
