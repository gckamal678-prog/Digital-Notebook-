<script>
(function(){
  const KEY="digital_notebook_settings";
  const DEF={theme:"dark",lang:"ne",font_size:"16",font_family:"Poppins",accentColor:"#10b981",layout:"comfortable"};
  let s={};
  try{s=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
  if(!s.theme&&localStorage.getItem("theme"))s.theme=localStorage.getItem("theme");
  s={...DEF,...s};
  const r=document.documentElement;
  r.classList.toggle("light",s.theme==="light");
  r.style.setProperty("--accent",s.accentColor||DEF.accentColor);
  r.style.setProperty("--app-font-size",(Number(s.font_size)||16)+"px");
  r.style.setProperty("--app-font-family",JSON.stringify(String(s.font_family||"Poppins").replace(/[";]/g,""))+",Arial,sans-serif");
  r.dataset.layout=s.layout==="compact"?"compact":"comfortable";
  r.lang=s.lang==="en"?"en":"ne";
})();
</script>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:var(--app-font-size)/1.55 var(--app-font-family)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header a{color:var(--text);text-decoration:none;font-size:26px;line-height:1}
header b{font-size:1rem}
main{max-width:1050px;margin:auto;padding:16px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
h1,h2,h3,p{margin-top:0}h2{font-size:1.2em}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
label{display:block;color:var(--muted);font-size:.88em}
input,select,textarea,button{width:100%;min-width:0;font:inherit;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);margin-top:4px}
button{cursor:pointer;font-weight:650}button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:var(--accent);color:#062319;border-color:var(--accent)}
.danger{color:var(--danger)}
.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row button,.actions button{width:auto}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.summary>div{background:var(--field);padding:12px;border-radius:12px;overflow-wrap:anywhere}
.summary strong{display:block;font-size:1.12em}
.expense{border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:8px;overflow-wrap:anywhere}
.expense-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.expense-name{font-weight:700;overflow-wrap:anywhere}
.record-meta{color:var(--muted);font-size:.88em;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:18px 5px}
.status{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;margin:0 0 12px;overflow-wrap:anywhere}
.status:empty{display:none}.status.error{border-color:var(--danger);color:var(--danger)}.status.good{border-color:var(--accent)}
.progress{height:12px;border-radius:10px;background:var(--field);border:1px solid var(--line);overflow:hidden;margin-top:8px}
#progressBar{height:100%;width:0;background:var(--accent)}
#chartBox{height:250px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:12px}
.modal-panel{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0008}
.modal-panel h2{margin-bottom:12px}.modal-panel p{white-space:pre-line;overflow-wrap:anywhere}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px}
.modal-actions button{width:auto;min-width:100px}
body.auth-pending main,body.auth-pending header{visibility:hidden}
body[data-layout="compact"] main{gap:8px;padding:8px}
body[data-layout="compact"] .card{padding:12px}
body[data-layout="compact"] .expense{padding:8px;margin-top:6px}
@media(max-width:560px){main{padding:10px}.card{padding:12px}header{padding:10px}.expense-top{flex-direction:column}}
</style>

 document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));
 document.title="Digital NoteBook · "+(settings.lang==="en"?"House Expense":"घर खर्च");
 $("formTitle").textContent=$("editId").value?t("editExpense"):t("addExpense");

window.addEventListener("storage",e=>{if(e.key===SETTINGS_KEY)applyPreferences()});
window.addEventListener("focus",applyPreferences);
window.addEventListener("pageshow",applyPreferences);

function showStatus(message,kind=""){const el=$("status");el.textContent=message||"";el.className="status"+(kind?" "+kind:"")}
function clearStatus(){showStatus("")}
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function n(value){const x=Number(value);return Number.isFinite(x)?x:0}
function money(value){return "NPR "+n(value).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function localDate(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function currentMonth(){return localDate().slice(0,7)}
function userPath(path=""){if(!user)throw new Error(t("signIn"));return "users/"+user.uid+(path?"/"+path:"")}
function newId(){return "house_"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random().toString(36).slice(2))}
function isValidKey(key){return typeof key==="string"&&key.length>0&&!/[.#$[\]\/]/.test(key)}
function categoryName(key){return t(key)||key||t("other")}
function paymentName(key){return t(key)||key||""}
function objectRecords(raw){
 if(!raw||typeof raw!=="object"||Array.isArray(raw))return [];
 return Object.entries(raw).filter(([,v])=>v&&typeof v==="object"&&!Array.isArray(v)).map(([id,v])=>({...v,id:String(v.id||id)}));
}
function addText(parent,className,value){const el=document.createElement("div");el.className=className;el.textContent=String(value??"");parent.appendChild(el);return el}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function cacheLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(expenses))}catch(e){}}

function askConfirm(message,{title=null,yes=null,danger=false}={}){
 if(confirmResolve)return Promise.resolve(false);
 previousFocus=document.activeElement;
 $("confirmTitle").textContent=title||t("confirmTitle");
 $("confirmMessage").textContent=message;
 $("confirmOK").textContent=yes||t("confirmYes");
 $("confirmOK").classList.toggle("danger",!!danger);
 $("confirmModal").style.display="flex";
 $("confirmOK").focus();
 return new Promise(resolve=>{confirmResolve=resolve});
}
function closeConfirm(answer){
 if(!$("confirmModal"))return;
 $("confirmModal").style.display="none";
 const resolve=confirmResolve;confirmResolve=null;
 if(previousFocus&&previousFocus.focus)previousFocus.focus();
 if(resolve)resolve(!!answer);
}
$("confirmOK").addEventListener("click",()=>closeConfirm(true));
$("confirmCancel").addEventListener("click",()=>closeConfirm(false));
$("confirmModal").addEventListener("click",e=>{if(e.target===$("confirmModal"))closeConfirm(false)});
document.addEventListener("keydown",e=>{
 if($("confirmModal").style.display==="flex"&&e.key==="Escape"){e.preventDefault();closeConfirm(false)}
 if($("confirmModal").style.display==="flex"&&e.key==="Enter"&&document.activeElement!==$("confirmCancel")){e.preventDefault();closeConfirm(true)}
});

function detachListeners(){
 if(expenseRef&&expenseCallback)expenseRef.off("value",expenseCallback);
 if(budgetRef&&budgetCallback)budgetRef.off("value",budgetCallback);
 if(trashRef&&trashCallback)trashRef.off("value",trashCallback);
 expenseRef=budgetRef=trashRef=null;
 expenseCallback=budgetCallback=trashCallback=null;
}
async function migrateLegacyIfCloudEmpty(){
 const ref=db.ref(userPath(PATH)),snap=await ref.once("value");
 if(snap.exists()&&snap.val()&&Object.keys(snap.val()).length)return;
 const legacy=loadLocal();if(!legacy.length)return;
 const converted={};
 legacy.forEach(record=>{
  if(!record||typeof record!=="object"||Array.isArray(record))return;
  const id=isValidKey(record.id)?record.id:newId();
  converted[id]={...record,id,createdAt:record.createdAt||Date.now(),updatedAt:Date.now()};
 });
 if(!Object.keys(converted).length)return;
 await ref.transaction(current=>current==null?converted:undefined,undefined,false);
}
function attachListeners(){
 detachListeners();
 expenseRef=db.ref(userPath(PATH));
 expenseCallback=snap=>{
  expenses=objectRecords(snap.val()).filter(x=>!x.deletedAt)
   .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||n(b.createdAt)-n(a.createdAt));
  cacheLocal();renderExpenses();updateBudget();renderChart();
 };
 expenseRef.on("value",expenseCallback,error=>showStatus(t("cloudError")+" "+(error.message||""),"error"));

 budgetRef=db.ref(userPath("house_budget"));
 budgetCallback=snap=>{
  budget=n(snap.val());
  try{localStorage.setItem(LOCAL_BUDGET_KEY,String(budget))}catch(e){}
  $("budgetInput").value=budget||"";updateBudget();
 };
 budgetRef.on("value",budgetCallback,error=>showStatus(t("cloudError")+" "+(error.message||""),"error"));

 trashRef=db.ref(userPath(TRASH_PATH));
 trashCallback=snap=>{
  const raw=snap.val()||{};
  trashItems=Object.entries(raw).map(([id,v])=>v&&typeof v==="object"?{...v,id:String(v.id||id)}:null)
   .filter(v=>v&&v.data&&v.originalPath==="users/"+user.uid+"/"+PATH+"/"+v.id);
  renderTrash();
 };
 trashRef.on("value",trashCallback,error=>showStatus(t("cloudError")+" "+(error.message||""),"error"));
}
async function startCloud(u){
 user=u;
 try{await migrateLegacyIfCloudEmpty();attachListeners();showStatus(t("cloudReady"),"good")}
 catch(e){console.error(e);showStatus(t("cloudError")+" "+(e.message||""),"error")}
}

function filteredExpenses(){
 const query=$("search").value.trim().toLocaleLowerCase();
 const type=$("filterType").value,day=$("dayFilter").value,month=$("monthFilter").value,year=$("yearFilter").value;
 return expenses.filter(x=>{
  const txt=[x.title,x.note,categoryName(x.category),paymentName(x.paymentMethod)].join(" ").toLocaleLowerCase();
  if(!txt.includes(query))return false;
  if(type==="day")return !!day&&x.date===day;
  if(type==="month")return !!month&&String(x.date||"").startsWith(month);
  if(type==="year")return !!year&&String(x.date||"").startsWith(year+"-");
  return true;
 });
}
function updateYears(){
 const select=$("yearFilter"),old=select.value;
 const years=new Set(expenses.map(x=>String(x.date||"").slice(0,4)).filter(x=>/^\d{4}$/.test(x)));
 years.add(String(new Date().getFullYear()));
 select.replaceChildren();
 const first=document.createElement("option");first.value="";first.textContent=t("year");select.appendChild(first);
 [...years].sort().reverse().forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y;select.appendChild(o)});
 if(years.has(old))select.value=old;
}
function renderExpenses(){
 updateYears();
 const list=$("expenseList"),rows=filteredExpenses();list.replaceChildren();
 $("periodTotal").textContent=money(rows.reduce((s,x)=>s+n(x.amount),0));
 $("allTotal").textContent=money(expenses.reduce((s,x)=>s+n(x.amount),0));
 $("filterSummary").textContent=rows.length+" "+t("records");
 if(!rows.length){addText(list,"empty",t("noRecords"));return}
 rows.forEach(x=>{
  const card=document.createElement("article");card.className="expense";
  const top=document.createElement("div");top.className="expense-top";
  const info=document.createElement("div");info.style.minWidth="0";
  addText(info,"expense-name",x.title||"—");addText(info,"",money(x.amount));
  addText(info,"record-meta",[x.date,categoryName(x.category),paymentName(x.paymentMethod)].filter(Boolean).join(" · "));
  if(x.note)addText(info,"record-meta",x.note);
  const actions=document.createElement("div");actions.className="actions";
  const edit=document.createElement("button");edit.type="button";edit.textContent="✎ "+t("edit");edit.onclick=()=>editExpense(x.id);
  const del=document.createElement("button");del.type="button";del.className="danger";del.textContent="🗑 "+t("delete");del.onclick=()=>deleteExpense(x.id);
  actions.append(edit,del);top.append(info,actions);card.appendChild(top);list.appendChild(card);
 });
}
function updateBudget(){
 const spent=expenses.filter(x=>String(x.date||"").startsWith(currentMonth())).reduce((s,x)=>s+n(x.amount),0);
 const pct=budget>0?Math.round(spent/budget*100):0;
 $("budgetPercent").textContent=budget>0?pct+"%":"—";
 $("budgetText").textContent=budget>0?t("thisMonth")+": "+money(spent)+" / "+money(budget):t("budgetNone");
 $("progressBar").style.width=Math.min(pct,100)+"%";
 $("progressBar").style.background=pct>=100?"#ef4444":pct>=80?"#eab308":"var(--accent)";
}
function renderChart(){
 if(!window.Chart)return;
 const totals={};
 filteredExpenses().forEach(x=>{const label=categoryName(x.category||"other");totals[label]=(totals[label]||0)+n(x.amount)});
 if(chart){chart.destroy();chart=null}
 if(!Object.keys(totals).length)return;
 chart=new Chart($("expenseChart"),{
  type:"doughnut",
  data:{labels:Object.keys(totals),datasets:[{data:Object.values(totals)}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:getComputedStyle(document.body).color}}}}
 });
}
function refresh(){renderExpenses();updateBudget();renderChart()}
function resetForm(){
 $("expenseForm").reset();$("editId").value="";$("date").value=localDate();
 $("formTitle").textContent=t("addExpense");$("saveButton").textContent=t("saveExpense");
}
function editExpense(id){
 const item=expenses.find(x=>x.id===id);if(!item)return;
 $("editId").value=id;$("title").value=item.title||"";$("amount").value=item.amount??"";
 $("category").value=item.category||"other";$("payment").value=item.paymentMethod||"cash";
 $("date").value=item.date||localDate();$("note").value=item.note||"";
 $("formTitle").textContent=t("editExpense");$("saveButton").textContent=t("updateExpense");
 window.scrollTo({top:0,behavior:"smooth"});
}
async function saveExpense(event){
 event.preventDefault();clearStatus();
 if(!user){showStatus(t("signIn"),"error");return}
 if(!navigator.onLine){showStatus(t("onlineRequired"),"error");return}
 const title=$("title").value.trim(),amount=Number($("amount").value),date=$("date").value;
 if(!title||!Number.isFinite(amount)||amount<=0||!date)return;
 const editing=!!$("editId").value,id=$("editId").value||db.ref(userPath(PATH)).push().key;
 if(!isValidKey(id)){showStatus(t("saveFailed")+"Invalid record ID.","error");return}
 if(!await askConfirm(editing?t("confirmUpdate"):t("confirmSave")))return;
 const existing=expenses.find(x=>x.id===id);
 const item={...(existing||{}),id,title,amount,category:$("category").value,paymentMethod:$("payment").value,date,note:$("note").value.trim(),createdAt:existing?.createdAt||Date.now(),updatedAt:Date.now()};
 $("saveButton").disabled=true;
 try{
  const result=await db.ref(userPath(PATH+"/"+id)).transaction(old=>{
   if(editing&&old===null)return;
   if(!editing&&old!==null)return;
   return {...(old||{}),...item};
  },undefined,false);
  if(!result.committed)throw new Error(t("occupied"));
  resetForm();showStatus(editing?t("updated"):t("saved"),"good");
 }catch(e){console.error(e);showStatus(t("saveFailed")+(e.message||""),"error")}
 finally{$("saveButton").disabled=false}
}
async function deleteExpense(id){
 const item=expenses.find(x=>x.id===id);if(!item||!user)return;
 if(!navigator.onLine){showStatus(t("onlineRequired"),"error");return}
 if(!await askConfirm(t("deleteQuestion")+"\n\n"+(item.title||""),{danger:true,yes:t("delete")}))return;
 const now=Date.now(),entry={id,category:PATH,recordType:PATH,originalPath:"users/"+user.uid+"/"+PATH+"/"+id,data:{...item,id},deletedAt:now,expiresAt:now+RETENTION,schemaVersion:1};
 try{
  const updates={};updates[PATH+"/"+id]=null;updates[TRASH_PATH+"/"+id]=entry;
  await db.ref(userPath()).update(updates);
 }catch(e){console.error(e);showStatus(t("deleteFailed")+(e.message||""),"error")}
}
async function restoreExpense(id){
 const item=trashItems.find(x=>x.id===id);if(!item||!user)return;
 if(!item.data||item.originalPath!=="users/"+user.uid+"/"+PATH+"/"+item.id){showStatus(t("invalidTrash"),"error");return}
 if(!Number(item.deletedAt)||!Number(item.expiresAt)||Number(item.expiresAt)<=Date.now()){showStatus(t("expired"),"error");return}
 if(!navigator.onLine){showStatus(t("onlineRequired"),"error");return}
 if(!await askConfirm(t("restoreQuestion")+"\n\n"+(item.data.title||"")))return;
 try{
  const result=await db.ref(userPath(PATH+"/"+id)).transaction(current=>current===null?{...item.data,id}:undefined,undefined,false);
  if(!result.committed){showStatus(t("occupied"),"error");return}
  await db.ref(userPath(TRASH_PATH+"/"+id)).remove();
 }catch(e){console.error(e);showStatus(t("restoreFailed")+(e.message||""),"error")}
}
function renderTrash(){
 const list=$("trashList");list.replaceChildren();const now=Date.now();
 trashItems.sort((a,b)=>n(b.deletedAt)-n(a.deletedAt));
 if(!trashItems.length){addText(list,"empty",t("emptyTrash"));return}
 trashItems.forEach(item=>{
  const card=document.createElement("article");card.className="expense";
  const top=document.createElement("div");top.className="expense-top";
  const info=document.createElement("div");info.style.minWidth="0";
  addText(info,"expense-name",item.data?.title||"—");addText(info,"",money(item.data?.amount));
  addText(info,"record-meta",[item.data?.date,categoryName(item.data?.category)].filter(Boolean).join(" · "));
  const left=n(item.expiresAt)-now,expired=left<=0;
  addText(info,"record-meta",expired?t("expired"):Math.ceil(left/86400000)+" "+t("remaining"));
  const btn=document.createElement("button");btn.type="button";btn.textContent="↩ "+t("restore");
  btn.disabled=expired||item.originalPath!=="users/"+user.uid+"/"+PATH+"/"+item.id;
  btn.onclick=()=>restoreExpense(item.id);
  top.append(info,btn);card.appendChild(top);list.appendChild(card);
}

}
