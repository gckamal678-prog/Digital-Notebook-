<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>घर खर्च | Digital Notebook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --card: #151f30;
  --input: #0e1726;
  --border: #29374c;
  --text: #e5edf8;
  --muted: #98a8bd;
  --green: #16a34a;
  --red: #f87171;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 14px;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
.container { max-width: 650px; margin: auto; }
.header {
  background: linear-gradient(135deg,#14532d,#166534);
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 16px;
}
.header h2 { margin: 0 0 8px; }
.header p { margin: 0; color: #dcfce7; }
#status {
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 17px;
  border-radius: 14px;
  margin-bottom: 15px;
  box-shadow: 0 5px 20px #0002;
}
h3 { margin-top: 0; }
label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin: 12px 0 6px;
}
input, select, textarea, button {
  width: 100%;
  padding: 12px;
  border-radius: 9px;
  font-size: 15px;
}
input, select, textarea {
  border: 1px solid var(--border);
  background: var(--input);
  color: var(--text);
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid #22c55e88;
  border-color: #22c55e;
}
textarea { resize: vertical; }
button {
  border: 0;
  background: var(--green);
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}
button:disabled { opacity: .45; cursor: not-allowed; }
.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 15px;
}
.summary .card { margin: 0; }
.amount {
  font-size: 21px;
  font-weight: bold;
  margin-top: 8px;
  overflow-wrap: anywhere;
}
.green { color: #4ade80; }
.red { color: var(--red); }
.expense {
  border: 1px solid var(--border);
  padding: 13px;
  border-radius: 10px;
  margin-top: 10px;
  background: #101a2a;
}
.expense-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.expense-name { font-weight: bold; overflow-wrap: anywhere; }
.expense-meta {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.actions { display: flex; gap: 5px; flex-shrink: 0; }
.small-btn {
  width: 40px;
  margin: 0;
  padding: 9px 5px;
}
.edit-btn { background: #2563eb; }
.delete-btn { background: #dc2626; }
.form-actions { display: flex; gap: 10px; margin-top: 12px; }
.form-actions button { margin-top: 0; }
#cancel-btn { background: #475569; }
#exportBtn { background: #0369a1; }
.empty {
  text-align: center;
  color: var(--muted);
  padding: 18px 0;
  line-height: 1.6;
}
.notice {
  background: #29200e;
  border: 1px solid #854d0e;
  color: #fde68a;
  border-radius: 9px;
  padding: 10px;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 12px;
}
@media(max-width:380px) {
  body { padding: 9px; }
  .summary { grid-template-columns: 1fr; }
  .card { padding: 13px; }
  .header { padding: 16px; }
}
</style>
</head>

<body>
<div class="container">

  <header class="header">
    <h2>🏠 घर खर्च</h2>
    <p>लोकल स्टोरेज र Firebase ब्याकअप प्रणाली</p>
    <div id="status" role="status" aria-live="polite">
      डेटा लोड हुँदैछ...
    </div>
  </header>

  <section class="summary">
    <div class="card">
      <div>आजको खर्च</div>
      <div class="amount red" id="todayTotal">रु. ०</div>
    </div>
    <div class="card">
      <div>जम्मा खर्च</div>
      <div class="amount green" id="allTotal">रु. ०</div>
    </div>
  </section>

  <section class="card">
    <h3 id="form-heading">➕ नयाँ खर्च लेख्नुहोस्</h3>

    <form id="expenseForm">
      <input type="hidden" id="edit-id">

      <label for="title">खर्चको नाम</label>
      <input id="title" type="text" maxlength="200"
        placeholder="जस्तै: तरकारी, चामल, दूध" required>

      <label for="amount">रकम (रु.)</label>
      <input id="amount" type="number" min="0.01" step="0.01"
        placeholder="जस्तै: 250" required>

      <label for="category">खर्चको प्रकार</label>
      <select id="category">
        <option value="खाना तथा किराना">खाना तथा किराना</option>
        <option value="तरकारी">तरकारी</option>
        <option value="बिजुली तथा पानी">बिजुली तथा पानी</option>
        <option value="यातायात">यातायात</option>
        <option value="स्वास्थ्य">स्वास्थ्य</option>
        <option value="शिक्षा">शिक्षा</option>
        <option value="घरायसी सामान">घरायसी सामान</option>
        <option value="अन्य">अन्य</option>
      </select>

      <label for="date">मिति</label>
      <input id="date" type="date" required>

      <label for="note">कैफियत (ऐच्छिक)</label>
      <textarea id="note" rows="2" maxlength="2000"
        placeholder="थप जानकारी..."></textarea>

      <div class="form-actions">
        <button type="button" id="cancel-btn" hidden>रद्द गर्नुहोस्</button>
        <button type="submit" id="saveBtn">
          💾 खर्च सेभ गर्नुहोस्
        </button>
      </div>
    </form>

    <div class="notice">
      डेटा लोकल स्टोरेजमा सेभ हुन्छ र अनलाइन हुँदा Firebase (`users/default_user/house-expense`) मा ब्याकअप हुन्छ।
    </div>
  </section>

  <section class="card">
    <h3>📋 खर्चको विवरण</h3>

    <label for="search">खर्च खोज्नुहोस्</label>
    <input id="search" type="search" placeholder="नाम वा प्रकारबाट खोज्नुहोस्">

    <label for="monthFilter">महिना छान्नुहोस्</label>
    <input id="monthFilter" type="month">

    <div id="expenseList">
      <div class="empty">डेटा लोड हुँदैछ...</div>
    </div>

    <button id="exportBtn" type="button">
      <i class="fa-solid fa-download"></i> खर्च JSON डाउनलोड
    </button>
  </section>

</div>

<!-- Firebase SDK Imports & App Logic -->
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDy-V7RHCTI6uyV4DNDjqoaIBGweg8c",
  authDomain: "digital-a2552.firebaseapp.com",
  databaseURL: "https://digital-a2552-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "digital-a2552",
  storageBucket: "digital-a2552.firebasestorage.app",
  messagingSenderId: "218135618179",
  appId: "1:218135618179:web:821b76920d3e5669ac31b6"
};

const $ = id => document.getElementById(id);
let expenses = [];
let db = null;

function setStatus(message, error = false) {
  $("status").textContent = message;
  $("status").style.color = error ? "#fecaca" : "#dcfce7";
}

function localDate() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
}

function money(value) {
  return "रु. " + Number(value || 0).toLocaleString("en-IN", {
    maximumFractionDigits: 2
  });
}

// LocalStorage बाट डेटा लोड गर्ने
function loadExpensesFromStorage() {
  try {
    const data = localStorage.getItem("local_house_expenses");
    expenses = data ? JSON.parse(data) : [];
  } catch (e) {
    console.error("Load error:", e);
    expenses = [];
  }
}

// LocalStorage मा डेटा सेभ गर्ने
function saveExpensesToStorage() {
  localStorage.setItem("local_house_expenses", JSON.stringify(expenses));
}

// Firebase मा ब्याकअप पठाउने function (users/default_user/house-expense path मा)
async function backupToFirebase() {
  if (!db) return;
  try {
    const dbRef = ref(db, 'users/default_user/house-expense');
    const dataObj = {};
    expenses.forEach(item => {
      dataObj[item.id] = {
        title: item.title,
        amount: item.amount,
        category: item.category,
        date: item.date,
        note: item.note,
        createdAt: item.createdAt,
        updatedAt: item.updatedAt || item.createdAt
      };
    });
    await set(dbRef, dataObj);
    setStatus("✅ लोकल डेटा सेभ भयो र Firebase (`users/default_user/house-expense`) मा ब्याकअप सफल भयो।");
  } catch (err) {
    console.error("Firebase backup error:", err);
    setStatus("⚠️ लोकलमा सेभ भयो, तर इन्टरनेट या Firebase समस्याका कारण ब्याकअप हुन सकेन।", true);
  }
}

// Firebase बाट डेटा सिङ्क गर्ने (पहिलो पटक वा अनलाइन हुँदा)
async function syncFromFirebase() {
  try {
    const dbRef = ref(db, 'users/default_user/house-expense');
    const snapshot = await get(dbRef);
    if (snapshot.exists()) {
      const fbData = snapshot.val();
      const fbList = Object.entries(fbData).map(([id, val]) => ({
        id: id,
        title: val.title || "खर्च",
        amount: Number(val.amount || 0),
        category: val.category || "अन्य",
        date: val.date || localDate(),
        note: val.note || "",
        createdAt: val.createdAt || Date.now(),
        updatedAt: val.updatedAt || Date.now()
      }));
      
      if (fbList.length > 0) {
        expenses = fbList;
        saveExpensesToStorage();
      }
    }
    renderExpenses();
    setStatus("✅ डेटा सफलतापूर्वक लोड र सिङ्क भयो।");
  } catch (err) {
    console.error("Firebase fetch error:", err);
    loadExpensesFromStorage();
    renderExpenses();
    setStatus("ℹ️ अफलाइन मोड: लोकल स्टोरेजबाट डेटा लोड गरिएको छ।", true);
  }
}

// Firebase Initialize गर्ने
try {
  const app = getApps().find(a => a.options.projectId === firebaseConfig.projectId) || initializeApp(firebaseConfig);
  db = getDatabase(app);
  syncFromFirebase();
} catch (e) {
  console.error("Firebase init error:", e);
  loadExpensesFromStorage();
  renderExpenses();
  setStatus("ℹ️ अफलाइन मोड: लोकल स्टोरेज प्रयोग भइरहेको छ।", true);
}

$("date").value = localDate();

function resetForm() {
  $("expenseForm").reset();
  $("edit-id").value = "";
  $("date").value = localDate();
  $("form-heading").textContent = "➕ नयाँ खर्च लेख्नुहोस्";
  $("saveBtn").textContent = "💾 खर्च सेभ गर्नुहोस्";
  $("cancel-btn").hidden = true;
}

$("cancel-btn").addEventListener("click", resetForm);

$("expenseForm").addEventListener("submit", async event => {
  event.preventDefault();

  const title = $("title").value.trim();
  const amount = Number($("amount").value);
  const category = $("category").value;
  const date = $("date").value;
  const note = $("note").value.trim();
  const editId = $("edit-id").value;

  if (!title || !Number.isFinite(amount) || amount <= 0 || !date) {
    setStatus("खर्चको नाम, सही रकम र मिति भर्नुहोस्।", true);
    return;
  }

  if (editId) {
    const index = expenses.findIndex(x => x.id === editId);
    if (index !== -1) {
      expenses[index] = {
        ...expenses[index],
        title,
        amount,
        category,
        date,
        note,
        updatedAt: Date.now()
      };
    }
  } else {
    const newExpense = {
      id: "_" + Math.random().toString(36).substr(2, 9),
      title,
      amount,
      category,
      date,
      note,
      createdAt: Date.now()
    };
    expenses.unshift(newExpense);
  }

  // लोकल स्टोरेजमा सेभ गर्ने
  saveExpensesToStorage();
  renderExpenses();
  resetForm();

  // Firebase मा ब्याकअप गर्ने
  await backupToFirebase();
});

window.editExpense = function(id) {
  const item = expenses.find(x => x.id === id);
  if (!item) return;

  $("edit-id").value = id;
  $("title").value = item.title;
  $("amount").value = item.amount;
  $("category").value = item.category;
  $("date").value = item.date || localDate();
  $("note").value = item.note || "";
  $("form-heading").textContent = "✏️ खर्च सम्पादन गर्नुहोस्";
  $("saveBtn").textContent = "अपडेट गर्नुहोस्";
  $("cancel-btn").hidden = false;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

window.deleteExpense = async function(id) {
  const item = expenses.find(x => x.id === id);
  if (!item) return;

  if (!confirm(`"${item.title}" खर्च मेटाउने हो?`)) return;

  expenses = expenses.filter(x => x.id !== id);
  saveExpensesToStorage();
  renderExpenses();

  // Firebase बाट पनि हटाउने
  if (db) {
    try {
      const itemRef = ref(db, `users/default_user/house-expense/${id}`);
      await remove(itemRef);
      setStatus("✅ खर्च मेटाइयो र Firebase बाट पनि हटाइयो।");
    } catch (e) {
      console.error("Firebase delete error:", e);
      setStatus("✅ लोकलबाट मेटाइयो (Firebase ब्याकअप अपडेट हुन सकेन)।", true);
    }
  } else {
    setStatus("✅ खर्च मेटाइयो।");
  }
}

function renderExpenses() {
  const today = localDate();

  $("todayTotal").textContent = money(
    expenses
      .filter(x => x.date === today)
      .reduce((sum, x) => sum + x.amount, 0)
  );

  $("allTotal").textContent = money(
    expenses.reduce((sum, x) => sum + x.amount, 0)
  );

  const query = $("search").value.trim().toLowerCase();
  const month = $("monthFilter").value;

  const filtered = expenses
    .filter(x =>
      `${x.title} ${x.category} ${x.note}`.toLowerCase().includes(query) &&
      (!month || x.date.startsWith(month))
    );

  const list = $("expenseList");
  list.replaceChildren();

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">कुनै खर्च रेकर्ड भेटिएन।</div>';
    return;
  }

  for (const item of filtered) {
    const card = document.createElement("div");
    card.className = "expense";

    const top = document.createElement("div");
    top.className = "expense-top";

    const info = document.createElement("div");

    const name = document.createElement("div");
    name.className = "expense-name";
    name.textContent = item.title;

    const amount = document.createElement("div");
    amount.className = "amount red";
    amount.textContent = money(item.amount);

    const meta = document.createElement("div");
    meta.className = "expense-meta";
    meta.textContent = `${item.date || "मिति छैन"} • ${item.category}`;

    info.append(name, amount, meta);

    if (item.note) {
      const note = document.createElement("div");
      note.className = "expense-meta";
      note.textContent = item.note;
      info.appendChild(note);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "small-btn edit-btn";
    edit.title = "सम्पादन";
    edit.setAttribute("aria-label", "सम्पादन");
    edit.innerHTML = '<i class="fa-solid fa-pen"></i>';
    edit.setAttribute("onclick", `editExpense('${item.id}')`);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "small-btn delete-btn";
    del.title = "मेटाउनुहोस्";
    del.setAttribute("aria-label", "मेटाउनुहोस्");
    del.innerHTML = '<i class="fa-solid fa-trash"></i>';
    del.setAttribute("onclick", `deleteExpense('${item.id}')`);

    actions.append(edit, del);
    top.append(info, actions);
    card.appendChild(top);
    list.appendChild(card);
  }
}

$("search").addEventListener("input", renderExpenses);
$("monthFilter").addEventListener("input", renderExpenses);

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([
    JSON.stringify({
      exportedAt: new Date().toISOString(),
      path: "users/default_user/house-expense",
      expenses: expenses
    }, null, 2)
  ], { type: "application/json;charset=utf-8" });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "house-expenses-backup.json";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
