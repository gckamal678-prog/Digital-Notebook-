<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Savings</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
};
document.documentElement.classList.add('dark');
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body { font-family: Poppins, sans-serif; }
.toast { animation: toastIn .2s ease-out; }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.modal-backdrop { background: rgba(0,0,0,.7); }
</style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs">

<!-- In-page notification; no browser alert -->
<div id="toast-container" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2"></div>

<!-- HEADER: Back button and app name -->
<header class="sticky top-0 z-40 flex items-center gap-3 px-4 py-3.5 bg-slate-900 border-b border-emerald-500/20 shadow-md">
  <button onclick="goBack()" aria-label="Go back"
    class="w-9 h-9 rounded-lg bg-slate-800 text-white hover:bg-slate-700 flex items-center justify-center">
    <i class="fa-solid fa-arrow-left"></i>
  </button>

  <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center overflow-hidden">
    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover"
      onerror="this.style.display='none'">
    <i class="fa-solid fa-book-open text-white"></i>
  </div>

  <div class="flex-1">
    <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
      Digital NoteBook
    </h1>
    <p class="text-[10px] text-slate-400">Savings</p>
  </div>
</header>

<main class="max-w-5xl mx-auto p-4 md:p-6 space-y-4">

  <div class="flex justify-between items-center px-1 py-1">
    <div>
      <p id="dynamic-date" class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase mb-1"></p>
      <h2 class="text-base md:text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-piggy-bank text-emerald-500"></i>
        <span>Add Savings</span>
      </h2>
    </div>
    <button onclick="toggleSavingsVisibility()" class="px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
      <i id="eye-icon" class="fa-solid fa-eye"></i>
    </button>
  </div>

  <!-- SAVINGS TARGET -->
  <section class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-800">
    <div class="flex justify-between items-center mb-2">
      <span class="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
        <i class="fa-solid fa-bullseye text-emerald-500"></i>
        <span>Savings Target</span>
      </span>
      <button onclick="openTargetModal()" class="text-[10px] bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg text-emerald-500 font-semibold">
        <span>Set Target</span>
      </button>
    </div>
    <div class="flex justify-between items-center text-xs mb-1 font-semibold">
      <span id="target-progress-text" class="text-slate-500 dark:text-slate-400">Rs 0 / Goal Not Set</span>
      <span id="target-percentage" class="text-emerald-500">0%</span>
    </div>
    <div class="w-full bg-slate-200 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
      <div id="target-progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
  </section>

  <!-- SAVINGS MANAGER -->
  <section class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
    <button onclick="toggleAccordion('savings')" class="w-full flex justify-between items-center p-4 text-left font-bold text-sm hover:bg-slate-50 dark:hover:bg-slate-800/50">
      <span class="flex items-center gap-2">
        <i class="fa-solid fa-piggy-bank text-emerald-500"></i>
        <span>Savings Manager</span>
      </span>
      <i id="icon-savings" class="fa-solid fa-chevron-down transition-transform"></i>
    </button>

    <div id="content-savings" class="p-4 md:p-6 border-t border-slate-100 dark:border-slate-800 space-y-4">
      <form id="savings-form" onsubmit="saveSavings(event)" class="space-y-3">
        <input type="hidden" id="edit-savings-index" value="">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2">
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Savings Title</label>
            <input type="text" id="savings-title" required placeholder="e.g. Bank Deposit"
              class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 rounded-xl outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Category</label>
            <select id="savings-category" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-2 rounded-xl outline-none">
              <option value="Bank">🏦 Bank</option>
              <option value="Cash">💵 Cash</option>
              <option value="Investment">📈 Investment</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Amount (NPR / INR)</label>
            <div class="grid grid-cols-2 gap-2">
              <input type="number" min="0" step="any" id="savings-amount-npr" oninput="calculateSavingsTotal()" placeholder="NPR"
                class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 rounded-xl outline-none">
              <input type="number" min="0" step="any" id="savings-amount-inr" oninput="calculateSavingsTotal()" placeholder="INR"
                class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 rounded-xl outline-none">
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Total Amount (NPR)</label>
            <input type="text" id="savings-total-calc" readonly placeholder="Total in NPR"
              class="w-full border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl font-bold outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Date</label>
            <input type="date" id="savings-date" required
              class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 rounded-xl outline-none">
          </div>
        </div>

        <div class="flex gap-2">
          <button type="button" id="savings-cancel-btn" onclick="resetSavingsForm()"
            class="hidden w-1/3 bg-slate-500 text-white p-2.5 rounded-xl">Cancel</button>
          <button type="submit" id="savings-submit-btn"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2.5 rounded-xl transition">Add Savings</button>
        </div>
      </form>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
        <input type="text" id="search-savings" oninput="renderSavings()" placeholder="Search title name..."
          class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none">
        <select id="sort-savings" onchange="renderSavings()"
          class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none">
          <option value="name">Sort by Title (A-Z)</option>
          <option value="total_desc">Highest Total Amount</option>
          <option value="date_desc">Newest Date First</option>
        </select>
      </div>

      <div class="flex justify-end pt-1">
        <button onclick="generateAndShareSavingsPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl font-semibold flex items-center gap-1.5">
          <i class="fa-solid fa-file-pdf"></i> Generate & View PDF
        </button>
      </div>

      <div id="savings-list-container" class="space-y-2 pt-2 max-h-96 overflow-y-auto"></div>

      <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center font-bold mt-2">
        <span>Grand Total Savings:</span>
        <span id="savings-table-total" class="text-emerald-500 text-sm">Rs 0.00</span>
      </div>
    </div>
  </section>

  <!-- RECOVERY / TRASH -->
  <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
    <button onclick="toggleAccordion('recovery')" class="w-full flex justify-between items-center p-4 text-left font-bold text-sm">
      <span class="flex items-center gap-2">
        <i class="fa-solid fa-trash-arrow-up text-amber-500"></i>
        Recovery / Trash
      </span>
      <i id="icon-recovery" class="fa-solid fa-chevron-down"></i>
    </button>
    <div id="content-recovery" class="hidden border-t border-slate-200 dark:border-slate-800 p-4 space-y-2">
      <p class="text-slate-500 dark:text-slate-400 text-[11px]">Deleted savings are kept here until you restore or permanently delete them.</p>
      <div id="trash-list" class="space-y-2"></div>
    </div>
  </section>
</main>

<!-- TARGET MODAL -->
<div id="target-modal" class="fixed inset-0 z-50 modal-backdrop hidden items-center justify-center p-3">
  <div class="bg-white dark:bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xs p-4 space-y-3 shadow-2xl">
    <div class="flex justify-between items-center">
      <h3 class="font-bold text-sm">Set Savings Goal</h3>
      <button onclick="closeTargetModal()" class="text-slate-400 text-base">✕</button>
    </div>
    <label class="block text-[11px] font-semibold text-slate-400">Target Amount (NPR)</label>
    <input type="number" min="0" id="input-target-amount" placeholder="e.g. 100000"
      class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 rounded-xl outline-none">
    <button onclick="saveTargetAmount()" class="w-full py-2 bg-emerald-600 text-white font-bold rounded-xl">Save Target</button>
  </div>
</div>

<!-- PDF MODAL -->
<div id="pdf-modal" class="fixed inset-0 z-50 modal-backdrop hidden items-center justify-center p-3">
  <div class="bg-white dark:bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
    <div class="flex justify-between items-center px-4 py-3 border-b border-slate-200 dark:border-slate-800">
      <h3 class="font-bold text-sm"><i class="fa-solid fa-file-pdf text-emerald-500"></i> Savings Report PDF Preview</h3>
      <button onclick="closePdfModal()" class="text-slate-400 text-base">✕</button>
    </div>
    <div id="pdf-preview-container" class="p-4 overflow-y-auto flex-1 bg-slate-100 flex justify-center"></div>
    <div class="p-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
      <button onclick="downloadPdf()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl">Download PDF</button>
      <button onclick="printFromModal()" class="bg-slate-700 text-white px-4 py-2 rounded-xl">Print</button>
    </div>
  </div>
</div>

<!-- CUSTOM CONFIRM MODAL -->
<div id="confirm-modal" class="fixed inset-0 z-[80] modal-backdrop hidden items-center justify-center p-3">
  <div class="bg-white dark:bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xs p-4 space-y-3 shadow-2xl">
    <h3 id="confirm-title" class="font-bold text-sm">Confirm action</h3>
    <p id="confirm-message" class="text-slate-600 dark:text-slate-300"></p>
    <div class="flex gap-2 justify-end">
      <button onclick="finishConfirm(false)" class="px-4 py-2 rounded-lg bg-slate-200 dark:bg-slate-700">Cancel</button>
      <button onclick="finishConfirm(true)" class="px-4 py-2 rounded-lg bg-rose-600 text-white">Continue</button>
    </div>
  </div>
</div>

<script>
'use strict';

const SAVINGS_KEY = 'digital_notebook_savings';
const TARGET_KEY = 'savings_target_amount';
const TRASH_KEY = 'digital_notebook_trash';
const INR_RATE = 1.6;

let isSavingsHidden = localStorage.getItem('savings_hidden') === 'true';
let confirmResolver = null;

function $(id) {
  return document.getElementById(id);
}

function readArray(key) {
  try {
    const data = JSON.parse(localStorage.getItem(key) || '[]');
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return [];
  }
}

function writeArray(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function showToast(message, type = 'success') {
  const container = $('toast-container');
  const toast = document.createElement('div');
  const icon = type === 'error' ? 'fa-circle-exclamation' :
               type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-check';
  const color = type === 'error' ? 'bg-rose-600' :
                type === 'warning' ? 'bg-amber-600' : 'bg-emerald-600';

  toast.className = `toast ${color} text-white px-4 py-3 rounded-xl shadow-lg max-w-xs flex items-center gap-2`;
  const i = document.createElement('i');
  i.className = `fa-solid ${icon}`;
  const text = document.createElement('span');
  text.textContent = message;
  toast.append(i, text);
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3200);
}

function askConfirm(message, title = 'Confirm action') {
  $('confirm-title').textContent = title;
  $('confirm-message').textContent = message;
  $('confirm-modal').classList.remove('hidden');$('confirm-modal').classList.add('flex');

  return new Promise(resolve => {
    confirmResolver = resolve;
  });
}

function finishConfirm(result) {
  $('confirm-modal').classList.add('hidden');$('confirm-modal').classList.remove('flex');
  if (confirmResolver) {
    const resolve = confirmResolver;
    confirmResolver = null;
    resolve(result);
  }
}

function goBack() {
  if (history.length > 1) history.back();
  else location.href = 'index.html';
}

function toggleAccordion(id) {
  const content = $('content-' + id);
  const icon = $('icon-' + id);
  if (content) content.classList.toggle('hidden');
  if (icon) icon.classList.toggle('rotate-180');
}

window.addEventListener('storage', event => {
  if (event.key === SAVINGS_KEY || event.key === TARGET_KEY || event.key === TRASH_KEY) {
    renderSavings();
    renderTrash();
  }
});

function updateDynamicHeader() {
  const now = new Date();
  const date = now.toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  }).toUpperCase();
  const time = now.toLocaleTimeString('en-US', {
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  });
  $('dynamic-date').textContent = `${date} | ${time}`;
}

function calculateSavingsTotal() {
  const npr = parseFloat($('savings-amount-npr').value) || 0;
  const inr = parseFloat($('savings-amount-inr').value) || 0;
  $('savings-total-calc').value = (npr + inr * INR_RATE).toFixed(2);
}

function saveSavings(event) {
  event.preventDefault();

  const indexValue = $('edit-savings-index').value;
  const title = $('savings-title').value.trim();
  const npr = parseFloat($('savings-amount-npr').value) || 0;
  const inr = parseFloat($('savings-amount-inr').value) || 0;

  if (!title) {
    showToast('Please enter a savings title.', 'warning');
    return;
  }

  if (npr < 0 || inr < 0) {
    showToast('Amount cannot be negative.', 'warning');
    return;
  }

  const savings = readArray(SAVINGS_KEY);
  const item = {
    id: indexValue === '' ? (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) :
      (savings[Number(indexValue)]?.id || String(Date.now())),
    title,
    category: $('savings-category').value,
    npr,
    inr,
    total: npr + inr * INR_RATE,
    date: $('savings-date').value
  };

  if (indexValue === '') {
    savings.unshift(item);
    writeArray(SAVINGS_KEY, savings);
    showToast('Savings added.');
  } else {
    const index = Number(indexValue);
    if (savings[index]) savings[index] = item;
    writeArray(SAVINGS_KEY, savings);
    showToast('Savings updated.');
  }

  resetSavingsForm();
  renderSavings();
}

function resetSavingsForm() {
  $('savings-form').reset();
  $('edit-savings-index').value = '';$('savings-submit-btn').textContent = 'Add Savings';
  $('savings-cancel-btn').classList.add('hidden');$('savings-date').valueAsDate = new Date();
  calculateSavingsTotal();
}

function toggleSavingsVisibility() {
  isSavingsHidden = !isSavingsHidden;
  localStorage.setItem('savings_hidden', String(isSavingsHidden));
  renderSavings();
}

function openTargetModal() {
  $('input-target-amount').value = localStorage.getItem(TARGET_KEY) || '0';
  $('target-modal').classList.remove('hidden');$('target-modal').classList.add('flex');
}

function closeTargetModal() {
  $('target-modal').classList.add('hidden');$('target-modal').classList.remove('flex');
}

function saveTargetAmount() {
  const value = Number($('input-target-amount').value);
  if (!Number.isFinite(value) || value < 0) {
    showToast('Please enter a valid target amount.', 'warning');
    return;
  }

  localStorage.setItem(TARGET_KEY, String(value));
  closeTargetModal();
  renderSavings();
  showToast('Savings target saved on this device.');
}

function money(value) {
  return 'Rs ' + (Number(value) || 0).toFixed(2);
}

function renderSavings() {
  const container = $('savings-list-container');
  if (!container) return;

  const savings = readArray(SAVINGS_KEY);
  const query = $('search-savings').value.trim().toLowerCase();
  const sort = $('sort-savings').value;

  $('eye-icon').className = isSavingsHidden
    ? 'fa-solid fa-eye-slash text-rose-400'
    : 'fa-solid fa-eye text-slate-400';

  container.innerHTML = '';

  let grandTotal = savings.reduce((sum, item) => sum + (Number(item.total) || 0), 0);
  $('savings-table-total').textContent = isSavingsHidden ? 'Rs ••••••' : money(grandTotal);

  if (!savings.length) {
    container.innerHTML = '<p class="text-slate-400 text-center py-4">No savings records found.</p>';
    updateTargetUI(grandTotal);
    return;
  }

  const groups = {};
  savings.forEach((item, index) => {
    const title = String(item.title || 'Untitled');
    const key = title.toLowerCase();
    if (!groups[key]) groups[key] = { name: title, total: 0, items: [] };
    groups[key].total += Number(item.total) || 0;
    groups[key].items.push({ ...item, originalIdx: index });
  });

  let groupArray = Object.values(groups).filter(group =>
    group.name.toLowerCase().includes(query)
  );

  if (sort === 'name') {
    groupArray.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sort === 'total_desc') {
    groupArray.sort((a, b) => b.total - a.total);
  } else if (sort === 'date_desc') {
    groupArray.sort((a, b) =>
      new Date(b.items[0]?.date || 0) - new Date(a.items[0]?.date || 0)
    );
  }

  groupArray.forEach((group, groupIndex) => {
    const card = document.createElement('div');
    card.className = 'bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/60 rounded-xl overflow-hidden';

    const heading = document.createElement('button');
    heading.className = 'w-full flex justify-between items-center p-3 text-left hover:bg-slate-100 dark:hover:bg-slate-800';
    heading.innerHTML = `
      <span>
        <span class="font-bold">${escapeHtml(group.name)}</span>
        <span class="block text-[10px] text-slate-500">${group.items.length} records</span>
      </span>
      <span class="font-bold text-emerald-500">${isSavingsHidden ? 'Rs ••••••' : money(group.total)}</span>`;
    heading.onclick = () => details.classList.toggle('hidden');

    const details = document.createElement('div');
    details.className = 'hidden border-t border-slate-200 dark:border-slate-700 p-2 space-y-1';

    group.items.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(item => {
      const row = document.createElement('div');
      row.className = 'flex flex-wrap justify-between items-center gap-2 py-2 px-1';
      row.innerHTML = `
        <div class="min-w-0">
          <div class="font-semibold">${escapeHtml(item.date || '')} · ${escapeHtml(item.category || '')}</div>
          <div class="text-[10px] text-slate-500">${isSavingsHidden ? 'NPR: ••• | INR: •••' : `NPR: ${Number(item.npr)\vert{}\vert{}0} \vert{} INR:${Number(item.inr)||0}`}</div>
        </div>
        <div class="flex items-center gap-3">
          <span class="font-bold text-emerald-500">${isSavingsHidden ? 'Rs ••••••' : money(item.total)}</span>
          <button class="text-blue-500" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
          <button class="text-rose-500" title="Delete"><i class="fa-solid fa-trash"></i></button>
        </div>`;

      row.querySelector('.text-blue-500').onclick = () => editSavings(item.originalIdx);
      row.querySelector('.text-rose-500').onclick = () => deleteSavings(item.originalIdx);
      details.appendChild(row);
    });

    card.append(heading, details);
    container.appendChild(card);
  });

  updateTargetUI(grandTotal);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function updateTargetUI(currentTotal) {
  const target = Number(localStorage.getItem(TARGET_KEY)) || 0;
  const percent = target > 0 ? Math.min(100, Math.round(currentTotal / target * 100)) : 0;

  $('target-progress-text').textContent = isSavingsHidden
    ? 'Rs •••••• / Rs ••••••'
    : target > 0 ? `${money(currentTotal)} / ${money(target)}` : `${money(currentTotal)} / Goal Not Set`;

  $('target-percentage').textContent = percent + '\%';$('target-progress-bar').style.width = percent + '%';
}

function editSavings(index) {
  const savings = readArray(SAVINGS_KEY);
  const item = savings[index];
  if (!item) return;

  $('edit-savings-index').value = index;
  $('savings-title').value = item.title || '';
  $('savings-category').value = item.category \vert{}\vert{} 'Bank';$('savings-amount-npr').value = item.npr ?? 0;
  $('savings-amount-inr').value = item.inr ?? 0;
  $('savings-total-calc').value = (Number(item.total) \vert{}\vert{} 0).toFixed(2);$('savings-date').value = item.date || '';

  $('savings-submit-btn').textContent = 'Update Savings';
  $('savings-cancel-btn').classList.remove('hidden');$('content-savings').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteSavings(index) {
  const savings = readArray(SAVINGS_KEY);
  const item = savings[index];
  if (!item) return;

  const confirmed = await askConfirm(
    `Move "${item.title}" to Recovery? You can restore it later.`,
    'Delete savings record'
  );
  if (!confirmed) return;

  const trash = readArray(TRASH_KEY);
  trash.unshift({
    ...item,
    trashId: item.id || String(Date.now()),
    deletedAt: new Date().toISOString(),
    originalIndex: index
  });

  savings.splice(index, 1);
  writeArray(TRASH_KEY, trash);
  writeArray(SAVINGS_KEY, savings);

  renderSavings();
  renderTrash();
  showToast('Record moved to Recovery.');
}

function renderTrash() {
  const container = $('trash-list');
  if (!container) return;

  const trash = readArray(TRASH_KEY);
  container.innerHTML = '';

  if (!trash.length) {
    container.innerHTML = '<p class="text-slate-400 text-center py-3">Recovery is empty.</p>';
    return;
  }

  trash.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'flex flex-wrap justify-between items-center gap-2 p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50';
    row.innerHTML = `
      <div>
        <div class="font-bold">${escapeHtml(item.title || 'Untitled')}</div>
        <div class="text-[10px] text-slate-500">${escapeHtml(item.date || '')} · ${money(item.total)}</div>
      </div>
      <div class="flex gap-2">
        <button class="restore-btn px-3 py-1.5 rounded-lg bg-emerald-600 text-white">Restore</button>
        <button class="permanent-btn px-3 py-1.5 rounded-lg bg-rose-600 text-white">Delete forever</button>
      </div>`;

    row.querySelector('.restore-btn').onclick = () => restoreTrashItem(index);
    row.querySelector('.permanent-btn').onclick = () => permanentlyDeleteTrashItem(index);
    container.appendChild(row);
  });
}

async function restoreTrashItem(index) {
  const trash = readArray(TRASH_KEY);
  const item = trash[index];
  if (!item) return;

  const savings = readArray(SAVINGS_KEY);
  const confirmed = await askConfirm(`Restore "${item.title}" to Savings?`, 'Restore record');
  if (!confirmed) return;

  const restored = { ...item };
  delete restored.trashId;
  delete restored.deletedAt;
  delete restored.originalIndex;

  restored.id = restored.id || String(Date.now());
  savings.unshift(restored);
  trash.splice(index, 1);

  writeArray(SAVINGS_KEY, savings);
  writeArray(TRASH_KEY, trash);
  renderSavings();
  renderTrash();
  showToast('Record restored.');
}

async function permanentlyDeleteTrashItem(index) {
  const trash = readArray(TRASH_KEY);
  if (!trash[index]) return;

  const confirmed = await askConfirm(
    'This record will be permanently removed from this device. This cannot be undone.',
    'Delete permanently'
  );
  if (!confirmed) return;

  trash.splice(index, 1);
  writeArray(TRASH_KEY, trash);
  renderTrash();
  showToast('Record permanently deleted.');
}

/* PDF report */
function generateAndShareSavingsPDF() {
  const savings = readArray(SAVINGS_KEY);

  if (!savings.length) {
    showToast('No savings records found to generate PDF.', 'warning');
    return;
  }

  const profileName = localStorage.getItem('profile_name') || 'Digital NoteBook';
  const profileAddress = localStorage.getItem('profile_address') || '';
  const profileMobile = localStorage.getItem('profile_mobile') || '';
  const profileEmail = localStorage.getItem('profile_email') || '';

  let grandTotal = 0;
  let rows = '';

  savings.forEach(item => {
    grandTotal += Number(item.total) || 0;
    rows += `
      <tr>
        <td>${escapeHtml(item.date || '')}</td>
        <td>${escapeHtml(item.title || '')}</td>
        <td>${escapeHtml(item.category || '')}</td>
        <td>${Number(item.npr) || 0}</td>
        <td>${Number(item.inr) || 0}</td>
        <td>Rs ${(Number(item.total) || 0).toFixed(2)}</td>
      </tr>`;
  });

  $('pdf-preview-container').innerHTML = `
    <div id="pdf-printable-content" style="background:#fff;color:#333;font-family:Arial,sans-serif;width:100%;max-width:800px;padding:24px">
      <div style="display:flex;justify-content:space-between;gap:15px;border-bottom:2px solid #16a34a;padding-bottom:15px">
        <div>
          <h2 style="font-size:18px;font-weight:bold">${escapeHtml(profileName)}</h2>
          <p>${escapeHtml(profileAddress)}</p>
          <p>${escapeHtml(profileMobile)}</p>
          <p>${escapeHtml(profileEmail)}</p>
        </div>
        <img src="bannerlogo.png" alt="" style="max-width:150px;max-height:70px;object-fit:contain"
          onerror="this.style.display='none'">
      </div>
      <h2 style="text-align:center;font-size:18px;font-weight:bold;margin:24px 0">SAVINGS REPORT</h2>
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr style="background:#f3f4f6">
          <th style="padding:8px;border:1px solid #ddd">Date</th>
          <th style="padding:8px;border:1px solid #ddd">Title</th>
          <th style="padding:8px;border:1px solid #ddd">Category</th>
          <th style="padding:8px;border:1px solid #ddd">NPR</th>
          <th style="padding:8px;border:1px solid #ddd">INR</th>
          <th style="padding:8px;border:1px solid #ddd">Total (NPR)</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <h3 style="text-align:right;color:#16a34a;margin-top:20px;font-size:16px">Grand Total: Rs ${grandTotal.toFixed(2)}</h3>
      <p style="text-align:center;color:#999;font-size:10px;margin-top:24px">Generated by Digital NoteBook · ${new Date().toLocaleDateString()}</p>
    </div>`;

  $('pdf-modal').classList.remove('hidden');$('pdf-modal').classList.add('flex');
}

function closePdfModal() {
  $('pdf-modal').classList.add('hidden');$('pdf-modal').classList.remove('flex');
}

function downloadPdf() {
  const element = $('pdf-printable-content');
  if (!element || !window.html2pdf) {
    showToast('PDF library is not available. Check your internet connection.', 'error');
    return;
  }

  window.html2pdf().set({
    margin: 8,
    filename: 'Digital-NoteBook-Savings-Report.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(element).save()
    .then(() => showToast('PDF generated.'))
    .catch(() => showToast('Could not generate PDF.', 'error'));
}

function printFromModal() {
  const element = $('pdf-printable-content');
  if (!element) return;

  const printWindow = window.open('', '_blank');
  if (!printWindow) {
    showToast('Allow pop-ups to print the report.', 'warning');
    return;
  }

  printWindow.document.write(`
    <!DOCTYPE html><html><head><title>Savings Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>body{font-family:Arial,sans-serif;padding:20px}table{width:100%;border-collapse:collapse}
    td,th{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body>
    ${element.outerHTML}</body></html>`);
  printWindow.document.close();
  printWindow.focus();
  setTimeout(() => printWindow.print(), 400);
}

/* Startup */
document.addEventListener('DOMContentLoaded', () => {
  renderSavings();
  renderTrash();

  if (!$('savings-date').value)$('savings-date').valueAsDate = new Date();

  setInterval(updateDynamicHeader, 1000);
});
</script>
