<!-- Firebase SDK Modules Import -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
      authDomain: "digital-a2552.firebaseapp.com",
      projectId: "digital-a2552",
      storageBucket: "digital-a2552.firebasestorage.app",
      messagingSenderId: "218135618179",
      appId: "1:218135618179:web:821b76920d3e5669ac31b6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function backupToCloud(userId = "default_user") {
        try {
            const localData = {
                savings: JSON.parse(localStorage.getItem('digital_notebook_savings') || '[]'),
                target: localStorage.getItem('savings_target_amount') || '0',
                theme: localStorage.getItem('theme') || 'dark',
                language: localStorage.getItem('lang') || 'EN',
                updatedAt: new Date().toISOString()
            };
            await set(ref(db, 'users/' + userId), localData);
        } catch (error) {
            console.error("Cloud Backup Error:", error);
        }
    }

    async function restoreFromCloud(userId = "default_user") {
        try {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users/${userId}`));
            if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.savings) localStorage.setItem('digital_notebook_savings', JSON.stringify(data.savings));
                if (data.target) localStorage.setItem('savings_target_amount', data.target);
                if (data.theme) localStorage.setItem('theme', data.theme);
                if (data.language) localStorage.setItem('lang', data.language);
                
                setTimeout(() => location.reload(), 1000);
            }
        } catch (error) {
            console.error("Cloud Restore Error:", error);
        }
    }

    window.handleCloudBackup = () => backupToCloud("default_user");
    window.handleCloudRestore = () => restoreFromCloud("default_user");
</script>

<script>
    let isSavingsHidden = localStorage.getItem('savings_hidden') === 'true';

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        updateDynamicHeader();
        renderSavings();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeUI();
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const timeString = now.toLocaleTimeString('en-US', timeOptions);

        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = `${dateString} | ${timeString}`;
    }

    setInterval(updateDynamicHeader, 1000);

    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        if(content) content.classList.toggle('hidden');
        if(icon) icon.classList.toggle('rotate-180');
    }

    const INR_RATE = 1.6;

    function calculateSavingsTotal() {
        const npr = parseFloat(document.getElementById('savings-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('savings-amount-inr').value) || 0;
        const totalNpr = npr + (inr * INR_RATE);
        document.getElementById('savings-total-calc').value = totalNpr.toFixed(2);
    }

    function saveSavings(event) {
        event.preventDefault();
        const index = document.getElementById('edit-savings-index').value;
        const title = document.getElementById('savings-title').value.trim();
        const category = document.getElementById('savings-category').value;
        const npr = parseFloat(document.getElementById('savings-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('savings-amount-inr').value) || 0;
        const total = parseFloat(document.getElementById('savings-total-calc').value) || 0;
        const date = document.getElementById('savings-date').value;

        let savings = JSON.parse(localStorage.getItem('digital_notebook_savings') || '[]');
        const item = { title, category, npr, inr, total, date };

        if (index === "") {
            savings.unshift(item);
        } else {
            savings[index] = item;
        }

        localStorage.setItem('digital_notebook_savings', JSON.stringify(savings));
        resetSavingsForm();
        renderSavings();
    }

    function resetSavingsForm() {
        document.getElementById('savings-form').reset();
        document.getElementById('edit-savings-index').value = "";
        document.getElementById('savings-submit-btn').innerText = currentLang === 'NEP' ? 'बचत थप्नुहोस्' : 'Add Savings';
        document.getElementById('savings-cancel-btn').classList.add('hidden');
        document.getElementById('savings-date').valueAsDate = new Date();
        calculateSavingsTotal();
    }

    // EYE VISIBILITY FUNCTIONS
    function toggleSavingsVisibility() {
        isSavingsHidden = !isSavingsHidden;
        localStorage.setItem('savings_hidden', isSavingsHidden);
        renderSavings();
    }

    // TARGET MODAL FUNCTIONS
    function openTargetModal() {
        const currentTarget = localStorage.getItem('savings_target_amount') || '0';
        document.getElementById('input-target-amount').value = currentTarget;
        document.getElementById('target-modal').classList.remove('hidden');
    }

    function closeTargetModal() {
        document.getElementById('target-modal').classList.add('hidden');
    }

    function saveTargetAmount() {
        const val = parseFloat(document.getElementById('input-target-amount').value) || 0;
        localStorage.setItem('savings_target_amount', val);
        closeTargetModal();
        renderSavings();
    }

    function renderSavings() {
        const container = document.getElementById('savings-list-container');
        const totalTableEl = document.getElementById('savings-table-total');
        const headerTotalEl = document.getElementById('header-total-savings');
        const eyeIcon = document.getElementById('eye-icon');
        const searchQuery = document.getElementById('search-savings').value.toLowerCase();
        const sortOption = document.getElementById('sort-savings').value;
        if(!container) return;

        let savings = JSON.parse(localStorage.getItem('digital_notebook_savings') || '[]');
        container.innerHTML = '';

        if (eyeIcon) {
            eyeIcon.className = isSavingsHidden ? "fa-solid fa-eye-slash text-rose-400" : "fa-solid fa-eye text-slate-400";
        }

        if (savings.length === 0) {
            container.innerHTML = `<p class="text-slate-400 text-center py-3">${currentLang === 'NEP' ? 'कुनै रेकर्ड फेला परेन।' : 'No savings records found.'}</p>`;
            if(totalTableEl) totalTableEl.innerText = isSavingsHidden ? 'Rs ••••••' : 'Rs 0.00';
            if(headerTotalEl) headerTotalEl.innerText = isSavingsHidden ? 'Rs ••••••' : 'Rs 0.00';
            updateTargetUI(0);
            return;
        }

        let grouped = {};
        savings.forEach((item, originalIdx) => {
            let key = item.title.trim();
            let matchedKey = Object.keys(grouped).find(k => k.toLowerCase() === key.toLowerCase()) || key;
            
            if (!grouped[matchedKey]) {
                grouped[matchedKey] = {
                    name: matchedKey,
                    total: 0,
                    items: []
                };
            }
            grouped[matchedKey].total += item.total;
            grouped[matchedKey].items.push({ ...item, originalIdx });
        });

        let groupArray = Object.values(grouped);

        if (searchQuery) {
            groupArray = groupArray.filter(g => g.name.toLowerCase().includes(searchQuery));
        }

        if (sortOption === 'name') {
            groupArray.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortOption === 'total_desc') {
            groupArray.sort((a, b) => b.total - a.total);
        } else if (sortOption === 'date_desc') {
            groupArray.sort((a, b) => {
                let maxDateA = Math.max(...a.items.map(i => new Date(i.date)));
                let maxDateB = Math.max(...b.items.map(i => new Date(i.date)));
                return maxDateB - maxDateA;
            });
        }

        let grandTotal = 0;

        groupArray.forEach((group, gIdx) => {
            grandTotal += group.total;

            const groupDiv = document.createElement('div');
            groupDiv.className = "bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/60 rounded-xl overflow-hidden mb-2";

            const displayedGroupTotal = isSavingsHidden ? 'Rs ••••••' : `Rs ${group.total.toFixed(2)}`;

            let headerHtml = `
                <div class="flex justify-between items-center p-3 cursor-pointer select-none hover:bg-slate-100 dark:hover:bg-slate-800/80 transition" onclick="toggleGroupLedger('${gIdx}')">
                    <div class="flex items-center gap-2">
                        <i id="icon-${gIdx}" class="fa-solid fa-chevron-right text-[10px] text-slate-400 transition-transform"></i>
                        <div>
                            <h4 class="font-bold text-slate-900 dark:text-white text-xs">${group.name}</h4>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400">${group.items.length} records</p>
                        </div>
                    </div>
                    <span class="font-bold text-emerald-500 text-xs">${displayedGroupTotal}</span>
                </div>
            `;

            let detailsHtml = `<div id="ledger-${gIdx}" class="hidden border-t border-slate-200 dark:border-slate-700/60 divide-y divide-slate-200 dark:divide-slate-700/40 bg-white dark:bg-slate-900/50 p-2 space-y-1.5">`;
            
            group.items.sort((a, b) => new Date(b.date) - new Date(a.date));

            group.items.forEach(item => {
                const displayedItemTotal = isSavingsHidden ? 'Rs ••••••' : `Rs ${item.total.toFixed(2)}`;
                const displayedBreakdown = isSavingsHidden ? 'NPR: ••• | INR: •••' : `NPR: ${item.npr} | INR: ${item.inr}`;

                detailsHtml += `
                    <div class="flex justify-between items-center py-1.5 px-2 text-[11px]">
                        <div>
                            <span class="font-semibold text-slate-700 dark:text-slate-300">${item.date}</span>
                            <span class="text-slate-400 text-[10px] ml-2">(${item.category}) ${displayedBreakdown}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-emerald-500">${displayedItemTotal}</span>
                            <button onclick="event.stopPropagation(); editSavings(${item.originalIdx})" class="text-blue-500 hover:text-blue-600"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="event.stopPropagation(); deleteSavings(${item.originalIdx})" class="text-rose-500 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            detailsHtml += `</div>`;
            groupDiv.innerHTML = headerHtml + detailsHtml;
            container.appendChild(groupDiv);
        });

        const formattedGrandTotal = isSavingsHidden ? 'Rs ••••••' : `Rs ${grandTotal.toFixed(2)}`;
        if(totalTableEl) totalTableEl.innerText = formattedGrandTotal;
        if(headerTotalEl) headerTotalEl.innerText = formattedGrandTotal;

        updateTargetUI(grandTotal);
    }

    function updateTargetUI(currentTotal) {
        const targetAmount = parseFloat(localStorage.getItem('savings_target_amount')) || 0;
        const progressText = document.getElementById('target-progress-text');
        const percentageText = document.getElementById('target-percentage');
        const progressBar = document.getElementById('target-progress-bar');

        if (!progressText || !percentageText || !progressBar) return;

        if (targetAmount <= 0) {
            progressText.innerText = isSavingsHidden ? "Rs •••••• / Goal Not Set" : `Rs ${currentTotal.toFixed(2)} / Goal Not Set`;
            percentageText.innerText = "0%";
            progressBar.style.width = "0%";
            return;
        }

        const percentage = Math.min(100, Math.round((currentTotal / targetAmount) * 100));
        
        progressText.innerText = isSavingsHidden ? 
            `Rs •••••• / Rs ••••••` : 
            `Rs ${currentTotal.toFixed(2)} / Rs ${targetAmount.toFixed(2)}`;
        
        percentageText.innerText = `${percentage}%`;
        progressBar.style.width = `${percentage}%`;
    }

    function toggleGroupLedger(gIdx) {
        const ledger = document.getElementById(`ledger-${gIdx}`);
        const icon = document.getElementById(`icon-${gIdx}`);
        if(ledger.classList.contains('hidden')) {
            ledger.classList.remove('hidden');
            icon.classList.add('rotate-90');
        } else {
            ledger.classList.add('hidden');
            icon.classList.remove('rotate-90');
        }
    }

    function editSavings(idx) {
        let savings = JSON.parse(localStorage.getItem('digital_notebook_savings') || '[]');
        const item = savings[idx];
        if(!item) return;

        document.getElementById('edit-savings-index').value = idx;
        document.getElementById('savings-title').value = item.title;
        document.getElementById('savings-category').value = item.category;
        document.getElementById('savings-amount-npr').value = item.npr;
        document.getElementById('savings-amount-inr').value = item.inr;
        document.getElementById('savings-total-calc').value = item.total;
        document.getElementById('savings-date').value = item.date;

        document.getElementById('savings-submit-btn').innerText = currentLang === 'NEP' ? 'अपडेट गर्नुहोस्' : 'Update Savings';
        document.getElementById('savings-cancel-btn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteSavings(idx) {
        const confirmMsg = currentLang === 'NEP' ? 'के तपाईँ यो रेकर्ड मेट्न चाहनुहुन्छ?' : 'Are you sure you want to delete this record?';
        if (confirm(confirmMsg)) {
            let savings = JSON.parse(localStorage.getItem('digital_notebook_savings') || '[]');
            savings.splice(idx, 1);
            localStorage.setItem('digital_notebook_savings', JSON.stringify(savings));
            renderSavings();
        }
    }

    // PDF बनाउने र प्रिभ्यू देखाउने फंक्सन (नयाँ लेआउटसहित)
    function generateAndShareSavingsPDF() {
        let savings = JSON.parse(localStorage.getItem('digital_notebook_savings') || '[]');
        if(savings.length === 0) {
            alert(currentLang === 'NEP' ? 'कुनै रेकर्ड फेला परेन।' : 'No savings records found to generate PDF.');
            return;
        }

        const profileName = localStorage.getItem('profile_name') || 'Digital NoteBook';
        const profileAddress = localStorage.getItem('profile_address') || '';
        const profileMobile = localStorage.getItem('profile_mobile') || '';
        const profileEmail = localStorage.getItem('profile_email') || '';
        const profileAvatar = localStorage.getItem('profile_avatar') || 'N1024.png';

        let previewContainer = document.getElementById('pdf-preview-container');
        
        let html = `
        <div id="pdf-printable-content" style="background-color: #ffffff; color: #333333; font-family: 'Poppins', sans-serif; width: 100%; max-width: 650px; padding: 25px; border-radius: 12px; box-sizing: border-box;">
            <table style="width: 100%; border-bottom: 2px solid #16a34a; padding-bottom: 15px; margin-bottom: 20px; border-collapse: collapse;">
                <tr>
                    <!-- बायाँतर्फ प्रोफाइल फोटो नामको ঠিক माथि (20%) -->
                    <td style="vertical-align: middle; width: 20%; text-align: center;">
                        <div style="display: inline-block; text-align: center;">
                            <div style="width: 55px; height: 55px; border-radius: 50%; overflow: hidden; border: 2px solid #16a34a; margin: 0 auto 4px auto;">
                                <img src="${profileAvatar}" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                            <div style="font-size: 11px; font-weight: 700; color: #1f2937;">${profileName}</div>
                        </div>
                    </td>

                    <!-- बीचमा bannerlogo.png (55%) -->
                    <td style="vertical-align: middle; text-align: center; width: 55%; padding: 0 10px;">
                        <img src="bannerlogo.png" style="width: 100%; max-width: 100%; height: auto; object-fit: contain; display: inline-block;">
                    </td>

                    <!-- दायाँतर्फ ठेगाना र विवरण व्यवस्थित रूपमा (25%) -->
                    <td style="vertical-align: middle; text-align: left; font-size: 10px; color: #555; line-height: 1.4; width: 25%; padding-left: 10px;">
                        <div>📍 Address: ${profileAddress}</div>
                        <div>📞 Contact: ${profileMobile}</div>
                        <div>✉️ Email: ${profileEmail}</div>
                    </td>
                </tr>
            </table>

            <h2 style="text-align: center; color: #1f2937; margin-bottom: 20px; text-transform: uppercase; font-size: 16px; font-weight: 800; letter-spacing: 1px;">Savings Report</h2>

            <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                <thead>
                    <tr style="background-color: #f3f4f6; color: #374151;">
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Date</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Title</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Category</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">NPR</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">INR</th>
                        <th style="padding: 10px; text-align: left; border-bottom: 1px solid #d1d5db;">Total (NPR)</th>
                    </tr>
                </thead>
                <tbody>`;

        let grandTotal = 0;
        savings.forEach(item => {
            grandTotal += item.total;
            html += `
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 9px;">${item.date}</td>
                    <td style="padding: 9px;">${item.title}</td>
                    <td style="padding: 9px;">${item.category}</td>
                    <td style="padding: 9px;">${item.npr}</td>
                    <td style="padding: 9px;">${item.inr}</td>
                    <td style="padding: 9px; font-weight: bold; color: #16a34a;">Rs ${item.total.toFixed(2)}</td>
                </tr>`;
        });

        html += `
                </tbody>
            </table>

            <div style="margin-top: 20px; text-align: right; font-size: 15px; font-weight: bold; color: #16a34a; border-top: 2px solid #16a34a; padding-top: 15px;">
                Grand Total: Rs ${grandTotal.toFixed(2)}
            </div>
            
            <div style="text-align: center; font-size: 10px; color: #9ca3af; margin-top: 30px; border-top: 1px solid #e5e7eb; padding-top: 10px;">
                Generated by Digital NoteBook | ${new Date().toLocaleDateString('en-NP')}
            </div>
        </div>`;

        previewContainer.innerHTML = html;
        document.getElementById('pdf-modal').classList.remove('hidden');
    }

    function closePdfModal() {
        document.getElementById('pdf-modal').classList.add('hidden');
    }

    function printFromModal() {
        const element = document.getElementById('pdf-printable-content');
        let printWindow = window.open('', '_blank');
        printWindow.document.write('<html><head><title>Savings Report</title></head><body>');
        printWindow.document.write(element.innerHTML);
        printWindow.document.write('</body></html>');
        printWindow.document.close();
        setTimeout(() => {
            printWindow.print();
        }, 500);
    }
    
    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile').value;
        const email = document.getElementById('input-email').value;

        if(name) localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);
        localStorage.setItem('profile_email', email);

        loadUserData();
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || '';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';
        const savedEmail = localStorage.getItem('profile_email') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address').value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;
        if(document.getElementById('input-email')) document.getElementById('input-email').value = savedEmail;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName;
    }

    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
            };
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar') || 'N1024.png';
        ['sidebar-avatar-img', 'header-avatar-img'].forEach(id => {
            const img = document.getElementById(id);
            if(img) img.src = savedImage;
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateThemeUI();
        updateDynamicHeader();
        loadUserData();
        loadAvatar();
        renderSavings();

        const dateInput = document.getElementById('savings-date');
        if(dateInput && !dateInput.value) {
            dateInput.valueAsDate = new Date();
        }
    });
</script>
</body>
</html>
