<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Digital NoteBook</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#0b1220;--panel:#151f31;--field:#1c2940;--text:#edf3ff;--muted:#9cacc5;--line:#2b3a54;--accent:#34d399;--danger:#fb7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Sans Devanagari",sans-serif}
html.light{--bg:#f3f6fb;--panel:#fff;--field:#edf2f9;--text:#152033;--muted:#586780;--line:#d7e0ed;--accent:#047857;--danger:#be123c}
header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:3}
header a{color:var(--text);text-decoration:none;font-size:24px}header b{flex:1}main{max-width:980px;margin:auto;padding:16px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:block;color:var(--muted);font-size:13px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);color:var(--text);width:100%;margin-top:4px}
button{cursor:pointer;font-weight:650}.primary{background:var(--accent);color:#062319}.danger{color:var(--danger)}.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{width:auto}.record{border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{width:auto}.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#166534;color:white;padding:12px 16px;border-radius:12px;z-index:20;max-width:92vw}
.hidden{display:none!important}table{border-collapse:collapse;width:100%;margin-top:10px}td,th{border:1px solid var(--line);padding:7px;text-align:left}.status{font-size:12px;color:var(--muted)}
body.auth-pending main{visibility:hidden}@media(max-width:560px){main{padding:10px}.card{padding:12px}}
</style>
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
</head>

<body data-path="incomes">
<header><a href="index.html" aria-label="पछाडि">←</a><b>📘 Digital NoteBook · Income</b><span class="status" id="status">Authentication जाँच हुँदैछ…</span></header>
<main>
<section class="card"><h2>Income Sources</h2><form id="form"><input id="recordId" type="hidden"><div class="grid">
<label>आम्दानी स्रोत<input id="sourceName" maxlength="120" required></label><label>मिति<input id="date" type="date" required></label>
<label>रकम NPR<input id="npr" type="number" min="0" step=".01" value="0"></label><label>रकम INR<input id="inr" type="number" min="0" step=".01" value="0"></label><label>कुल NPR<input id="total" readonly></label>
</div><p class="muted">INR दर: 1 = 1.6 NPR</p><div class="row"><button class="primary" type="submit">Income सेभ</button><button type="button" id="cancel">रद्द</button><button type="button" id="migrate">पुरानो डाटा सुरक्षित Import</button><button type="button" id="pdf">PDF रिपोर्ट</button></div></form></section>
<section class="card"><h2>Income Ledger</h2><input id="search" placeholder="स्रोत खोज्नुहोस्"><div id="list"></div></section>
<section class="card"><h2>यस पेजको Trash दृश्य</h2><div id="trash"></div></section>
</main>
<script>

const CFG={apiKey:'AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c',authDomain:'digital-a2552.firebaseapp.com',databaseURL:'https://digital-a2552-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'digital-a2552',storageBucket:'digital-a2552.firebasestorage.app',messagingSenderId:'218135618179',appId:'1:218135618179:web:821b76920d3e5669ac31b6'};
if(!firebase.apps.length)firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.database(),$=id=>document.getElementById(id),DAY=86400000;
document.body.classList.add('auth-pending');
let uid=null,items={},trash={},dataListener=null,trashListener=null;
function toast(message,bad=false){const e=document.createElement('div');e.className='toast';e.style.background=bad?'#9f1239':'#166534';e.setAttribute('role','status');e.textContent=message;document.body.append(e);setTimeout(()=>e.remove(),3200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function money(v){return 'NPR '+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function ref(path){if(!uid)throw Error('लगइन जाँच हुँदैछ।');return db.ref('users/'+uid+(path?'/'+path:''))}
function recordValues(){return Object.entries(items||{}).map(([id,v])=>v&&typeof v==='object'?({...v,id:typeof v.id==='string'&&v.id?v.id:id}):null).filter(Boolean)}
async function saveOne(path,id,data,isEdit){
 const result=await ref(path+'/'+id).transaction(old=>{
   if(isEdit&&old===null)return;
   if(!isEdit&&old!==null)return;
   return {...(old||{}),...data,id,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};
 },undefined,false);
 if(!result.committed)throw Error('रेकर्ड परिवर्तन भएको वा हटाइएको छ। सूची refresh गरेर फेरि प्रयास गर्नुहोस्।');
}
async function moveTrash(path,id){
 const item=items[id];if(!item)return toast('रेकर्ड भेटिएन; सूची refresh गर्नुहोस्।',true);
 const now=Date.now(),cat=path.split('/')[0];
 const entry={id,category:cat,recordType:cat,originalPath:'users/'+uid+'/'+path+'/'+id,data:{...item,id},deletedAt:now,expiresAt:now+30*DAY,schemaVersion:1};
 try{const updates={};updates[path+'/'+id]=null;updates['trash/'+cat+'/'+id]=entry;await ref('').update(updates);toast('रेकर्ड Trash मा सारियो। Account बाट ३० दिनभित्र Restore गर्न सकिन्छ।')}
 catch(e){toast('Trash मा सार्न सकिएन: '+e.message,true)}
}
function renderTrash(){
 const root=$('trash');if(!root)return;const arr=[];
 Object.entries(trash||{}).forEach(([cat,g])=>{if(!g||typeof g!=='object')return;Object.entries(g).forEach(([id,v])=>{if(v&&typeof v==='object'&&(v.data||v.originalPath))arr.push({...v,id,category:v.category||cat})})});
 root.innerHTML=arr.sort((a,b)=>n(b.deletedAt)-n(a.deletedAt)).map(v=>`<div class="record"><b>${esc(v.data?.title||v.data?.sourceName||v.data?.party||v.recordType||'रेकर्ड')}</b><p class="muted">म्याद: ${v.expiresAt?new Date(v.expiresAt).toLocaleString():'अज्ञात'}</p><button data-restore="${esc(v.category+'/'+v.id)}" ${n(v.expiresAt)<=Date.now()?'disabled':''}>Restore</button></div>`).join('')||'<p class="muted">Trash खाली छ।</p>';
}
$('trash')?.addEventListener('click',async e=>{
 const b=e.target.closest('[data-restore]');if(!b)return;const [cat,id]=b.dataset.restore.split('/'),v=trash?.[cat]?.[id];
 if(!v||!v.data||n(v.expiresAt)<=Date.now())return toast('यो रेकर्ड Restore गर्न मिल्दैन वा ३० दिनको म्याद सकिएको छ।',true);
 try{const result=await db.ref(v.originalPath).transaction(old=>old===null?v.data:undefined,undefined,false);
 if(!result.committed)return toast('त्यही ID को रेकर्ड पहिल्यै छ; कुनै डाटा overwrite गरिएको छैन।',true);
 await ref('trash/'+cat+'/'+id).remove();toast('रेकर्ड Restore भयो।');
 }catch(err){toast('Restore असफल: '+err.message,true)}
});
function attach(path){
 if(dataListener)ref(path).off('value',dataListener);
 dataListener=s=>{
   const raw=s.val()||{};
   if(Array.isArray(raw)){
     const mapped={};
     raw.forEach(v=>{if(!v||typeof v!=='object')return;let id=typeof v.id==='string'&&v.id&&!/[.#$\[\]\/]/.test(v.id)&&!mapped[v.id]?v.id:ref(path).push().key;mapped[id]={...v,id};});
     items=mapped;
     $('status').textContent='पुरानो रेकर्डको ID मिलाइँदैछ…';
     ref(path).transaction(current=>Array.isArray(current)?mapped:undefined,undefined,false).then(r=>{if(!r.committed)toast('पुरानो सूची बदलिएको हुनाले ID रूपान्तरण रोकियो। refresh गर्नुहोस्।',true)}).catch(e=>toast('ID रूपान्तरण असफल: '+e.message,true));
   }else items=raw&&typeof raw==='object'?raw:{};
   render();$('status').textContent='Cloud Sync · '+new Date().toLocaleTimeString();
 };
 ref(path).on('value',dataListener,e=>{$('status').textContent='Sync त्रुटि';toast('Cloud sync असफल: '+e.message,true)});
 if(trashListener)ref('trash').off('value',trashListener);
 trashListener=s=>{trash=s.val()||{};renderTrash()};
 ref('trash').on('value',trashListener,e=>toast('Trash लोड भएन: '+e.message,true));
}
function exportPdf(title,html){
 if(!window.html2pdf)return toast('PDF library लोड भएन। इन्टरनेट जाँच्नुहोस्।',true);
 const el=document.createElement('div');el.style.cssText='padding:20px;background:white;color:#111;font:12px Arial';el.innerHTML='<h1>'+esc(title)+'</h1>'+html;
 html2pdf().set({margin:8,filename:title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.pdf',html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}}).from(el).save().catch(e=>toast('PDF त्रुटि: '+e.message,true));
}
async function migrateLocalSafely(){
 if(!uid)return toast('पहिले index.html बाट लगइन गर्नुहोस्।',true);
 const path=document.body.dataset.path,key=({'transactions':'digital_notebook_transactions','incomes':'digital_notebook_incomes','savings':'digital_notebook_savings'})[path],marker=ref('migration/local-'+path+'-v2');
 try{
   if((await marker.once('value')).exists())return toast('यस पेजको migration पहिले नै चलाइएको छ।',true);
   const cloud=await ref(path).once('value');if(cloud.exists()&&Object.keys(cloud.val()||{}).length)return toast('Cloud मा डाटा छ; overwrite नहोस् भनेर import रोकियो।',true);
   let old=[];try{const parsed=JSON.parse(localStorage.getItem(key)||'[]');old=Array.isArray(parsed)?parsed:Object.values(parsed||{})}catch(e){return toast('स्थानीय डाटा पढ्न सकिएन। पुरानो डाटा सुरक्षित छ।',true)}
   if(!old.length)return toast('Import गर्न स्थानीय पुरानो डाटा भेटिएन।',true);
   const again=await ref(path).once('value');if(again.exists()&&Object.keys(again.val()||{}).length)return toast('यसबीच Cloud डाटा थपियो; import रोकियो।',true);
   let count=0;
   for(const raw of old){if(!raw||typeof raw!=='object')continue;const id=typeof raw.id==='string'&&raw.id&&!/[.#$\[\]\/]/.test(raw.id)?raw.id:ref(path).push().key;
     const r=await ref(path+'/'+id).transaction(current=>current===null?{...raw,id,createdAt:raw.createdAt||Date.now(),updatedAt:Date.now(),migratedFromLocal:true}:undefined,undefined,false);if(r.committed)count++;
   }
   await marker.set({completedAt:Date.now(),imported:count,source:key});toast('Import पूरा भयो: '+count+' रेकर्ड। स्थानीय पुरानो डाटा मेटाइएको छैन।');
 }catch(e){toast('Migration असफल: '+e.message,true)}
}
$('migrate').addEventListener('click',migrateLocalSafely);
auth.onAuthStateChanged(user=>{
 if(!user){uid=null;window.location.replace('./index.html');return;}
 uid=user.uid;document.body.classList.remove('auth-pending');$('status').textContent='लगइन भयो · Cloud जोडिँदैछ…';attach(document.body.dataset.path);
});
window.addEventListener('offline',()=>{if($('status'))$('status').textContent='अफलाइन — Cloud save रोकिन सक्छ';toast('इन्टरनेट छैन।',true)});
window.addEventListener('online',()=>{if($('status'))$('status').textContent='इन्टरनेट फर्कियो · Sync जाँच हुँदैछ'});

const PATH='incomes',RATE=1.6;
$('date').value=new Date().toISOString().slice(0,10);
function calc(){$('total').value=(n($('npr').value)+n($('inr').value)*RATE).toFixed(2)}
['npr','inr'].forEach(id=>$(id).addEventListener('input',calc));
function reset(){$('form').reset();$('recordId').value='';$('date').value=new Date().toISOString().slice(0,10);$('npr').value='0';$('inr').value='0';calc()}
function render(){
 const q=$('search').value.toLowerCase(),a=recordValues().filter(r=>String(r.sourceName||r.name||'').toLowerCase().includes(q)).sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));
 const sum=a.reduce((s,r)=>s+n(r.total??(n(r.npr)+n(r.inr)*RATE)),0);
 $('list').innerHTML='<h3>खोजिएको कुल: '+money(sum)+'</h3>'+a.map(r=>`<div class="record"><b>${esc(r.sourceName||r.name||'नाम छैन')}</b> · ${esc(r.date)}<p>${money(r.total??(n(r.npr)+n(r.inr)*RATE))}</p><div class="actions"><button data-edit="${esc(r.id)}">Edit</button><button class="danger" data-del="${esc(r.id)}">Trash</button></div></div>`).join('')||'<p class="muted">Income रेकर्ड छैन।</p>';
}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!uid)return;const editing=!!$('recordId').value,id=$('recordId').value||ref(PATH).push().key,data={sourceName:$('sourceName').value.trim(),date:$('date').value,npr:n($('npr').value),inr:n($('inr').value),total:n($('npr').value)+n($('inr').value)*RATE};
 try{await saveOne(PATH,id,data,editing);reset();toast('Income सेभ भयो।')}catch(err){toast('Income सेभ असफल: '+err.message,true)}
});
$('list').addEventListener('click',async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(ed){const r=items[ed.dataset.edit];if(!r)return;$('recordId').value=ed.dataset.edit;$('sourceName').value=r.sourceName||r.name||'';$('date').value=r.date||'';$('npr').value=n(r.npr);$('inr').value=n(r.inr);calc()}if(del)await moveTrash(PATH,del.dataset.del)});
$('search').addEventListener('input',render);$('cancel').addEventListener('click',reset);
$('pdf').addEventListener('click',()=>{const a=recordValues();exportPdf('Income Report','<table><tr><th>Date</th><th>Source</th><th>NPR</th><th>INR</th><th>Total</th></tr>'+a.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.sourceName||r.name)}</td><td>${n(r.npr)}</td><td>${n(r.inr)}</td><td>${n(r.total??(n(r.npr)+n(r.inr)*RATE)).toFixed(2)}</td></tr>`).join('')+'</table>')});
</script></body></html>
