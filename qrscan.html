
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Digital NoteBook - QR Card</title>

<script>
(function () {
  const KEY = "digital_notebook_settings";
  const DEFAULTS = {
    lang: "en",
    theme: "dark",
    font_size: "16",
    font_family: "Poppins",
    accentColor: "#10b981",
    layout: "comfortable"
  };

  let settings = {};
  try {
    settings = JSON.parse(localStorage.getItem(KEY) || "{}");
  } catch (_) {}

  if (!settings || typeof settings !== "object" || Array.isArray(settings)) {
    settings = {};
  }

  settings = { ...DEFAULTS, ...settings };

  document.documentElement.lang = settings.lang === "ne" ? "ne" : "en";
  document.documentElement.classList.toggle("dark", settings.theme !== "light");
  document.documentElement.style.setProperty("--accent", settings.accentColor);
  document.documentElement.style.setProperty(
    "--app-font-size",
    (Number(settings.font_size) || 16) + "px"
  );
  document.documentElement.style.setProperty(
    "--app-font-family",
    JSON.stringify(settings.font_family || "Poppins") + ", Arial, sans-serif"
  );
  document.documentElement.dataset.layout = settings.layout || "comfortable";
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
  --bg: #f1f5f9;
  --panel: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --accent: #10b981;
  --app-font-size: 16px;
  --app-font-family: Poppins, Arial, sans-serif;
}

html.dark {
  --bg: #020617;
  --panel: #0f172a;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --line: #1e293b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--app-font-family);
  font-size: var(--app-font-size);
}

button, a {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.back {
  color: var(--text);
  text-decoration: none;
  font-size: 27px;
  line-height: 1;
  padding: 2px 5px;
}

.brand {
  font-size: 1em;
  font-weight: 700;
  letter-spacing: .2px;
}

main {
  width: min(700px, 100%);
  margin: 0 auto;
  padding: 16px;
  display: grid;
  gap: 14px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
}

.card-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

h1, h2, p {
  margin-top: 0;
}

h1 {
  font-size: 1.2em;
  margin-bottom: 6px;
}

h2 {
  font-size: 1em;
  margin-bottom: 8px;
}

.muted {
  color: var(--muted);
  font-size: .88em;
  line-height: 1.6;
}

.accent {
  color: var(--accent);
  font-weight: 700;
  overflow-wrap: anywhere;
}

.share-button {
  border: 0;
  border-radius: 10px;
  padding: 10px 13px;
  color: #052e25;
  background: var(--accent);
  font-weight: 700;
  font-size: .85em;
}

.qr-area {
  display: flex;
  justify-content: center;
  padding: 10px 0;
}

.qr-frame {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  padding: 12px;
  border-radius: 12px;
  min-width: 184px;
  min-height: 184px;
}

#qrcode {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 160px;
  min-height: 160px;
}

#qrcode img, #qrcode canvas {
  display: block;
  max-width: 100%;
  height: auto;
}

.qr-logo {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 38px;
  height: 38px;
  border: 3px solid #fff;
  border-radius: 50%;
  object-fit: cover;
  background: #fff;
  pointer-events: none;
}

.status {
  display: none;
  padding: 11px 13px;
  border-radius: 10px;
  font-size: .88em;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.status.show {
  display: block;
}

.status.error {
  color: #be123c;
  background: #fff1f2;
  border: 1px solid #fecdd3;
}

.status.info {
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
}

body[data-layout="compact"] main {
  padding: 8px;
  gap: 8px;
}

body[data-layout="compact"] .card {
  padding: 12px;
  border-radius: 12px;
}

body[data-layout="comfortable"] main {
  gap: 14px;
}

body[data-layout="comfortable"] .card {
  padding: 18px;
}

@media (max-width: 480px) {
  header {
    padding: 12px;
  }

  main {
    padding: 10px;
  }

  .card {
    padding: 14px;
  }

  .card-heading {
    align-items: flex-start;
  }

  .share-button {
    padding: 9px;
  }
}
</style>
</head>

<body>
<header>
  <a class="back" href="#" id="backButton" aria-label="Back" title="Back">←</a>
  <div class="brand">📘 Digital NoteBook</div>
</header>

<main>
  <div id="pageError" class="status error" role="alert" aria-live="polite"></div>

  <section class="card">
    <div class="card-heading">
      <div>
        <h1 id="profileName">Digital NoteBook</h1>
        <p class="muted" id="cardSubtitle">Digital Card</p>
      </div>
      <button type="button" class="share-button" id="shareButton">
        ↗ <span data-i18n="share">Share Card</span>
      </button>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="qrTitle">Digital Card QR</h2>
    <p class="muted" data-i18n="scanHint">
      Scan this QR code to visit the digital card website.
    </p>

    <div class="qr-area">
      <div id="qrCapture" class="qr-frame">
        <div id="qrcode" aria-label="Digital Card QR Code"></div>
        <img class="qr-logo" src="N1024.png" alt="Digital NoteBook">
      </div>
    </div>

    <p class="muted" style="text-align:center;margin-bottom:0">
      <span data-i18n="visit">Visit</span>
      <span id="cardUrlText" class="accent">https://info.kamalgc.com.np</span>
    </p>
  </section>
</main>

<script>
"use strict";

const SETTINGS_KEY = "digital_notebook_settings";
const CARD_URL = "https://info.kamalgc.com.np";

const TEXT = {
  en: {
    share: "Share Card",
    qrTitle: "Digital Card QR",
    scanHint: "Scan this QR code to visit the digital card website.",
    visit: "Visit",
    shareTitle: "Digital NoteBook Card",
    shareText: "Visit my digital card:",
    qrUnavailable: "QR Code could not be generated. Check your internet connection and reload this page.",
    shareUnavailable: "Sharing is not supported by this browser. You can copy the website address shown below.",
    shareFailed: "The card could not be shared. Please try again.",
    canvasFailed: "The QR image could not be prepared. You can still share the website address.",
    back: "Back",
    unnamed: "Digital NoteBook"
  },
  ne: {
    share: "कार्ड सेयर",
    qrTitle: "डिजिटल कार्ड QR",
    scanHint: "डिजिटल कार्डको वेबसाइट खोल्न यो QR कोड स्क्यान गर्नुहोस्।",
    visit: "वेबसाइट",
    shareTitle: "Digital NoteBook कार्ड",
    shareText: "मेरो डिजिटल कार्ड हेर्नुहोस्:",
    qrUnavailable: "QR Code बनाउन सकिएन। इन्टरनेट जाँचेर पेज फेरि खोल्नुहोस्।",
    shareUnavailable: "यो ब्राउजरमा Share सुविधा उपलब्ध छैन। तलको वेबसाइट ठेगाना प्रयोग गर्नुहोस्।",
    shareFailed: "कार्ड सेयर गर्न सकिएन। फेरि प्रयास गर्नुहोस्।",
    canvasFailed: "QR को तस्वीर बनाउन सकिएन। वेबसाइट ठेगाना भने सेयर गर्न सक्नुहुन्छ।",
    back: "पछाडि",
    unnamed: "Digital NoteBook"
  }
};

let preferences = readPreferences();
let qrInstance = null;

function readPreferences() {
  const defaults = {
    lang: "en",
    theme: "dark",
    font_size: "16",
    font_family: "Poppins",
    accentColor: "#10b981",
    layout: "comfortable"
  };

  try {
    const stored = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    if (!stored || typeof stored !== "object" || Array.isArray(stored)) {
      return { ...defaults };
    }
    return { ...defaults, ...stored };
  } catch (_) {
    return { ...defaults };
  }
}

function tr(key) {
  const language = preferences.lang === "ne" ? "ne" : "en";
  return (TEXT[language] && TEXT[language][key]) || TEXT.en[key] || key;
}

function applyPreferences() {
  const html = document.documentElement;

  html.lang = preferences.lang === "ne" ? "ne" : "en";
  html.classList.toggle("dark", preferences.theme !== "light");

  html.style.setProperty(
    "--accent",
    /^#[0-9a-f]{6}$/i.test(preferences.accentColor || "")
      ? preferences.accentColor
      : "#10b981"
  );

  const fontSize = Number(preferences.font_size);
  html.style.setProperty(
    "--app-font-size",
    (fontSize >= 10 && fontSize <= 30 ? fontSize : 16) + "px"
  );

  const allowedFonts = ["Poppins", "Arial", "Roboto", "Georgia", "system-ui"];
  const font = allowedFonts.includes(preferences.font_family)
    ? preferences.font_family
    : "Poppins";

  html.style.setProperty(
    "--app-font-family",
    JSON.stringify(font) + ", Arial, sans-serif"
  );

  document.body.dataset.layout =
    preferences.layout === "compact" ? "compact" : "comfortable";

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.getAttribute("data-i18n");
    element.textContent = tr(key);
  });

  document.getElementById("backButton").title = tr("back");
  document.getElementById("backButton").setAttribute("aria-label", tr("back"));
  document.title = "Digital NoteBook - " + tr("qrTitle");
}

function showError(message) {
  const errorBox = document.getElementById("pageError");
  errorBox.textContent = message;
  errorBox.className = "status error show";
}

function clearError() {
  const errorBox = document.getElementById("pageError");
  errorBox.textContent = "";
  errorBox.className = "status error";
}

function loadProfile() {
  let name = "KAMAL G.C.";

  try {
    name = (localStorage.getItem("profile_name") || "").trim() || name;
  } catch (_) {}

  document.getElementById("profileName").textContent = name;
}

function generateQR() {
  const container = document.getElementById("qrcode");
  container.replaceChildren();

  if (typeof QRCode === "undefined") {
    showError(tr("qrUnavailable"));
    return;
  }

  try {
    qrInstance = new QRCode(container, {
      text: CARD_URL,
      width: 160,
      height: 160,
      colorDark: "#111827",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    window.setTimeout(() => {
      if (!container.querySelector("canvas, img")) {
        showError(tr("qrUnavailable"));
      } else {
        clearError();
      }
    }, 500);
  } catch (error) {
    console.error("QR generation failed:", error);
    showError(tr("qrUnavailable"));
  }
}

async function shareCard() {
  clearError();

  if (!navigator.share) {
    showError(tr("shareUnavailable"));
    return;
  }

  const shareData = {
    title: tr("shareTitle"),
    text: tr("shareText"),
    url: CARD_URL
  };

  try {
    const capture = document.getElementById("qrCapture");

    if (window.html2canvas && navigator.canShare && typeof File !== "undefined") {
      try {
        const canvas = await html2canvas(capture, {
          backgroundColor: "#ffffff",
          scale: 2,
          useCORS: true
        });

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));

        if (blob) {
          const file = new File([blob], "digital-card-qr.png", {
            type: "image/png"
          });

          if (navigator.canShare({ files: [file] })) {
            shareData.files = [file];
          }
        }
      } catch (imageError) {
        console.warn("QR image export unavailable:", imageError);
      }
    }

    await navigator.share(shareData);
  } catch (error) {
    if (error && error.name === "AbortError") {
      return;
    }

    console.error("Sharing failed:", error);
    showError(tr("shareFailed"));
  }
}

/* Back navigation only; no lock, password, logout or authentication code. */
document.getElementById("backButton").addEventListener("click", event => {
  event.preventDefault();

  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "index.html";
  }
});

document.getElementById("shareButton").addEventListener("click", shareCard);

window.addEventListener("storage", event => {
  if (event.key !== SETTINGS_KEY) return;

  preferences = readPreferences();
  applyPreferences();
});

window.addEventListener("pageshow", () => {
  preferences = readPreferences();
  applyPreferences();
});

applyPreferences();
loadProfile();
document.getElementById("cardUrlText").textContent = CARD_URL;
generateQR();
</script>
</body>
</html>
